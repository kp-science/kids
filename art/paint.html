<!doctype html>
<html lang="th">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<link rel="apple-touch-icon" href="../apple-touch-icon.png">
<link rel="icon" type="image/png" href="../favicon.png">
<title>ห้องวาดภาพ</title>
<link rel="stylesheet" href="../vendor/fonts/fonts.css">
<style>
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
:root{--paper:#FFF8F2;--ink:#2A2440;--mute:#7A7290;--line:#EDE4F0;--cd:#B4551C;--cl:#FFEDE4;--ac:#6E3CC0}
body{background:var(--paper);color:var(--ink);font-family:'Noto Sans Thai Looped','Noto Sans Thai',sans-serif;
  font-size:18px;line-height:1.5;-webkit-text-size-adjust:100%;-webkit-user-select:none;user-select:none}
button{font:inherit;color:inherit;cursor:pointer}
.top{position:sticky;top:0;z-index:20;background:rgba(255,248,242,.95);backdrop-filter:blur(6px);
  border-bottom:1px solid var(--line);padding-top:env(safe-area-inset-top)}
.top .in{max-width:980px;margin:0 auto;padding:8px 14px;display:flex;align-items:center;gap:8px}
.pill{text-decoration:none;color:var(--ink);border:2px solid var(--ink);background:#fff;border-radius:12px;padding:3px 12px;font-size:.9rem;font-weight:700;white-space:nowrap}
.top .tt{flex:1;font-family:'Mali',sans-serif;font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.wrap{max-width:980px;margin:0 auto;padding:12px 14px 50px}
.modes{display:flex;gap:8px;justify-content:center;flex-wrap:wrap;margin-bottom:12px}
.modes button{border:3px solid var(--line);background:#fff;border-radius:999px;padding:6px 18px;font-weight:700}
.modes button.on{background:var(--cd);border-color:var(--cd);color:#fff}
.pics{display:flex;gap:10px;overflow-x:auto;padding:4px 2px 10px;scrollbar-width:none}
.pics::-webkit-scrollbar{display:none}
.pics button{flex:0 0 auto;width:88px;border:3px solid var(--line);background:#fff;border-radius:18px;padding:4px;display:flex;flex-direction:column;align-items:center;font-size:.75rem;font-weight:700}
.pics button svg{width:72px;height:72px}
.pics button.on{border-color:var(--cd);background:var(--cl)}
.studio{background:#fff;border-radius:28px;padding:12px;box-shadow:0 10px 26px rgba(42,36,64,.08)}
.tools{display:flex;gap:8px;flex-wrap:wrap;justify-content:center;margin-bottom:10px}
.tools button{min-width:56px;height:56px;border:3px solid var(--line);background:#fff;border-radius:18px;font-size:1.6rem;display:grid;place-items:center;padding:0 6px}
.tools button.on{border-color:var(--ac);background:#F4EEFF;box-shadow:0 3px 0 var(--ac)}
.tools .sep{width:2px;background:var(--line);margin:4px 2px}
.tools .sz{font-size:1rem}
.tools .sz i{display:block;border-radius:50%;background:var(--ink)}
.paper{position:relative;width:min(100%,calc(100vh - 330px),760px);min-width:280px;aspect-ratio:1;margin:0 auto;border-radius:20px;overflow:hidden;
  background:#fff;box-shadow:inset 0 0 0 2px var(--line);touch-action:none}
.paper canvas{position:absolute;inset:0;width:100%;height:100%}
#lines{pointer-events:none}
.pal{display:grid;grid-template-columns:repeat(9,minmax(0,1fr));gap:8px;max-width:640px;margin:12px auto 0}
.pal button{aspect-ratio:1;border-radius:50%;border:4px solid #fff;box-shadow:0 0 0 2px var(--line)}
.pal button.on{box-shadow:0 0 0 4px var(--ink);transform:scale(1.08)}
.acts{display:flex;gap:10px;justify-content:center;flex-wrap:wrap;margin-top:12px}
.btn{border:0;border-radius:999px;padding:10px 20px;font-weight:700;background:var(--cd);color:#fff;box-shadow:0 4px 0 rgba(0,0,0,.18)}
.btn.soft{background:#fff;color:var(--cd);border:2px solid var(--cd);box-shadow:none}
.btn:active{transform:translateY(3px);box-shadow:none}
.gal{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:12px}
.gal button{border:0;background:#fff;border-radius:20px;padding:6px;box-shadow:0 6px 16px rgba(42,36,64,.08)}
.gal img{display:block;width:100%;aspect-ratio:1;border-radius:14px;object-fit:cover}
.gal small{display:block;font-weight:700;font-size:.78rem;color:var(--mute);padding-top:4px}
.empty{text-align:center;color:var(--mute);padding:40px 10px;font-weight:700}
.view{position:fixed;inset:0;z-index:50;background:rgba(42,36,64,.55);display:none;align-items:center;justify-content:center;padding:16px}
.view.show{display:flex}
.view .card{background:#fff;border-radius:26px;padding:12px;max-width:640px;width:100%}
.view img{display:block;width:100%;border-radius:16px}
.toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);background:var(--ink);color:#fff;border-radius:999px;padding:8px 18px;font-weight:700;opacity:0;transition:opacity .3s;z-index:60;pointer-events:none}
.toast.show{opacity:1}
[hidden]{display:none!important}
@media (max-width:560px){.tools button{min-width:46px;height:46px;font-size:1.3rem;border-radius:14px}.pal{grid-template-columns:repeat(9,minmax(0,1fr));gap:5px}.paper{width:100%}}
</style>
</head>
<body>
<header class="top"><div class="in"><a class="pill" href="../#%E0%B8%A8%E0%B8%B4%E0%B8%A5%E0%B8%9B%E0%B8%B0">‹ หน้ารวม</a>
  <div class="tt">🎨 ห้องวาดภาพ</div><button class="pill" id="mute" type="button">🔊</button></div></header>

<main class="wrap">
  <nav class="modes" id="modes">
    <button type="button" data-m="color" class="on">🖍️ ระบายสีภาพ</button>
    <button type="button" data-m="free">✏️ วาดอิสระ</button>
    <button type="button" data-m="gallery">🖼️ ผลงานของหนู</button>
  </nav>

  <section id="studio">
    <div class="pics" id="pics"></div>
    <div class="studio">
      <div class="tools" id="tools"></div>
      <div class="paper" id="paper"><canvas id="paint" width="1024" height="1024"></canvas><canvas id="lines" width="1024" height="1024"></canvas></div>
      <div class="pal" id="pal"></div>
      <div class="acts">
        <button class="btn soft" id="undo" type="button">↩️ ย้อนกลับ</button>
        <button class="btn soft" id="wipe" type="button">🧽 ล้างหน้า</button>
        <button class="btn" id="save" type="button">💾 เก็บผลงาน</button>
      </div>
    </div>
  </section>

  <section id="gallery" hidden><div class="gal" id="gal"></div></section>
</main>

<div class="view" id="view"><div class="card"><img id="vimg" alt="ผลงาน">
  <div class="acts"><button class="btn" id="vshare" type="button">📤 บันทึกลงไอแพด</button><button class="btn soft" id="vdel" type="button">🗑️ ลบ</button><button class="btn soft" id="vclose" type="button">✖ ปิด</button></div></div></div>
<div class="toast" id="toast"></div>

<script>
const $ = s => document.querySelector(s);
const SZ = 1024;
function say(t){ try{ speechSynthesis.cancel(); const u = new SpeechSynthesisUtterance(t); u.lang = 'th-TH'; u.rate = .95; speechSynthesis.speak(u); }catch(e){} }
function toast(t){ const el = $('#toast'); el.textContent = t; el.classList.add('show'); clearTimeout(toast.h); toast.h = setTimeout(() => el.classList.remove('show'), 1800); }

/* ---------------- ภาพลายเส้น (วาดเอง viewBox 400×400 · ทุกช่องต้องปิดสนิทจึงเทสีได้) ---------------- */
const star = (cx, cy, r, n=5) => { let d = ''; for(let i=0;i<n*2;i++){ const a = i*Math.PI/n - Math.PI/2, q = i%2 ? r*.45 : r; d += (i?'L':'M')+(cx+q*Math.cos(a)).toFixed(1)+' '+(cy+q*Math.sin(a)).toFixed(1); } return '<path d="'+d+'Z"/>'; };
const ring = (cx, cy, R, r, n) => Array.from({length:n}, (_,i) => { const a = i/n*Math.PI*2; return '<circle cx="'+(cx+R*Math.cos(a)).toFixed(1)+'" cy="'+(cy+R*Math.sin(a)).toFixed(1)+'" r="'+r+'"/>'; }).join('');
const PICS = [
  { id:'cat', n:'แมวเหมียว', svg:
    '<path d="M103 159 L115 52 L162 110"/><path d="M297 159 L285 52 L238 110"/><path d="M111 148 L128 82 L149 115"/><path d="M289 148 L272 82 L251 115"/>'+
    '<circle cx="200" cy="215" r="112"/><ellipse cx="155" cy="195" rx="20" ry="26"/><ellipse cx="245" cy="195" rx="20" ry="26"/><circle cx="160" cy="188" r="6"/><circle cx="250" cy="188" r="6"/>'+
    '<path d="M186 238 L214 238 L200 254 Z"/><path d="M200 254 Q188 280 166 266 M200 254 Q212 280 234 266"/>'+
    '<path d="M120 236 L60 226 M120 250 L58 256 M280 236 L340 226 M280 250 L342 256"/><ellipse cx="128" cy="262" rx="20" ry="12"/><ellipse cx="272" cy="262" rx="20" ry="12"/>' },
  { id:'fish', n:'ปลาน้อย', svg:
    '<path d="M296 200 L384 126 L372 200 L384 274 Z"/><ellipse cx="180" cy="200" rx="130" ry="86"/>'+
    '<path d="M150 118 Q190 52 250 126"/><path d="M160 282 Q190 330 230 280"/><path d="M200 110 Q226 200 200 290"/><path d="M250 122 Q272 200 250 278"/>'+
    '<circle cx="104" cy="182" r="16"/><circle cx="108" cy="178" r="6"/><path d="M64 216 Q80 230 96 222"/>'+
    '<circle cx="60" cy="110" r="14"/><circle cx="84" cy="70" r="10"/><circle cx="54" cy="44" r="7"/>' },
  { id:'house', n:'บ้านของหนู', svg:
    '<rect x="252" y="80" width="34" height="80"/><path d="M76 190 L200 70 L324 190 Z"/><rect x="100" y="188" width="200" height="164"/>'+
    '<rect x="174" y="262" width="52" height="90"/><circle cx="216" cy="308" r="5"/><rect x="118" y="212" width="46" height="46"/><path d="M141 212 V258 M118 235 H164"/>'+
    '<rect x="236" y="212" width="46" height="46"/><path d="M259 212 V258 M236 235 H282"/><circle cx="200" cy="140" r="20"/>'+
    '<circle cx="345" cy="58" r="30"/><path d="M0 352 H400"/><path d="M40 352 Q30 320 50 300 Q70 320 60 352 Z"/><path d="M340 352 Q330 320 350 300 Q370 320 360 352 Z"/>' },
  { id:'butterfly', n:'ผีเสื้อ', svg:
    '<path d="M194 176 C120 60 34 92 66 184 C86 234 160 222 194 204 Z"/><path d="M206 176 C280 60 366 92 334 184 C314 234 240 222 206 204 Z"/>'+
    '<path d="M194 216 C128 230 76 300 128 324 C170 338 190 284 196 242 Z"/><path d="M206 216 C272 230 324 300 272 324 C230 338 210 284 204 242 Z"/>'+
    '<circle cx="112" cy="150" r="24"/><circle cx="288" cy="150" r="24"/><circle cx="140" cy="288" r="16"/><circle cx="260" cy="288" r="16"/>'+
    '<ellipse cx="200" cy="205" rx="15" ry="92"/><path d="M194 118 Q170 72 148 58 M206 118 Q230 72 252 58"/><circle cx="144" cy="54" r="9"/><circle cx="256" cy="54" r="9"/>' },
  { id:'flower', n:'ดอกไม้', svg:
    '<rect x="192" y="180" width="16" height="190"/><path d="M200 300 Q138 256 112 298 Q156 336 200 312 Z"/><path d="M200 262 Q262 218 288 260 Q244 298 200 274 Z"/>'+
    ring(200, 145, 70, 40, 8)+'<circle cx="200" cy="145" r="36"/><path d="M60 370 H340 L320 396 H80 Z"/>' },
  { id:'rocket', n:'จรวดไปอวกาศ', svg:
    '<path d="M165 300 Q200 392 235 300 Z"/><path d="M152 228 L98 322 L156 300 Z"/><path d="M248 228 L302 322 L244 300 Z"/>'+
    '<path d="M200 36 C262 100 262 222 250 300 L150 300 C138 222 138 100 200 36 Z"/><path d="M162 96 H238"/><circle cx="200" cy="168" r="32"/><circle cx="200" cy="168" r="20"/>'+
    star(62, 70, 26)+star(338, 110, 22)+star(330, 300, 18)+star(70, 230, 16)+'<circle cx="340" cy="40" r="18"/>' },
  { id:'tree', n:'ต้นไม้ (ราก ลำต้น ใบ)', svg:
    '<rect x="178" y="214" width="44" height="128"/><circle cx="200" cy="146" r="82"/><circle cx="130" cy="184" r="50"/><circle cx="270" cy="184" r="50"/>'+
    '<circle cx="168" cy="120" r="12"/><circle cx="236" cy="132" r="12"/><circle cx="200" cy="190" r="12"/><circle cx="120" cy="188" r="10"/><circle cx="282" cy="186" r="10"/>'+
    '<path d="M0 342 H400"/><path d="M188 342 Q170 370 140 392 M212 342 Q232 370 262 392 M200 342 V396 M180 342 Q150 352 118 360 M220 342 Q252 352 284 360"/>' },
  { id:'turtle', n:'เต่าน้อย', svg:
    '<path d="M76 262 L44 274 L80 270 Z"/><ellipse cx="118" cy="278" rx="24" ry="16"/><ellipse cx="282" cy="278" rx="24" ry="16"/><circle cx="342" cy="238" r="30"/><circle cx="350" cy="230" r="5"/>'+
    '<path d="M74 264 Q200 66 326 264 Z"/><path d="M200 140 L236 162 L236 204 L200 226 L164 204 L164 162 Z"/><path d="M200 140 L200 100 M236 162 L274 146 M236 204 L290 230 M164 204 L110 230 M164 162 L126 146 M200 226 L200 264"/>' },
  { id:'icecream', n:'ไอศกรีม', svg:
    '<path d="M138 226 L262 226 L200 384 Z"/><path d="M154 266 L246 266 M170 306 L230 306"/>'+
    '<ellipse cx="200" cy="214" rx="78" ry="44"/><circle cx="200" cy="146" r="58"/><circle cx="200" cy="80" r="16"/><path d="M204 64 Q214 38 236 30"/>'+
    '<circle cx="176" cy="132" r="5"/><circle cx="222" cy="150" r="5"/><circle cx="196" cy="172" r="5"/><circle cx="160" cy="214" r="5"/><circle cx="240" cy="206" r="5"/>' },
  { id:'car', n:'รถแสนสวย', svg:
    '<path d="M48 282 L48 222 L112 220 L152 160 L270 160 L320 220 L362 228 L362 282 Z"/><path d="M162 172 L136 214 L200 214 L200 172 Z"/><path d="M210 172 L210 214 L296 214 L264 172 Z"/>'+
    '<circle cx="120" cy="284" r="36"/><circle cx="120" cy="284" r="13"/><circle cx="292" cy="284" r="36"/><circle cx="292" cy="284" r="13"/><circle cx="348" cy="244" r="9"/><path d="M200 230 H222"/>'+
    '<path d="M0 322 H400"/><circle cx="60" cy="70" r="28"/><path d="M250 70 Q270 40 300 60 Q330 40 350 70 Q370 90 340 98 H260 Q232 92 250 70 Z"/>' },
];
const lineSVG = (inner, w) => '<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" width="'+w+'" height="'+w+'"><g fill="none" stroke="#2A2440" stroke-width="5" stroke-linecap="round" stroke-linejoin="round">'+inner+'</g></svg>';

/* ---------------- สถานะ ---------------- */
const paint = $('#paint'), pc = paint.getContext('2d', { willReadFrequently:true });
const lines = $('#lines'), lc = lines.getContext('2d', { willReadFrequently:true });
const COLORS = ['#E53935','#FF7043','#FB8C00','#FDD835','#C0CA33','#43A047','#26A69A','#29B6F6','#1E63C4',
                '#7E57C2','#AB47BC','#EC407A','#F8BBD0','#FFE0B2','#A1887F','#6D4C41','#9E9E9E','#212121'];
const TOOLS = [
  { id:'fill',    e:'🪣', n:'ถังเทสี' },
  { id:'brush',   e:'🖌️', n:'พู่กัน' },
  { id:'rainbow', e:'🌈', n:'ปากกาสีรุ้ง' },
  { id:'stamp',   e:'⭐', n:'แสตมป์' },
  { id:'eraser',  e:'🧽', n:'ยางลบ' },
];
const STAMPS = ['⭐','❤️','🌸','🦋','🌈','🐾'];
const SIZES = [10, 26, 54];
let mode = 'color', pic = PICS[0], tool = 'fill', color = COLORS[0], size = 1, stampI = 0, hue = 0;
const work = {};            /* งานที่ค้างของแต่ละภาพ (อยู่ในหน้านี้เท่านั้น) */
let undo = [];

/* ---------------- วาดภาพลายเส้น ---------------- */
function loadLines(p){
  lc.clearRect(0, 0, SZ, SZ);
  if(!p) return Promise.resolve();
  return new Promise(res => {
    const im = new Image();
    im.onload = () => { lc.drawImage(im, 0, 0, SZ, SZ); res(); };
    im.src = 'data:image/svg+xml;charset=utf-8,' + encodeURIComponent(lineSVG(p.svg, SZ));
  });
}
function blank(){ pc.fillStyle = '#fff'; pc.fillRect(0, 0, SZ, SZ); }
function keepWork(){ work[mode==='free' ? 'free' : pic.id] = paint.toDataURL('image/png'); }
function openWork(key){
  undo = []; blank();
  if(work[key]){ const im = new Image(); im.onload = () => pc.drawImage(im, 0, 0); im.src = work[key]; }
}
function snap(){ undo.push(pc.getImageData(0, 0, SZ, SZ)); if(undo.length > 8) undo.shift(); }

/* ---------------- ถังเทสี: เทได้ถึงเส้นของภาพ หรือจนสีบนกระดาษเปลี่ยน ---------------- */
function hexRGB(h){ const n = parseInt(h.slice(1), 16); return [n>>16 & 255, n>>8 & 255, n & 255]; }
function fillAt(x, y, hex){
  const W = SZ, img = pc.getImageData(0, 0, W, W), p = img.data;
  const wall = mode==='color' ? lc.getImageData(0, 0, W, W).data : null;
  const start = y*W + x, k0 = start*4;
  if(wall && wall[k0+3] > 160) return false;
  const [r, g, b] = hexRGB(hex), sr = p[k0], sg = p[k0+1], sb = p[k0+2];
  if(Math.abs(sr-r) + Math.abs(sg-g) + Math.abs(sb-b) < 12) return false;
  const ok = i => { const k = i*4; return !(wall && wall[k+3] > 160) && Math.abs(p[k]-sr) + Math.abs(p[k+1]-sg) + Math.abs(p[k+2]-sb) < 100; };
  const seen = new Uint8Array(W*W), st = [start]; seen[start] = 1;
  const set = i => { const k = i*4; p[k] = r; p[k+1] = g; p[k+2] = b; p[k+3] = 255; };
  while(st.length){
    const i = st.pop(), xx = i % W; set(i);
    if(xx > 0     && !seen[i-1] && ok(i-1)){ seen[i-1] = 1; st.push(i-1); }
    if(xx < W-1   && !seen[i+1] && ok(i+1)){ seen[i+1] = 1; st.push(i+1); }
    if(i >= W     && !seen[i-W] && ok(i-W)){ seen[i-W] = 1; st.push(i-W); }
    if(i < W*W-W  && !seen[i+W] && ok(i+W)){ seen[i+W] = 1; st.push(i+W); }
  }
  /* ลามเข้าใต้เส้นอีก 3 ชั้น ไม่ให้เหลือขอบขาวตรงขอบเส้นที่เบลอ */
  if(wall) for(let pass=0; pass<3; pass++){
    const add = [];
    for(let i=0;i<W*W;i++){ if(seen[i] || wall[i*4+3] < 30) continue; const xx = i % W;
      if((xx>0 && seen[i-1]) || (xx<W-1 && seen[i+1]) || seen[i-W] || seen[i+W]) add.push(i); }
    add.forEach(i => { seen[i] = 1; set(i); });
  }
  pc.putImageData(img, 0, 0); return true;
}

/* ---------------- วาดด้วยนิ้ว / Apple Pencil ---------------- */
const paper = $('#paper');
const pos = e => { const r = paper.getBoundingClientRect(); return [ (e.clientX - r.left) / r.width * SZ, (e.clientY - r.top) / r.height * SZ ]; };
let drawing = null;
paper.addEventListener('pointerdown', e => {
  e.preventDefault(); const [x, y] = pos(e);
  if(tool==='fill'){ snap(); if(!fillAt(Math.floor(x), Math.floor(y), color)) undo.pop(); return; }
  if(tool==='stamp'){ snap(); const s = SIZES[size]*2.4; pc.font = s+'px "Apple Color Emoji","Noto Color Emoji",sans-serif';
    pc.textAlign = 'center'; pc.textBaseline = 'middle'; pc.fillText(STAMPS[stampI], x, y); return; }
  snap(); try{ paper.setPointerCapture(e.pointerId); }catch(err){}
  drawing = { id:e.pointerId, x, y };
  dot(x, y, e);
});
paper.addEventListener('pointermove', e => {
  if(!drawing || e.pointerId !== drawing.id) return;
  let evs = e.getCoalescedEvents ? e.getCoalescedEvents() : []; if(!evs.length) evs = [e];
  evs.forEach(ev => { const [x, y] = pos(ev); seg(drawing.x, drawing.y, x, y, ev); drawing.x = x; drawing.y = y; });
});
const end = e => { if(drawing && e.pointerId === drawing.id) drawing = null; };
paper.addEventListener('pointerup', end); paper.addEventListener('pointercancel', end);
function width(e){ const w = SIZES[size]; return e.pointerType==='pen' && e.pressure ? w*(.45 + e.pressure) : w; }
function ink(){ return tool==='eraser' ? '#fff' : tool==='rainbow' ? 'hsl('+(hue = (hue+3) % 360)+',85%,58%)' : color; }
function dot(x, y, e){ pc.fillStyle = ink(); pc.beginPath(); pc.arc(x, y, width(e)/2, 0, Math.PI*2); pc.fill(); }
function seg(x0, y0, x1, y1, e){
  pc.strokeStyle = ink(); pc.lineWidth = width(e); pc.lineCap = pc.lineJoin = 'round';
  pc.beginPath(); pc.moveTo(x0, y0); pc.lineTo(x1, y1); pc.stroke();
}

/* ---------------- แผงเครื่องมือ ---------------- */
function renderTools(){
  const sizeBtns = SIZES.map((s,i) => '<button type="button" class="sz'+(i===size?' on':'')+'" data-size="'+i+'" aria-label="ขนาด '+(i+1)+'"><i style="width:'+(8+i*9)+'px;height:'+(8+i*9)+'px"></i></button>').join('');
  $('#tools').innerHTML = TOOLS.map(t => '<button type="button" data-tool="'+t.id+'" class="'+(t.id===tool?'on':'')+'" aria-label="'+t.n+'">'+(t.id==='stamp' ? STAMPS[stampI] : t.e)+'</button>').join('')+
    '<span class="sep"></span>'+sizeBtns;
  $('#tools').querySelectorAll('[data-tool]').forEach(b => b.onclick = () => {
    const t = TOOLS.find(x => x.id===b.dataset.tool);
    if(t.id==='stamp' && tool==='stamp'){ stampI = (stampI+1) % STAMPS.length; }
    tool = t.id; say(t.id==='stamp' ? 'แสตมป์ แตะอีกทีเปลี่ยนรูป' : t.n); renderTools();
  });
  $('#tools').querySelectorAll('[data-size]').forEach(b => b.onclick = () => { size = +b.dataset.size; say(['เล็ก','กลาง','ใหญ่'][size]); renderTools(); });
}
function renderPal(){
  $('#pal').innerHTML = COLORS.map(c => '<button type="button" data-c="'+c+'" class="'+(c===color?'on':'')+'" style="background:'+c+'" aria-label="สี"></button>').join('');
  $('#pal').querySelectorAll('button').forEach(b => b.onclick = () => {
    color = b.dataset.c; if(tool==='eraser' || tool==='rainbow') tool = mode==='color' ? 'fill' : 'brush';
    renderPal(); renderTools();
  });
}
function renderPics(){
  $('#pics').hidden = mode!=='color';
  $('#pics').innerHTML = PICS.map(p => '<button type="button" data-p="'+p.id+'" class="'+(p===pic?'on':'')+'">'+lineSVG(p.svg, 72)+p.n+'</button>').join('');
  $('#pics').querySelectorAll('button').forEach(b => b.onclick = () => {
    if(b.dataset.p===pic.id) return;
    keepWork(); pic = PICS.find(p => p.id===b.dataset.p); say(pic.n); renderPics(); openWork(pic.id); loadLines(pic);
  });
}

/* ---------------- โหมด ---------------- */
function setMode(m){
  if(m!=='gallery' && mode!=='gallery' && m!==mode) keepWork();
  const was = mode; mode = m;
  $('#modes').querySelectorAll('button').forEach(b => b.classList.toggle('on', b.dataset.m===m));
  $('#studio').hidden = m==='gallery'; $('#gallery').hidden = m!=='gallery';
  if(m==='gallery'){ renderGallery(); return; }
  if(m!==was || was==='gallery'){
    tool = m==='color' ? 'fill' : 'brush';
    openWork(m==='color' ? pic.id : 'free'); loadLines(m==='color' ? pic : null);
  }
  renderPics(); renderTools();
}
$('#modes').querySelectorAll('button').forEach(b => b.onclick = () => { say(b.textContent.replace(/^\S+\s/, '')); setMode(b.dataset.m); });

$('#undo').onclick = () => { const s = undo.pop(); if(s) pc.putImageData(s, 0, 0); else toast('ย้อนไม่ได้แล้ว'); };
let wipeArm = 0;
$('#wipe').onclick = () => {
  if(Date.now() - wipeArm > 2500){ wipeArm = Date.now(); toast('แตะอีกครั้งเพื่อล้างทั้งหน้า'); say('แตะอีกครั้งเพื่อล้างทั้งหน้า'); return; }
  wipeArm = 0; snap(); blank();
};

/* ---------------- เก็บผลงาน (ในเครื่องนี้) + บันทึกลงไอแพด ---------------- */
const GKEY = 'kids-art-gallery', GMAX = 12;
const gallery = () => { try{ return JSON.parse(localStorage.getItem(GKEY)||'[]'); }catch(e){ return []; } };
function finalCanvas(w=SZ){
  const c = document.createElement('canvas'); c.width = c.height = w; const x = c.getContext('2d');
  x.fillStyle = '#fff'; x.fillRect(0, 0, w, w); x.drawImage(paint, 0, 0, w, w); if(mode==='color') x.drawImage(lines, 0, 0, w, w); return c;
}
$('#save').onclick = () => {
  const g = gallery(), title = mode==='color' ? pic.n : 'วาดอิสระ';
  g.unshift({ t:title, d:Date.now(), img:finalCanvas(480).toDataURL('image/jpeg', .8) });
  while(g.length){ try{ localStorage.setItem(GKEY, JSON.stringify(g.slice(0, GMAX))); break; }catch(e){ g.pop(); if(!g.length) break; } }
  say('เก็บผลงานแล้ว เก่งมาก'); toast('🖼️ เก็บแล้ว ดูได้ที่ ผลงานของหนู');
  if(window.KP) KP.log({ kind:'art', page:'art-paint', subject:'ศิลปะ', title:'ห้องวาดภาพ · '+title, score:1, total:1, stars:2 });
};
function renderGallery(){
  const g = gallery();
  $('#gal').innerHTML = g.length ? g.map((x,i) => '<button type="button" data-i="'+i+'"><img src="'+x.img+'" alt="'+x.t+'"><small>'+x.t+' · '+new Date(x.d).toLocaleDateString('th-TH',{day:'numeric',month:'short'})+'</small></button>').join('')
    : '<div class="empty">🎨 ยังไม่มีผลงาน ไปวาดแล้วกด 💾 เก็บผลงาน นะ</div>';
  $('#gal').querySelectorAll('button').forEach(b => b.onclick = () => openView(+b.dataset.i));
}
let viewI = -1, delArm = 0;
function openView(i){ viewI = i; delArm = 0; $('#vdel').textContent = '🗑️ ลบ'; $('#vimg').src = gallery()[i].img; $('#view').classList.add('show'); }
$('#vclose').onclick = () => $('#view').classList.remove('show');
$('#view').onclick = e => { if(e.target.id==='view') $('#view').classList.remove('show'); };
$('#vdel').onclick = () => {
  if(!delArm){ delArm = 1; $('#vdel').textContent = '🗑️ แตะอีกครั้งเพื่อลบ'; return; }
  const g = gallery(); g.splice(viewI, 1); try{ localStorage.setItem(GKEY, JSON.stringify(g)); }catch(e){}
  $('#view').classList.remove('show'); renderGallery();
};
$('#vshare').onclick = async () => {
  const blob = await (await fetch($('#vimg').src)).blob(), file = new File([blob], 'ผลงาน.jpg', { type:'image/jpeg' });
  if(navigator.canShare && navigator.canShare({ files:[file] })){ try{ await navigator.share({ files:[file] }); }catch(e){} return; }
  const a = document.createElement('a'); a.href = URL.createObjectURL(blob); a.download = 'ผลงาน.jpg'; a.click();
};

blank(); loadLines(pic); renderPics(); renderTools(); renderPal();
window.__test = { fillAt, pc, lc, PICS, setMode, get tool(){ return tool; }, set tool(v){ tool = v; }, set color(v){ color = v; }, gallery, loadLines };
</script>
<script src="../common/progress.js"></script>
</body>
