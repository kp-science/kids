<!doctype html>
<html lang="th">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<link rel="apple-touch-icon" href="../apple-touch-icon.png">
<link rel="icon" type="image/png" href="../favicon.png">
<title>ข้อสอบคณิตศาสตร์ ป.1 เทอม 1 · โจทย์ใหม่ทุกครั้ง</title>
<link rel="stylesheet" href="../vendor/fonts/fonts.css">
<style>
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
:root{
  --ink:#2F3A4E; --mute:#6B7690; --line:#E6EDF6;
  --ac:#2560B8; --acs:#E2F0FF;
  --ok:#2F9E5B; --no:#D2693C;
}
body{background:#F7FBFF;color:var(--ink);font-family:'Noto Sans Thai Looped','Noto Sans Thai',sans-serif;
  font-size:18px;line-height:1.65;-webkit-text-size-adjust:100%}
body::before{content:"";position:fixed;inset:0;pointer-events:none;z-index:-1;
  background:radial-gradient(circle at 0% 12%,#DCEBFF 0 130px,transparent 131px),
             radial-gradient(circle at 100% 32%,#E4F6FF 0 110px,transparent 111px),
             radial-gradient(circle at 0% 68%,#EFE9FF 0 140px,transparent 141px),
             radial-gradient(circle at 100% 90%,#E6F8EE 0 120px,transparent 121px)}
button{font:inherit;color:inherit;cursor:pointer}

.top{position:sticky;top:0;z-index:20;background:rgba(247,251,255,.94);backdrop-filter:blur(6px);
  box-shadow:0 4px 18px rgba(47,58,78,.06);padding-top:env(safe-area-inset-top)}
.top .in{max-width:900px;margin:0 auto;padding:8px 14px;display:flex;align-items:center;gap:10px}
.back{text-decoration:none;color:var(--ac);background:#fff;border:none;border-radius:999px;
  padding:5px 14px;font-size:.9rem;font-weight:700;white-space:nowrap;box-shadow:0 3px 12px rgba(47,58,78,.12)}
.top .tt{flex:1;font-family:'Mali',sans-serif;font-weight:700;overflow:hidden;white-space:nowrap;text-overflow:ellipsis}
.score{background:#fff;color:var(--ac);border-radius:999px;padding:4px 14px;font-weight:700;font-size:.9rem;
  white-space:nowrap;box-shadow:0 3px 12px rgba(47,58,78,.12)}

.wrap{max-width:900px;margin:0 auto;padding:12px 14px 70px}
.hero{position:relative;overflow:hidden;border-radius:30px;margin-top:8px;padding:20px 18px 76px;
  background:linear-gradient(180deg,#8EC5FF,#DCEDFF);box-shadow:0 12px 30px rgba(47,58,78,.10);text-align:center}
.hero svg{position:absolute;left:0;bottom:0;width:100%;height:86px}
.hero .deco{position:relative;font-size:2.2rem;letter-spacing:6px;display:block;margin-bottom:2px}
.hero h1{position:relative;font-family:'Mali',sans-serif;font-size:1.6rem;line-height:1.3;color:#fff;
  text-shadow:0 2px 8px rgba(20,70,140,.38)}
.hero p{position:relative;color:#17518F;font-weight:600;font-size:.95rem}

.tabs{display:flex;gap:8px;justify-content:center;flex-wrap:wrap;margin:16px 0 10px}
.tabs button{border:none;background:#fff;border-radius:999px;padding:8px 15px;font-weight:700;font-size:.93rem;
  box-shadow:0 4px 14px rgba(47,58,78,.10);color:var(--ink)}
.tabs button.on{background:var(--tc,#2560B8);color:#fff}
.sets{display:flex;gap:8px;justify-content:center;align-items:center;flex-wrap:wrap;margin-bottom:12px}
.sets .lb{color:var(--mute);font-size:.9rem;font-weight:700}
.sets button{border:none;background:#fff;border-radius:14px;padding:6px 16px;font-weight:700;font-size:.92rem;
  box-shadow:0 3px 12px rgba(47,58,78,.10);color:var(--mute)}
.sets button.on{background:var(--pcd,#2560B8);color:#fff}

.tools{display:flex;gap:10px;justify-content:center;align-items:center;flex-wrap:wrap;margin-bottom:16px;
  font-size:.9rem;color:var(--mute)}
.tools label{display:flex;align-items:center;gap:6px}
.tools input{width:20px;height:20px;accent-color:var(--ac)}
.btn{border:none;background:var(--ac);color:#fff;border-radius:999px;padding:9px 20px;font-weight:700;margin:4px;
  box-shadow:0 6px 16px rgba(47,58,78,.16)}
.btn.gh{background:#fff;color:var(--ac);box-shadow:0 3px 12px rgba(47,58,78,.10)}

/* ---------------- กล่องรูปร่วม (แผนภูมิ ตาราง ตาชั่ง) ---------------- */
.blk{background:#fff;border-radius:26px;padding:14px;margin:18px 0 14px;box-shadow:0 6px 18px rgba(47,58,78,.07)}
.blk h2{font-family:'Mali',sans-serif;font-size:1.08rem;color:var(--pcd);text-align:center;margin-bottom:10px;line-height:1.35}
.blk .scroll{overflow-x:auto;-webkit-overflow-scrolling:touch}
.blk .key{text-align:center;font-weight:700;color:var(--mute);font-size:.92rem;margin-top:8px}
.blk .key .icrow{vertical-align:-6px}
.blk .hint{text-align:center;font-weight:700;color:var(--pcd);margin-top:6px}
.fig{text-align:center;margin:8px 0}
.fig .scroll{overflow-x:auto}

/* ---------------- คำถาม ---------------- */
.q{background:#fff;border-radius:24px;padding:14px;margin-bottom:14px;box-shadow:0 6px 18px rgba(47,58,78,.07);transition:.2s}
.q.ok{box-shadow:0 0 0 3px #BDEBCB,0 6px 18px rgba(47,58,78,.07)}
.q.no{box-shadow:0 0 0 3px #FFD9C6,0 6px 18px rgba(47,58,78,.07)}
.qh{display:flex;align-items:flex-start;gap:10px;margin-bottom:10px}
.num{flex-shrink:0;width:38px;height:38px;border-radius:13px;background:var(--pl);color:var(--pcd);
  display:grid;place-items:center;font-weight:700;font-size:1.05rem}
.qt{flex:1;font-weight:700;font-size:1.08rem;padding-top:4px}
.spk{flex-shrink:0;border:none;background:var(--pl);border-radius:12px;width:42px;height:42px;font-size:1.2rem}
.spk:active{transform:scale(.94)}
.mid{display:inline-block;border:2px solid var(--pcd);border-radius:6px;width:22px;height:22px;vertical-align:-4px}

.opts{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.opts.list{grid-template-columns:1fr}
.opt{position:relative;border:2px solid transparent;background:var(--ob);border-radius:16px;padding:12px 8px 10px;
  display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;text-align:center;
  min-height:76px;transition:.12s}
.opt .lb{font-size:1.1rem;font-weight:600;line-height:1.35}
.opt .lt{position:absolute;top:6px;left:8px;width:26px;height:26px;border-radius:50%;background:var(--od);
  color:#fff;font-weight:700;font-size:.85rem;display:grid;place-items:center}
.opt .say{position:absolute;top:5px;right:5px;width:30px;height:30px;border-radius:50%;background:#fff;
  display:grid;place-items:center;font-size:.95rem;line-height:1;box-shadow:0 2px 6px rgba(47,58,78,.14);
  pointer-events:auto}
.opt .say:active{transform:scale(.9)}
.opts.list .opt .say{position:static;margin-left:auto;flex:none}
.opt.done{cursor:default}
.opts.list .opt{flex-direction:row;min-height:0;padding:11px 13px 11px 46px;text-align:left;gap:12px;
  align-items:center;justify-content:flex-start}
.opts.list .opt .lt{left:12px;top:50%;transform:translateY(-50%)}
.opts.list .opt .lb{font-size:1.04rem;flex:1}
.opts .opt:nth-child(1){--ob:#FFF1F6;--od:#F07AA6}
.opts .opt:nth-child(2){--ob:#EEF6FF;--od:#5AA0E6}
.opts .opt:nth-child(3){--ob:#FFF8E1;--od:#E0AE2B}
.opt:not(.done):hover{background:#fff;border-color:var(--od)}
.opt:not(.done):active{transform:scale(.97)}
.opt.right{border-color:#9EDDB2;background:#EFFAF2}
.opt.right .lt{background:#5BC07D}
.opt.wrong{border-color:#FFCBB3;background:#FFF5EF}
.opt.wrong .lt{background:#F29B72}
.opt.dim{opacity:.5}
.fb{margin-top:9px;font-family:'Mali',sans-serif;font-size:1.02rem;font-weight:700}
.fb.ok{color:var(--ok)} .fb.no{color:var(--no)}

.result{background:#fff;border-radius:30px;padding:22px;text-align:center;margin-top:20px;
  box-shadow:0 16px 40px rgba(47,58,78,.14)}
.result .cheer{font-size:2.6rem}
.result .stars{font-size:2.3rem;letter-spacing:4px}
.result .big{font-family:'Mali',sans-serif;font-size:2.2rem;font-weight:700;color:var(--ac)}
.result p{margin:4px 0 12px}
.hide{display:none}

/* ---------------- รูปวาด SVG ---------------- */
.icrow{display:inline-flex;align-items:flex-end;gap:4px}
svg.ic{height:28px;width:26px;fill:#fff;stroke:var(--ink);stroke-width:1.4}
svg.ic.w{height:24px;width:36px}
svg.ic .f{fill:var(--ink);stroke:none}
svg.tl{height:26px;width:28px;stroke:var(--ink);stroke-width:1.9;fill:none}
table.chart{border-collapse:collapse;margin:0 auto}
table.chart td{border:1.5px solid var(--line);padding:4px 10px;vertical-align:middle}
table.chart td.lbl{background:var(--pl);color:var(--pcd);font-weight:700;text-align:center;white-space:nowrap}
table.chart td.bar{min-width:180px;white-space:nowrap}
table.vchart{border-collapse:collapse;margin:0 auto}
table.vchart td{border:1.5px solid var(--line);padding:5px 7px;text-align:center;vertical-align:bottom}
table.vchart td.lbl{background:var(--pl);color:var(--pcd);font-weight:700;vertical-align:middle;font-size:.92rem;white-space:nowrap}
table.vchart .stack{display:flex;flex-direction:column-reverse;align-items:center;gap:4px}
table.data{border-collapse:collapse;margin:0 auto}
table.data td,table.data th{border:1.5px solid var(--line);padding:5px 26px;text-align:center}
table.data th{background:var(--pl);color:var(--pcd)}
.scale{display:inline-block;margin:0 5px;vertical-align:top}
.scale svg{height:130px;fill:#fff;stroke:var(--ink);stroke-width:1.6}
.scale .tk{stroke-width:1.1}
.scale .nd{stroke-width:2.6;stroke:#C0455E}
.scale .fb2{fill:#C0455E;stroke:none}
.scale text{stroke:none;fill:var(--ink);text-anchor:middle;font-family:'Noto Sans Thai Looped',sans-serif}
.scale .dn{font-size:12px;font-weight:700}
.scale .un{font-size:8px;fill:var(--mute)}
.cap{text-align:center;font-size:.92rem;font-weight:700;color:var(--pcd);margin-top:2px}
.bal svg{height:110px;width:290px;fill:#fff;stroke:var(--ink);stroke-width:1.6}
.bal .beam{stroke-width:3.5}
.bal .rope{stroke-width:1.4}
.bal text{stroke:none;fill:var(--ink);text-anchor:middle;font-size:19px;font-family:'Noto Sans Thai Looped',sans-serif}
.arw{font-size:1.8rem;color:var(--mute);vertical-align:44px;margin:0 2px}

@media (max-width:480px){
  body{font-size:17px}
  .hero h1{font-size:1.28rem}
  .opts{gap:7px}
  .opt{min-height:66px;padding:10px 3px 8px}
  .opt .lb{font-size:.98rem}
  .opt .lt{width:22px;height:22px;font-size:.75rem;top:4px;left:4px}
  .opts.list .opt{padding-left:40px}
  .qt{font-size:1rem}
  svg.ic{height:24px;width:22px}
  svg.ic.w{height:21px;width:31px}
  .scale svg{height:112px}
  table.data td,table.data th{padding:5px 14px}
}
</style>
</head>
<body>
<div class="top"><div class="in">
  <a class="back" href="../">‹ หน้ารวม</a>
  <div class="tt" id="tt">ข้อสอบคณิตศาสตร์ ป.1</div>
  <span class="score" id="score">0 / 0</span>
</div></div>

<div class="wrap">
  <div class="hero">
    <svg viewBox="0 0 600 86" preserveAspectRatio="none" aria-hidden="true">
      <path d="M0 50 Q130 18 270 44 T600 34 V86 H0Z" fill="#6FB3F5"/>
      <path d="M0 68 Q180 42 370 64 T600 58 V86 H0Z" fill="#4E97E0"/>
    </svg>
    <span class="deco" aria-hidden="true">🔢➕➖📊⚖️</span>
    <h1>ข้อสอบคณิตศาสตร์ ป.1 เทอม 1</h1>
    <p>7 บทตามหนังสือเรียน · โจทย์ออกใหม่ทุกครั้งที่กดสุ่ม · แตะตอบแล้วรู้ผลทันที</p>
  </div>
  <div class="tabs" id="tabs"></div>
  <div class="tools" id="tools">
    <label><input type="checkbox" id="autoread"> อ่านโจทย์ให้ฟังอัตโนมัติ</label>
    <button class="btn" id="newset" type="button" style="padding:6px 18px;margin:0">🎲 ออกข้อสอบชุดใหม่</button>
  </div>
  <div id="list"></div>
  <div id="result" class="result hide"></div>
</div>

<script src="p1-term1-gen.js"></script>
<script>
var ICONSVG={"tree":"<svg class=\"ic\" viewBox=\"0 0 24 30\"><polygon points=\"12,2 5,13 19,13\"/><polygon points=\"12,9 4,21 20,21\"/><rect x=\"10.5\" y=\"21\" width=\"3\" height=\"7\"/></svg>","smiley":"<svg class=\"ic\" viewBox=\"0 0 30 30\"><circle cx=\"15\" cy=\"15\" r=\"13\"/><circle class=\"f\" cx=\"10\" cy=\"12\" r=\"1.6\"/><circle class=\"f\" cx=\"20\" cy=\"12\" r=\"1.6\"/><path d=\"M8 18 Q15 24 22 18\"/></svg>","fish":"<svg class=\"ic w\" viewBox=\"0 0 38 24\"><path d=\"M3 12 Q12 2 24 12 Q12 22 3 12 Z\"/><polygon points=\"24,12 35,5 35,19\"/><circle class=\"f\" cx=\"9\" cy=\"10\" r=\"1.4\"/></svg>","heart":"<svg class=\"ic\" viewBox=\"0 0 30 28\"><path d=\"M15 26 C2 16 2 4 9 4 C13 4 15 8 15 8 C15 8 17 4 21 4 C28 4 28 16 15 26 Z\"/></svg>","star":"<svg class=\"ic\" viewBox=\"0 0 30 30\"><polygon points=\"15,2 18.7,11 28.5,11.6 21,18 23.4,27.5 15,22.2 6.6,27.5 9,18 1.5,11.6 11.3,11\"/></svg>","apple":"<svg class=\"ic\" viewBox=\"0 0 26 30\"><path d=\"M13 8 C6 8 3 13 4 19 C5 25 9 29 13 26 C17 29 21 25 22 19 C23 13 20 8 13 8 Z\"/><path d=\"M13 8 L13 3\"/><path d=\"M13 5 Q18 2 20 4\"/></svg>","book":"<svg class=\"ic\" viewBox=\"0 0 26 26\"><rect x=\"3\" y=\"3\" width=\"20\" height=\"20\"/><path d=\"M13 3 L13 23\"/><path d=\"M6 8 L10 8\"/><path d=\"M16 8 L20 8\"/></svg>","flower":"<svg class=\"ic\" viewBox=\"0 0 28 30\"><circle cx=\"14\" cy=\"8\" r=\"4\"/><circle cx=\"7\" cy=\"13\" r=\"4\"/><circle cx=\"21\" cy=\"13\" r=\"4\"/><circle cx=\"10\" cy=\"20\" r=\"4\"/><circle cx=\"18\" cy=\"20\" r=\"4\"/><path d=\"M14 22 L14 29\"/></svg>","ball":"<svg class=\"ic\" viewBox=\"0 0 28 28\"><circle cx=\"14\" cy=\"14\" r=\"12\"/><path d=\"M2 14 Q14 6 26 14\"/><path d=\"M2 14 Q14 22 26 14\"/></svg>","cup":"<svg class=\"ic\" viewBox=\"0 0 26 28\"><path d=\"M5 5 L21 5 L19 24 L7 24 Z\"/><path d=\"M21 9 Q25 11 21 15\"/></svg>","car":"<svg class=\"ic w\" viewBox=\"0 0 36 22\"><path d=\"M3 15 L5 9 L12 5 L24 5 L30 10 L33 11 L33 15 Z\"/><circle class=\"f\" cx=\"10\" cy=\"17\" r=\"3\"/><circle class=\"f\" cx=\"26\" cy=\"17\" r=\"3\"/></svg>","bird":"<svg class=\"ic\" viewBox=\"0 0 30 30\"><path d=\"M20 6 C14 6 10 10 10 15 C10 21 14 25 19 25 C24 25 27 21 27 15 C27 10 25 6 20 6 Z\"/><path d=\"M12 14 Q8 20 4 26\"/><circle class=\"f\" cx=\"22\" cy=\"12\" r=\"1.4\"/><polygon points=\"27,12 31,13 27,14\"/><path d=\"M14 16 Q19 14 23 18\"/></svg>","pencil":"<svg class=\"ic\" viewBox=\"0 0 16 30\"><polygon points=\"8,2 13,8 13,26 3,26 3,8\"/><path d=\"M3 8 L13 8\"/><polygon class=\"f\" points=\"8,2 11,6 5,6\"/></svg>"};
var TALLY=["<span class=\"icrow\"><svg class=\"tl\" viewBox=\"0 0 26 24\"><path d=\"M3 2 L3 20\"/><path d=\"M8 2 L8 20\"/><path d=\"M13 2 L13 20\"/><path d=\"M18 2 L18 20\"/><path d=\"M1 19 L21 3\"/></svg></span>","<span class=\"icrow\"><svg class=\"tl\" viewBox=\"0 0 26 24\"><path d=\"M3 2 L3 20\"/></svg></span>"];

/* ============================================================
   หน้าข้อสอบ — โจทย์สร้างใหม่ทุกครั้งจาก p1-term1-gen.js
   เก็บชุดที่ออกไว้ใน localStorage เพื่อให้กลับมาทำต่อได้
   ============================================================ */

/* ---------------- วาดรูป ---------------- */
function icons(kind, n) { var s = '', i; for (i = 0; i < n; i++) s += ICONSVG[kind]; return '<span class="icrow">' + s + '</span>'; }
function tally(n) {
  var s = '', f = Math.floor(n / 5), r = n % 5, i;
  for (i = 0; i < f; i++) s += TALLY[0];
  if (r) { var b = ''; for (i = 0; i < r; i++) b += '<path d="M' + (3 + 5 * i) + ' 2 L' + (3 + 5 * i) + ' 20"/>';
    s += '<svg class="tl" viewBox="0 0 26 24">' + b + '</svg>'; }
  return '<span class="icrow">' + s + '</span>';
}
function dial(kg, label) {
  var t, ang, r1, r2, x1, y1, x2, y2, xr, yr, s = '';
  for (t = 0; t <= 50; t++) {
    ang = (-90 + t * 6) * Math.PI / 180;
    r1 = (t % 10 === 0) ? 34 : 39; r2 = 44;
    x1 = 50 + r1 * Math.cos(ang); y1 = 50 + r1 * Math.sin(ang);
    x2 = 50 + r2 * Math.cos(ang); y2 = 50 + r2 * Math.sin(ang);
    s += '<path class="tk" d="M' + x1.toFixed(1) + ' ' + y1.toFixed(1) + ' L' + x2.toFixed(1) + ' ' + y2.toFixed(1) + '"/>';
    if (t % 10 === 0 && t !== 50) { xr = 50 + 27 * Math.cos(ang); yr = 50 + 27 * Math.sin(ang) + 4;
      s += '<text class="dn" x="' + xr.toFixed(1) + '" y="' + yr.toFixed(1) + '">' + (t / 10) + '</text>'; }
  }
  var a = (-90 + kg * 10 * 6) * Math.PI / 180, nx = 50 + 32 * Math.cos(a), ny = 50 + 32 * Math.sin(a);
  s += '<path class="nd" d="M50 50 L' + nx.toFixed(1) + ' ' + ny.toFixed(1) + '"/><circle class="fb2" cx="50" cy="50" r="3"/>';
  return '<div class="scale"><svg viewBox="0 0 100 128">' +
    '<rect x="18" y="4" width="64" height="4"/><path d="M50 8 L50 14"/>' +
    '<rect x="12" y="14" width="76" height="104" rx="6"/><circle cx="50" cy="50" r="46"/>' +
    s + '<text class="un" x="50" y="72">KILOG</text></svg>' +
    (label ? '<div class="cap">' + label + '</div>' : '') + '</div>';
}
function balance(l, r, h) {
  var y1, y2;
  if (h === 'L') { y1 = 46; y2 = 20; } else if (h === 'R') { y1 = 20; y2 = 46; } else { y1 = 33; y2 = 33; }
  function side(x, y, lab) {
    return '<path class="rope" d="M' + x + ' ' + y + ' L' + x + ' ' + (y + 16) + '"/>' +
      '<path d="M' + (x - 20) + ' ' + (y + 16) + ' Q' + x + ' ' + (y + 30) + ' ' + (x + 20) + ' ' + (y + 16) + ' Z"/>' +
      '<text x="' + x + '" y="' + (y + 50) + '">' + lab + '</text>';
  }
  return '<div class="bal"><svg viewBox="0 0 260 110">' +
    '<path class="beam" d="M30 ' + y1 + ' L230 ' + y2 + '"/>' +
    '<polygon points="130,32 114,80 146,80"/><rect x="104" y="80" width="52" height="6"/>' +
    side(30, y1, l) + side(230, y2, r) + '</svg></div>';
}
function cell(f, n) { return f.mode === 'tally' ? tally(n) : icons(f.icon, n); }

function figHTML(f) {
  if (!f) return '';
  var i, s = '';
  if (f.k === 'icons')   return '<div class="fig">' + icons(f.icon, f.n) + '</div>';
  if (f.k === 'dial')    return '<div class="fig">' + dial(f.kg, f.label) + '</div>';
  if (f.k === 'balance') return '<div class="fig">' + balance(f.l, f.r, f.h) + '</div>';
  if (f.k === 'grp2')
    return '<div class="fig"><table class="chart"><tr><td>' + icons(f.icon, f.a) + '</td><td>' +
      icons(f.icon, f.b) + '</td></tr></table></div>';
  if (f.k === 'hchart') {
    for (i = 0; i < f.rows.length; i++)
      s += '<tr><td class="lbl">' + f.rows[i][0] + '</td><td class="bar">' + cell(f, f.rows[i][1]) + '</td></tr>';
    return '<h2>' + f.title + '</h2><div class="scroll"><table class="chart">' + s + '</table></div>' +
           '<div class="key">' + f.key + '</div><div class="hint">' + f.hint + '</div>';
  }
  if (f.k === 'vchart') {
    var top = '', bot = '';
    for (i = 0; i < f.rows.length; i++) {
      var st = '', j; for (j = 0; j < f.rows[i][1]; j++) st += ICONSVG[f.icon];
      top += '<td><div class="stack">' + st + '</div></td>';
      bot += '<td class="lbl">' + f.rows[i][0] + '</td>';
    }
    return '<h2>' + f.title + '</h2><div class="scroll"><table class="vchart"><tr>' + top + '</tr><tr>' + bot +
           '</tr></table></div><div class="key">' + f.key + '</div><div class="hint">' + f.hint + '</div>';
  }
  if (f.k === 'table') {
    var hd = ''; for (i = 0; i < f.head.length; i++) hd += '<th>' + f.head[i] + '</th>';
    for (i = 0; i < f.rows.length; i++) { var tr = '', j2;
      for (j2 = 0; j2 < f.rows[i].length; j2++) tr += '<td>' + f.rows[i][j2] + '</td>';
      s += '<tr>' + tr + '</tr>'; }
    return '<h2>' + f.title + '</h2><div class="scroll"><table class="data"><tr>' + hd + '</tr>' + s +
           '</table></div><div class="hint">' + f.hint + '</div>';
  }
  if (f.k === 'scales') {
    for (i = 0; i < f.items.length; i++) s += dial(f.items[i][0], f.items[i][1]);
    return (f.title ? '<h2>' + f.title + '</h2>' : '') + '<div class="hint">' + f.hint +
           '</div><div class="scroll"><div class="fig">' + s + '</div></div>';
  }
  if (f.k === 'arrow')
    return '<div class="hint">' + f.hint + '</div><div class="scroll"><div class="fig">' +
      dial(f.a[0], f.a[1]) + '<span class="arw">&#8594;</span>' + dial(f.b[0], f.b[1]) + '</div></div>';
  return '';
}
/* ตัวสร้างโจทย์ฝากรูปไอคอนมาเป็น <i data-ic> ไว้ ค่อยแทนตอนวาดจริง */
function expandIcons(root) {
  root.querySelectorAll('i[data-ic]').forEach(function (e) {
    var d = document.createElement('span'); d.innerHTML = icons(e.getAttribute('data-ic'), +e.getAttribute('data-n'));
    e.parentNode.replaceChild(d.firstChild, e);
  });
  root.querySelectorAll('i[data-tl]').forEach(function (e) {
    var d = document.createElement('span'); d.innerHTML = tally(1);
    e.parentNode.replaceChild(d.firstChild, e);
  });
}

/* ---------------- สถานะ ---------------- */
var PC = [['#8EC5FF', '#2560B8', '#E2F0FF'], ['#FFB4C6', '#B83A5E', '#FFEDF2'], ['#A5D6B0', '#25724A', '#E9F7EE'],
          ['#D8B4F0', '#6A3B9C', '#F5EDFF'], ['#FFCE85', '#9A6212', '#FFF3DE'], ['#8FD9E6', '#16697A', '#E4F7FA'],
          ['#F3A6A6', '#A83232', '#FDECEC']];
var TL = ['ก', 'ข', 'ค'];
var PRAISE = ['✓ ถูกต้อง เก่งมาก! 🎉', '✓ สุดยอดเลย! ⭐', '✓ ถูกต้อง! 👏', '✓ เยี่ยมมาก! 🌈', '✓ ใช่แล้ว! 😄'];
var $ = function (s) { return document.querySelector(s); };
var strip = function (s) {
  return String(s).replace(/<i data-ic[^>]*><\/i>/g, ' รูป ').replace(/<[^>]*>/g, ' ')
    .replace(/&nbsp;/g, ' ').replace(/&gt;/g, ' มากกว่า ').replace(/&lt;/g, ' น้อยกว่า ')
    .replace(/&ndash;/g, ' ลบ ').replace(/&quot;/g, '').replace(/&amp;/g, 'และ').replace(/\s+/g, ' ').trim();
};
var isPic = function (s) { return /<svg|data-ic/.test(String(s)); };

var chap = 0, items = [], ans = {}, ORD = [];
var KQ = function () { return 'kids-math-p1t1-q' + chap; };
var KA = function () { return 'kids-math-p1t1-a' + chap; };
function questions() { return items.filter(function (x) { return Array.isArray(x); }); }

function makeNew() {
  items = MATHGEN.chapter(chap);
  try { localStorage.setItem(KQ(), JSON.stringify(items)); } catch (e) {}
  ans = {};
  try { localStorage.setItem(KA(), '{}'); localStorage.removeItem(KQ() + '-order'); } catch (e) {}
  ORD = [];
}
function loadChapter() {
  var raw = null;
  try { raw = JSON.parse(localStorage.getItem(KQ()) || 'null'); } catch (e) { raw = null; }
  if (Array.isArray(raw) && raw.length) {
    items = raw;
    try { ans = JSON.parse(localStorage.getItem(KA()) || '{}') || {}; } catch (e) { ans = {}; }
  } else { makeNew(); }
  loadOrder();
}
function save() { try { localStorage.setItem(KA(), JSON.stringify(ans)); } catch (e) {} }
function loadOrder() {
  var key = KQ() + '-order', qs = questions();
  try { ORD = JSON.parse(localStorage.getItem(key) || 'null'); } catch (e) { ORD = null; }
  if (!Array.isArray(ORD) || ORD.length !== qs.length) {
    ORD = qs.map(function () { var a = [0, 1, 2], i, j, t;
      for (i = 2; i > 0; i--) { j = Math.floor(Math.random() * (i + 1)); t = a[i]; a[i] = a[j]; a[j] = t; } return a; });
    try { localStorage.setItem(key, JSON.stringify(ORD)); } catch (e) {}
  }
}
try { var sc = localStorage.getItem('kids-math-p1t1-chap'); if (sc !== null && MATHGEN.TITLES[+sc]) chap = +sc; } catch (e) {}
function saveChap() { try { localStorage.setItem('kids-math-p1t1-chap', chap); } catch (e) {} }
try { $('#autoread').checked = localStorage.getItem('kids-math-p1t1-read') === '1'; } catch (e) {}
$('#autoread').onchange = function (e) { try { localStorage.setItem('kids-math-p1t1-read', e.target.checked ? '1' : '0'); } catch (err) {} };

/* ---------------- อ่านออกเสียง ---------------- */
var synth = window.speechSynthesis, voice = null;
function pickVoice() { if (!synth) return; var v = synth.getVoices().filter(function (x) { return /^th/i.test(x.lang); }); voice = v[0] || null; }
if (synth) { pickVoice(); synth.onvoiceschanged = pickVoice; }
function speak(text) {
  if (!synth || (window.KP && KP.isMuted && KP.isMuted())) return;
  try { synth.cancel(); var u = new SpeechSynthesisUtterance(text);
    u.lang = 'th-TH'; if (voice) u.voice = voice; u.rate = 0.92; synth.speak(u); } catch (e) {}
}
function optText(t) { return isPic(t) ? 'ดูรูป' : sayable(t); }
/* เสียงพูด: แปลงสัญลักษณ์เป็นคำ เครื่องอ่านไทยจะได้ไม่ข้าม */
var sayable = function (t) {
  return strip(String(t).replace(/<span class="mid"><\/span>/g, ' ช่องว่าง '))
    .replace(/\+/g, ' บวก ').replace(/=/g, ' เท่ากับ ')
    .replace(/\s+/g, ' ').trim();
};
/* ปุ่ม 🔊 ของโจทย์ อ่านโจทย์แล้วไล่อ่านตัวเลือก ก ข ค
   ส่วนลำโพงเล็กในตัวเลือก ไว้ให้เด็กกดฟังซ้ำเฉพาะข้อที่อยากฟังอีกรอบ */
function readQ(q, k) {
  speak(sayable(q[0]) + ' … ' +
    ORD[k].map(function (i, pos) { return TL[pos] + ' ' + optText(q[1][i]); }).join(' … '));
}
var attr = function (x) { return String(x).replace(/&/g, '&amp;').replace(/"/g, '&quot;').replace(/</g, '&lt;'); };

/* ---------------- แท็บ ---------------- */
function renderTabs() {
  var h = '', i;
  for (i = 0; i < 7; i++) h += '<button type="button" data-i="' + i + '" class="' + (i === chap ? 'on' : '') +
    '" style="--tc:' + PC[i][1] + '">บทที่ ' + (i + 1) + '</button>';
  $('#tabs').innerHTML = h;
  $('#tabs').querySelectorAll('button').forEach(function (b) {
    b.onclick = function () { chap = +b.getAttribute('data-i'); saveChap(); render(); window.scrollTo({ top: 0 }); };
  });
}

/* ---------------- หน้าแบบฝึก ---------------- */
function render() {
  renderTabs();
  loadChapter();
  var pc = PC[chap], pcv = '--pc:' + pc[0] + ';--pcd:' + pc[1] + ';--pl:' + pc[2];
  $('#tt').textContent = MATHGEN.TITLES[chap];
  $('#tools').style.cssText = pcv;
  var n = 0, h = '';
  items.forEach(function (x) {
    if (!Array.isArray(x)) { h += '<div class="blk" style="' + pcv + '">' + figHTML(x.f) + '</div>'; return; }
    var k = n++;
    var longest = Math.max.apply(null, x[1].map(function (o) { return isPic(o) ? 99 : strip(o).length; }));
    h += '<div class="q" style="' + pcv + '" id="q' + k + '"><div class="qh"><div class="num">' + (k + 1) + '</div>' +
      '<div class="qt">' + x[0] + '</div>' +
      '<button class="spk" type="button" data-k="' + k + '" aria-label="อ่านโจทย์ข้อ ' + (k + 1) + '">🔊</button></div>' +
      (x[3] ? figHTML(x[3]) : '') +
      '<div class="opts' + (longest > 16 ? ' list' : '') + '">' +
      ORD[k].map(function (i, pos) {
        var o = x[1][i], sp = isPic(o) ? '' :
          '<span class="say" role="button" tabindex="0" aria-label="ฟังคำอ่านตัวเลือก ' + TL[pos] +
          '" data-say="' + attr(sayable(o)) + '">🔊</span>';
        return '<button type="button" class="opt" data-k="' + k + '" data-i="' + i + '">' +
          '<span class="lt">' + TL[pos] + '</span><span class="lb">' + o + '</span>' + sp + '</button>';
      }).join('') + '</div><div class="fb"></div></div>';
  });
  $('#list').innerHTML = h;
  expandIcons($('#list'));
  var Q = questions();
  $('#list').querySelectorAll('.spk').forEach(function (b) {
    b.onclick = function () { var k = +b.getAttribute('data-k'); readQ(Q[k], k); }; });
  $('#list').querySelectorAll('.opt').forEach(function (b) {
    b.onclick = function (e) {
      var sp = e.target.closest ? e.target.closest('.say') : null;
      if (sp) { e.stopPropagation(); speak(sp.getAttribute('data-say')); return; }
      pick(+b.getAttribute('data-k'), +b.getAttribute('data-i'), true);
    };
  });
  Object.keys(ans).forEach(function (k) { show(+k, ans[k]); });
  updateScore(false);
}

function show(k, i, say) {
  var q = questions()[k], el = $('#q' + k); if (!q || !el) return;
  var ok = (i === q[2]);
  el.classList.add(ok ? 'ok' : 'no');
  el.querySelectorAll('.opt').forEach(function (b) {
    var j = +b.getAttribute('data-i'); b.classList.add('done');
    if (j === q[2]) b.classList.add('right');
    else if (j === i) b.classList.add('wrong');
    else b.classList.add('dim');
  });
  var fb = el.querySelector('.fb');
  fb.className = 'fb ' + (ok ? 'ok' : 'no');
  fb.innerHTML = ok ? PRAISE[k % PRAISE.length]
    : '✗ คำตอบที่ถูกคือ ' + TL[ORD[k].indexOf(q[2])] + '. ' + (isPic(q[1][q[2]]) ? '' : q[1][q[2]]);
  if (say) speak(ok ? 'ถูกต้อง เก่งมาก'
    : 'ยังไม่ใช่ คำตอบที่ถูกคือ ข้อ ' + TL[ORD[k].indexOf(q[2])] + ' ' + optText(q[1][q[2]]));
}

function pick(k, i, fresh) {
  if (ans[k] !== undefined) return;
  ans[k] = i; save(); show(k, i, fresh); updateScore(fresh);
  if (fresh) {
    var nx = $('#q' + (k + 1));
    if (nx && ans[k + 1] === undefined) {
      setTimeout(function () { nx.scrollIntoView({ behavior: 'smooth', block: 'center' });
        if ($('#autoread').checked) readQ(questions()[k + 1], k + 1); }, 650);
    }
  }
}

function updateScore(fresh) {
  var Q = questions(), keys = Object.keys(ans);
  var right = keys.filter(function (k) { return ans[k] === Q[k][2]; }).length;
  $('#score').textContent = right + ' / ' + Q.length;
  var r = $('#result');
  if (keys.length < Q.length) { r.className = 'result hide'; return; }
  var pct = right / Q.length;
  var stars = pct >= 0.9 ? '⭐⭐⭐' : pct >= 0.7 ? '⭐⭐' : pct >= 0.5 ? '⭐' : '💪';
  var msg = pct >= 0.9 ? 'เก่งมาก! พร้อมสอบแล้ว' : pct >= 0.7 ? 'ดีมาก! ลองออกชุดใหม่อีกทีนะ'
          : pct >= 0.5 ? 'ผ่านแล้ว ลองออกข้อสอบชุดใหม่ดูนะ' : 'ไม่เป็นไร ออกชุดใหม่แล้วค่อย ๆ ทำอีกรอบนะ';
  r.className = 'result';
  r.innerHTML = '<div class="cheer">' + (pct >= 0.7 ? '🎉🏆🎉' : '🌈') + '</div><div class="stars">' + stars + '</div>' +
    '<div class="big">' + right + ' / ' + Q.length + '</div><p>' + msg + '</p>' +
    '<button class="btn" type="button" id="again">🎲 ออกข้อสอบชุดใหม่</button>' +
    (chap < 6 ? '<button class="btn gh" type="button" id="nextchap">ไปบทที่ ' + (chap + 2) + '</button>' : '');
  $('#again').onclick = regen;
  if ($('#nextchap')) $('#nextchap').onclick = function () { chap++; saveChap(); render(); window.scrollTo({ top: 0 }); };
  if (fresh) setTimeout(function () { r.scrollIntoView({ behavior: 'smooth', block: 'center' }); }, 700);
  if (fresh && window.KP) {
    var wrong = keys.filter(function (k) { return ans[k] !== Q[k][2]; })
                    .map(function (k) { return strip(Q[k][0]); }).slice(0, 15);
    KP.log({ kind: 'test', page: 'math-p1-term1', subject: 'คณิตศาสตร์',
             title: 'ข้อสอบคณิต ป.1 เทอม 1 · ' + MATHGEN.TITLES[chap],
             score: right, total: Q.length, stars: pct >= 0.9 ? 3 : pct >= 0.7 ? 2 : 1, wrong: wrong });
  }
}

function regen() { makeNew(); render(); window.scrollTo({ top: 0, behavior: 'smooth' }); }
$('#newset').onclick = function () {
  if (!Object.keys(ans).length || confirm('ออกข้อสอบชุดใหม่ คำตอบเดิมจะหายไป ตกลงไหม?')) regen();
};

window.__test = { get chap() { return chap; }, go: function (c) { chap = c; render(); },
  regen: regen, count: function () { return questions().length; },
  answerAll: function (right) { var Q = questions(), k;
    for (k = 0; k < Q.length; k++) pick(k, right ? Q[k][2] : (Q[k][2] + 1) % 3, false);
    return $('#score').textContent; } };

render();
</script>
<script src="../common/progress.js"></script>
</body>
</html>
