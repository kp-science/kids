<!doctype html>
<html lang="th">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<link rel="apple-touch-icon" href="../apple-touch-icon.png">
<link rel="icon" type="image/png" href="../favicon.png">
<title>ข้อสอบเตรียมสอบ วิทยาศาสตร์ ป.1 · 4 ชุด ง่ายไปยาก</title>
<link rel="stylesheet" href="../vendor/fonts/fonts.css">
<style>
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
:root{
  --ink:#3A3350; --mute:#6E6785; --line:#EBE6F0;
  --ac:#C0587A; --acs:#FFF0F4;
  --ok:#2F9E5B; --no:#D2693C; --gold:#E7B84B;
}
body{background:#FFFBF4;color:var(--ink);font-family:'Noto Sans Thai Looped','Noto Sans Thai',sans-serif;
  font-size:18px;line-height:1.65;-webkit-text-size-adjust:100%}
body::before{content:"";position:fixed;inset:0;pointer-events:none;z-index:-1;
  background:radial-gradient(circle at 0% 12%,#FFE9D6 0 130px,transparent 131px),
             radial-gradient(circle at 100% 34%,#FFF1D6 0 110px,transparent 111px),
             radial-gradient(circle at 0% 70%,#F3E9FF 0 140px,transparent 141px),
             radial-gradient(circle at 100% 90%,#E6F8EE 0 120px,transparent 121px)}
button{font:inherit;color:inherit;cursor:pointer}

.top{position:sticky;top:0;z-index:20;background:rgba(255,251,244,.93);backdrop-filter:blur(6px);
  box-shadow:0 4px 18px rgba(58,51,80,.06);padding-top:env(safe-area-inset-top)}
.top .in{max-width:900px;margin:0 auto;padding:8px 14px;display:flex;align-items:center;gap:10px}
.back{text-decoration:none;color:var(--ac);background:#fff;border:none;border-radius:999px;
  padding:5px 14px;font-size:.9rem;font-weight:700;white-space:nowrap;box-shadow:0 3px 12px rgba(58,51,80,.12)}
.top .tt{flex:1;font-family:'Mali',sans-serif;font-weight:700;overflow:hidden;white-space:nowrap;text-overflow:ellipsis}
.score{background:#fff;color:var(--ac);border-radius:999px;padding:4px 14px;font-weight:700;font-size:.9rem;
  white-space:nowrap;box-shadow:0 3px 12px rgba(58,51,80,.12)}

.wrap{max-width:900px;margin:0 auto;padding:12px 14px 70px}
.hero{position:relative;overflow:hidden;border-radius:30px;margin-top:8px;padding:20px 18px 76px;
  background:linear-gradient(180deg,#9FDCF5,#E9F8FF);box-shadow:0 12px 30px rgba(58,51,80,.10);text-align:center}
.hero svg{position:absolute;left:0;bottom:0;width:100%;height:86px}
.hero .deco{position:relative;font-size:2.2rem;letter-spacing:6px;display:block;margin-bottom:2px}
.hero h1{position:relative;font-family:'Mali',sans-serif;font-size:1.65rem;line-height:1.3;color:#fff;
  text-shadow:0 2px 8px rgba(30,90,130,.45)}
.hero p{position:relative;color:#2A6698;font-weight:600;font-size:.95rem}

.tabs{display:flex;gap:8px;justify-content:center;flex-wrap:wrap;margin:16px 0 14px}
.tabs button{border:none;background:#fff;border-radius:999px;padding:8px 16px;font-weight:700;font-size:.95rem;
  box-shadow:0 4px 14px rgba(58,51,80,.10);color:var(--ink)}
.tabs button.on{background:var(--tc,#C98A2E);color:#fff}

.tools{display:flex;gap:10px;justify-content:center;align-items:center;flex-wrap:wrap;margin-bottom:16px;
  font-size:.9rem;color:var(--mute)}
.tools label{display:flex;align-items:center;gap:6px}
.tools input{width:20px;height:20px;accent-color:var(--ac)}
.btn{border:none;background:var(--ac);color:#fff;border-radius:999px;padding:9px 20px;font-weight:700;margin:4px;
  box-shadow:0 6px 16px rgba(58,51,80,.16)}
.btn.gh{background:#fff;color:var(--ac);box-shadow:0 3px 12px rgba(58,51,80,.10)}

/* ---------------- สรุป ---------------- */
.lead{background:#fff;border-radius:24px;padding:14px 16px;margin-bottom:14px;color:var(--mute);
  box-shadow:0 6px 18px rgba(58,51,80,.07);font-size:.98rem}
.sum{background:#fff;border-radius:26px;padding:6px 16px 16px;margin-bottom:16px;box-shadow:0 6px 18px rgba(58,51,80,.07)}
.sum .sh{display:flex;align-items:center;gap:10px;margin:-6px -16px 12px;padding:12px 16px;border-radius:26px 26px 0 0;
  background:var(--pl)}
.sum .sh .pe{width:44px;height:44px;flex-shrink:0;border-radius:15px;background:#fff;display:grid;place-items:center;
  font-size:1.5rem;box-shadow:0 3px 10px rgba(58,51,80,.08)}
.sum .sh h2{flex:1;font-family:'Mali',sans-serif;font-size:1.15rem;color:var(--pcd);line-height:1.35}
.sum h3{font-family:'Mali',sans-serif;font-size:1.05rem;color:var(--pcd);margin:14px 0 6px;display:flex;gap:8px;align-items:center}
.sum h3:first-of-type{margin-top:4px}
.sum ul{list-style:none;margin:0 0 2px}
.sum li{position:relative;padding-left:20px;margin-bottom:5px}
.sum li::before{content:"";position:absolute;left:4px;top:.72em;width:8px;height:8px;border-radius:50%;background:var(--pc)}
.sum b{color:var(--pcd)}
.ft{display:grid;grid-template-columns:auto 1fr;gap:6px 12px;background:var(--pl);border-radius:18px;padding:12px 14px;margin:6px 0 2px}
.ft dt{font-weight:700;color:var(--pcd);white-space:nowrap}
.ft dd{margin:0}
.spk{flex-shrink:0;border:none;background:var(--pl);border-radius:12px;width:42px;height:42px;font-size:1.2rem}
.spk:active{transform:scale(.94)}

/* ---------------- คำถาม ---------------- */
.part{margin:22px 0 12px;background:var(--pl);color:var(--pcd);border-radius:20px;padding:8px 14px 8px 8px;
  font-family:'Mali',sans-serif;font-weight:700;font-size:1.12rem;display:flex;align-items:center;gap:10px}
.part .pe{width:40px;height:40px;border-radius:14px;background:#fff;display:grid;place-items:center;font-size:1.3rem;
  box-shadow:0 3px 10px rgba(58,51,80,.08)}
.q{background:#fff;border-radius:24px;padding:14px;margin-bottom:14px;box-shadow:0 6px 18px rgba(58,51,80,.07);transition:.2s}
.q.ok{box-shadow:0 0 0 3px #BDEBCB,0 6px 18px rgba(58,51,80,.07)}
.q.no{box-shadow:0 0 0 3px #FFD9C6,0 6px 18px rgba(58,51,80,.07)}
.qh{display:flex;align-items:flex-start;gap:10px;margin-bottom:10px}
.num{flex-shrink:0;width:38px;height:38px;border-radius:13px;background:var(--pl);color:var(--pcd);
  display:grid;place-items:center;font-weight:700;font-size:1.05rem}
.qt{flex:1;font-weight:700;font-size:1.08rem;padding-top:4px}
.qe{font-size:2rem;line-height:1}

.opts{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.opts.list{grid-template-columns:1fr}
.opt{position:relative;border:2px solid transparent;background:var(--ob);border-radius:16px;padding:10px 6px;
  display:flex;flex-direction:column;align-items:center;gap:4px;text-align:center;min-height:118px;transition:.12s}
.opt .em{font-size:2.5rem;line-height:1.15}
.opt .lb{font-size:.96rem;font-weight:600;line-height:1.35}
.opt .lt{position:absolute;top:6px;left:8px;width:26px;height:26px;border-radius:50%;background:var(--od);
  color:#fff;font-weight:700;font-size:.85rem;display:grid;place-items:center}
.opt.noem{justify-content:center}
.opt.noem .lb{font-size:1.12rem}
.opt .rd{display:block;font-size:.78rem;font-weight:400;color:var(--mute);line-height:1.3;margin-top:1px}
.optwrap{display:flex;flex-direction:column;gap:6px}
.optwrap .opt{flex:1;width:100%}
.sayb{border:2px solid var(--ob);background:#fff;border-radius:14px;min-height:46px;width:100%;
  display:grid;place-items:center;font-size:1.15rem;line-height:1;cursor:pointer;color:var(--od)}
.sayb::after{content:"ฟัง";font-size:.72rem;font-weight:700;margin-left:4px}
.sayb{grid-auto-flow:column;align-content:center}
.sayb:active{transform:scale(.97)}
.opts.list .optwrap{flex-direction:row;align-items:stretch;gap:8px}
.opts.list .sayb{width:64px;min-height:0;flex:none}
.opt.done{cursor:default}
.opts.list .opt{flex-direction:row;min-height:0;padding:11px 13px;text-align:left;gap:12px}
.opts.list .opt .lt{position:static;flex-shrink:0}
.opts.list .opt.noem{justify-content:flex-start}
.opts.list .opt .lb{font-size:1.02rem}
.opts .optwrap:nth-child(1){--ob:#FFF1F6;--od:#F07AA6}
.opts .optwrap:nth-child(2){--ob:#EEF6FF;--od:#5AA0E6}
.opts .optwrap:nth-child(3){--ob:#FFF8E1;--od:#E0AE2B}
.opt:not(.done):hover{background:#fff;border-color:var(--od)}
.opt:not(.done):active{transform:scale(.97)}
.opt.right{border-color:#9EDDB2;background:#EFFAF2}
.opt.right .lt{background:#5BC07D}
.opt.wrong{border-color:#FFCBB3;background:#FFF5EF}
.opt.wrong .lt{background:#F29B72}
.opt.dim{opacity:.5}
.fb{margin-top:9px;font-family:'Mali',sans-serif;font-size:1.02rem;font-weight:700}
.fb.ok{color:var(--ok)} .fb.no{color:var(--no)}
.fb small{display:block;font-family:'Noto Sans Thai Looped',sans-serif;font-weight:400;color:var(--mute);font-size:.92rem;margin-top:2px}

.result{background:#fff;border-radius:30px;padding:22px;text-align:center;margin-top:20px;
  box-shadow:0 16px 40px rgba(58,51,80,.14)}
.result .cheer{font-size:2.6rem}
.result .stars{font-size:2.3rem;letter-spacing:4px}
.result .big{font-family:'Mali',sans-serif;font-size:2.2rem;font-weight:700;color:var(--ac)}
.result p{margin:4px 0 12px}
.hide{display:none}

@media (max-width:480px){
  body{font-size:17px}
  .hero h1{font-size:1.32rem}
  .opts{gap:7px}
  .sayb{min-height:42px;font-size:1.05rem}
  .opt{min-height:104px;padding:8px 3px}
  .opt .em{font-size:2.1rem}
  .opt .lb{font-size:.85rem}
  .opt .lt{width:22px;height:22px;font-size:.75rem;top:4px;left:4px}
  .qt{font-size:1rem}
  .ft{grid-template-columns:1fr;gap:2px 0}
  .ft dd{margin-bottom:6px}
}
</style>
</head>
<body>
<div class="top"><div class="in">
  <a class="back" href="../">‹ หน้ารวม</a>
  <div class="tt" id="tt">ข้อสอบเตรียมสอบ วิทยาศาสตร์</div>
  <span class="score hide" id="score">0 / 0</span>
</div></div>

<div class="wrap">
  <div class="hero">
    <svg viewBox="0 0 600 86" preserveAspectRatio="none" aria-hidden="true">
      <path d="M0 50 Q130 18 270 44 T600 34 V86 H0Z" fill="#8FD46B"/>
      <path d="M0 68 Q180 42 370 64 T600 58 V86 H0Z" fill="#6CC04A"/>
    </svg>
    <span class="deco" aria-hidden="true">📝⭐🧠🫀👂</span>
    <h1>ข้อสอบเตรียมสอบ วิทยาศาสตร์ ป.1</h1>
    <p>หน่วยที่ 1 · อวัยวะภายนอก–ภายในและหน้าที่ · ประสาทสัมผัสทั้ง 5 · การดูแลรักษาอวัยวะ · 4 ชุด เรียงจากง่ายไปยาก สุ่มข้อใหม่ทุกรอบ</p>
  </div>
  <div class="tabs" id="tabs"></div>
  <div class="lead" id="note"></div>
  <div class="tools" id="tools">
    <label><input type="checkbox" id="autoread"> อ่านโจทย์ให้ฟังอัตโนมัติ</label>
    <button class="btn gh" id="reset" type="button" style="padding:5px 16px;margin:0">เริ่มชุดนี้ใหม่</button>
  </div>
  <div id="list"></div>
  <div id="result" class="result hide"></div>
</div>

<script>
/* ============================================================
   หน่วยการเรียนรู้ที่ 1 ตัวเรา พืช และสัตว์ · วิทยาศาสตร์ ป.1
   บทที่ 2 ถอดจากหนังสือเรียนที่ผู้ใช้ถ่ายมา หน้า 30–41 (ส่วนต่าง ๆ ของสัตว์ + สรุปสาระสำคัญ)
   บทที่ 1 ยึดตามหน้าสรุปสาระสำคัญ (หน้า 41) และใบทบทวน science/p1-review.html
   ข้อสอบยึดขอบเขตที่ครูแจ้ง: บทที่ 1 อวัยวะภายนอก–ภายในและหน้าที่
                            บทที่ 2 การดูแลรักษาอวัยวะ · ประสาทสัมผัสทั้ง 5

   โครงข้อมูล
   - SUMMARY : การ์ดสรุปรายบท  { h:'หัวข้อ', li:[...] }  หรือ  { h:'หัวข้อ', dl:[[คำ, ความหมาย], ...] }
   - แบบฝึก  : [โจทย์, [[อิโมจิ, ตัวเลือก], ...], ลำดับที่ถูก (0/1/2), อิโมจิโจทย์, คำอธิบายเฉลย]
               ตัวเลือกจะถูกสลับตำแหน่งใหม่ทุกครั้งที่เริ่มชุด
   - {part:'ชื่อตอน'} = หัวตอนคั่นกลาง
   - ข้อสอบ  : EXAM_POOL = ตอนละคลัง { part, n, qs } สุ่มมาตอนละ n ข้อทุกครั้งที่เริ่มชุดใหม่
   ============================================================ */

const SUMMARY=[];

/* ---------------- ชุดที่ 1 เริ่มต้น: ถามตรง อวัยวะไหน ทำอะไร ----------------
   ทุกชุด: คลังตอนละหลายข้อ สุ่มมาตอนละ n ข้อ ทุกครั้งที่เริ่มชุดใหม่ได้ข้อสอบไม่ซ้ำเดิม */
const L1=[
 { part:'ตอนที่ 1 อวัยวะภายนอกและอวัยวะภายใน', e:'🧒', n:5, qs:[
  ['ข้อใดเป็นอวัยวะภายนอก',[['👂','หู'],['🫀','หัวใจ'],['🫁','ปอด']],0,'','หูอยู่นอกร่างกาย มองเห็นได้'],
  ['ข้อใด ไม่ใช่ อวัยวะภายนอก',[['👃','จมูก'],['✋','มือ'],['🧠','สมอง']],2,'','สมองอยู่ภายในศีรษะ เป็นอวัยวะภายใน'],
  ['ข้อใดเป็นอวัยวะภายในทั้งหมด',[['🫀','หัวใจ ปอด สมอง'],['👀','ตา หู ปาก'],['🦶','มือ เท้า ผิวหนัง']],0,'',''],
  ['ข้อใดเป็นอวัยวะภายนอกทั้งหมด',[['🍲','กระเพาะอาหาร ลำไส้'],['👀','ตา จมูก มือ'],['🫁','ปอด หัวใจ']],1,'',''],
  ['อวัยวะภายในมีลักษณะอย่างไร',[['👀','มองเห็นได้จากภายนอก'],['🫀','อยู่ในร่างกาย มองไม่เห็นจากภายนอก'],['💇','งอกออกมานอกร่างกาย']],1,'',''],
  ['ข้อใดเป็นอวัยวะภายใน',[['🍲','กระเพาะอาหาร'],['👄','ปาก'],['🖐️','ผิวหนัง']],0,'',''],
  ['หัวใจอยู่ส่วนใดของร่างกาย',[['🧑','ในศีรษะ'],['🫀','ในช่องอก'],['🦵','ในขา']],1,'','หัวใจและปอดอยู่ในช่องอก'],
  ['สมองอยู่ส่วนใดของร่างกาย',[['🧑','ในศีรษะ'],['🫀','ในช่องอก'],['🍲','ในช่องท้อง']],0,'',''],
  ['กระเพาะอาหารอยู่ส่วนใดของร่างกาย',[['🧑','ในศีรษะ'],['✋','ในมือ'],['🍲','ในช่องท้อง']],2,'',''],
 ]},
 { part:'ตอนที่ 2 หน้าที่ของอวัยวะ', e:'🫀', n:5, qs:[
  ['ตาทำหน้าที่อะไร',[['👀','ดูสิ่งต่าง ๆ'],['👂','ฟังเสียง'],['👅','รับรส']],0,'',''],
  ['จมูกทำหน้าที่อะไร',[['🍽️','เคี้ยวอาหาร'],['👃','หายใจและดมกลิ่น'],['✋','หยิบจับสิ่งของ']],1,'',''],
  ['ปากทำหน้าที่อะไร',[['👀','มองดูสิ่งต่าง ๆ'],['🦶','รับน้ำหนักตัว'],['🗣️','พูดและรับประทานอาหาร']],2,'',''],
  ['มือทำหน้าที่อะไร',[['✋','หยิบจับสิ่งของ'],['👃','ดมกลิ่น'],['👂','ฟังเสียง']],0,'',''],
  ['เท้าทำหน้าที่อะไร',[['👅','รับรส'],['🦶','เคลื่อนที่และรับน้ำหนักตัว'],['🧠','คิดและจำ']],1,'',''],
  ['สมองทำหน้าที่อะไร',[['🍲','ย่อยอาหาร'],['💨','หายใจ'],['🧠','ควบคุมการทำงานของร่างกาย']],2,'',''],
  ['หัวใจทำหน้าที่อะไร',[['🫀','สูบฉีดเลือดไปเลี้ยงร่างกาย'],['🍲','ย่อยอาหาร'],['👀','มองเห็น']],0,'',''],
  ['ปอดทำหน้าที่อะไร',[['🍲','ย่อยอาหาร'],['🫁','หายใจ'],['🧠','คิดและจำ']],1,'',''],
  ['กระเพาะอาหารทำหน้าที่อะไร',[['🫀','สูบฉีดเลือด'],['💨','หายใจ'],['🍲','ย่อยอาหาร']],2,'',''],
  ['เวลาน้องท่องสูตรคูณ อวัยวะใดทำงานมากที่สุด',[['🧠','สมอง'],['🍲','กระเพาะอาหาร'],['🦶','เท้า']],0,'','สมองใช้คิดและจำ'],
  ['เวลาเตะฟุตบอล อวัยวะใดทำหน้าที่เคลื่อนที่',[['👂','หู'],['🦶','ขาและเท้า'],['👃','จมูก']],1,'⚽',''],
  ['เวลาวิ่งเหนื่อย ๆ แล้วหายใจแรง อวัยวะภายในใดทำงานหนักขึ้น',[['🫁','ปอดและหัวใจ'],['🍲','กระเพาะอาหาร'],['🌀','ลำไส้']],0,'🏃',''],
 ]},
 { part:'ตอนที่ 3 ประสาทสัมผัสทั้ง 5', e:'👂', n:5, qs:[
  ['ประสาทสัมผัสของคนเรามีกี่อย่าง',[['3️⃣','3 อย่าง'],['4️⃣','4 อย่าง'],['5️⃣','5 อย่าง']],2,'',''],
  ['ข้อใดเป็นอวัยวะรับสัมผัสทั้ง 5 อย่างถูกต้อง',[['👀','ตา หู จมูก ลิ้น ผิวหนัง'],['🫀','หัวใจ ปอด สมอง ตา หู'],['✋','มือ เท้า ขา แขน ผม']],0,'',''],

/* ข้อสอบ: สุ่มจากคลังตอนละ n ข้อ เก็บชุดที่สุ่มไว้ระหว่างทำ พอเริ่มใหม่ค่อยสุ่มชุดใหม่ */
function shuffle(a){ for(let i=a.length-1;i>0;i--){ const j=Math.floor(Math.random()*(i+1)); [a[i],a[j]]=[a[j],a[i]]; } return a; }
function buildExam(fresh){
  const T=TABS[cur]; if(!T.pool) return;
  const key=K(T.id)+'-pick';
  let pick=null;
  try{ pick=fresh?null:JSON.parse(localStorage.getItem(key)||'null'); }catch(e){ pick=null; }
  const okPick=Array.isArray(pick) && pick.length===T.pool.length &&
    pick.every((p,i)=>Array.isArray(p) && p.length===T.pool[i].n && p.every(j=>T.pool[i].qs[j]));
  if(!okPick){
    /* ชุดคละมีโจทย์ขึ้นต้นเหมือนกันจากต่างระดับ ไม่ให้โผล่ซ้ำในชุดเดียว */
    const seen=new Set();
    pick=T.pool.map(p=>shuffle(p.qs.map((q,i)=>i)).filter(i=>!seen.has(p.qs[i][0]) && seen.add(p.qs[i][0])).slice(0,p.n));
    try{ localStorage.setItem(key, JSON.stringify(pick)); }catch(e){}
  }
  T.items=[];
  T.pool.forEach((p,pi)=>{ T.items.push({part:p.part, e:p.e}); pick[pi].forEach(j=>T.items.push(p.qs[j])); });
}

const synth=window.speechSynthesis;
let thVoice=null;
function pickVoice(){ if(!synth) return; const v=synth.getVoices().filter(x=>/^th/i.test(x.lang));
  thVoice=v.find(x=>/Kanya|Narisa|Premwadee|Achara/i.test(x.name))||v[0]||null; }
if(synth){ pickVoice(); synth.onvoiceschanged=pickVoice; }
function speak(text){
  if(!synth) return;
  try{ synth.cancel(); }catch(e){}
  const u=new SpeechSynthesisUtterance(text); u.lang='th-TH'; u.rate=0.9;
  if(thVoice) u.voice=thVoice;
  synth.speak(u);
}

    h+='<div class="sum" style="--pc:'+s.c[0]+';--pcd:'+s.c[1]+';--pl:'+s.c[2]+'">'+
       '<div class="sh"><span class="pe">'+s.e+'</span><h2>'+s.t+'</h2>'+
       '<button class="spk" type="button" data-s="'+si+'" aria-label="อ่าน'+strip(s.t)+'">🔊</button></div>';
    s.blocks.forEach(b=>{
      h+='<h3>'+b.h+'</h3>';
      if(b.li) h+='<ul>'+b.li.map(x=>'<li>'+x+'</li>').join('')+'</ul>';
      if(b.dl) h+='<dl class="ft">'+b.dl.map(p=>'<dt>'+p[0]+'</dt><dd>'+p[1]+'</dd>').join('')+'</dl>';
    });
    h+='</div>';
  });
  $('#list').innerHTML=h;
  $('#list').querySelectorAll('.spk').forEach(b=>b.onclick=()=>{
    const s=SUMMARY[+b.dataset.s];
    let t=strip(s.t)+' … ';
    s.blocks.forEach(bl=>{
      t+=strip(bl.h)+' … ';
      if(bl.li) t+=bl.li.map(strip).join(' … ')+' … ';
      if(bl.dl) t+=bl.dl.map(p=>strip(p[0])+' คือ '+strip(p[1])).join(' … ')+' … ';
    });
    speak(t);
  });
}

/* ---------------- หน้าแบบฝึก ---------------- */
function render(){
  renderTabs();
  if(TABS[cur].summary){ renderSummary(); return; }
  load(); buildExam(!Object.keys(ans).length); loadOrder(!Object.keys(ans).length);
  $('#score').className='score';
  $('#tools').className='tools';
  const T=TABS[cur];
  $('#tt').textContent=T.title;
  $('#note').innerHTML=T.note||'';
  let n=0, h='', pi=0, pc=PARTC[0];
  const pcv=()=>'--pc:'+pc[0]+';--pcd:'+pc[1]+';--pl:'+pc[2];
  T.items.forEach(x=>{
    if(!Array.isArray(x)){ pc=PARTC[pi++%PARTC.length];
      h+='<div class="part" style="'+pcv()+'"><span class="pe">'+(x.e||pc[3])+'</span>'+x.part+'</div>'; return; }
    const k=n++;
    /* ตัวเลือกยาว ให้เรียงลงมาทีละบรรทัด อ่านง่ายกว่าเรียง 3 คอลัมน์ */
    const longest=Math.max.apply(null, x[1].map(o=>o[1].length));
    h+='<div class="q" style="'+pcv()+'" id="q'+k+'"><div class="qh"><div class="num">'+(k+1)+'</div>'+
       '<button class="spk" type="button" data-k="'+k+'" aria-label="อ่านโจทย์ข้อ '+(k+1)+'">🔊</button>'+
       '<div class="qt">'+x[0]+'</div>'+(x[3]?'<div class="qe">'+x[3]+'</div>':'')+'</div>'+
       '<div class="opts'+(longest>18?' list':'')+'">'+
       ORD[k].map((i,pos)=>{ const o=x[1][i];
         return '<div class="optwrap">'+
           '<button type="button" class="opt'+(o[0]?'':' noem')+'" data-k="'+k+'" data-i="'+i+'">'+
           '<span class="lt">'+TL[pos]+'</span>'+(o[0]?'<span class="em">'+o[0]+'</span>':'')+
           '<span class="lb">'+o[1]+(readOf(o[1]) ? '<span class="rd">อ่านว่า '+readOf(o[1])+'</span>' : '')+'</span>'+
           '</button>'+
           '<button type="button" class="sayb" data-say="'+attr(spoken(o[1]))+'" aria-label="ฟังตัวเลือก '+TL[pos]+'">🔊</button>'+
           '</div>'; }).join('')+
       '</div><div class="fb"></div></div>';
  });
  $('#list').innerHTML=h;
  const Q=questions();
  $('#list').querySelectorAll('.spk').forEach(b=>b.onclick=()=>readQ(Q[+b.dataset.k],+b.dataset.k));
  $('#list').querySelectorAll('.opt').forEach(b=>b.onclick=()=>pick(+b.dataset.k,+b.dataset.i,true));
  $('#list').querySelectorAll('.sayb').forEach(b=>b.onclick=()=>speak(b.dataset.say));
  Object.keys(ans).forEach(k=>show(+k, ans[k]));
  updateScore(false);
}

function show(k,i,say){
  const q=questions()[k], el=$('#q'+k); if(!q||!el) return;
  const ok=i===q[2];
  el.classList.add(ok?'ok':'no');
  el.querySelectorAll('.opt').forEach(b=>{
    const j=+b.dataset.i; b.classList.add('done');
    if(j===q[2]) b.classList.add('right');
    else if(j===i) b.classList.add('wrong');
    else b.classList.add('dim');
  });
  const fb=el.querySelector('.fb');
  fb.className='fb '+(ok?'ok':'no');
  fb.innerHTML=(ok ? PRAISE[k%PRAISE.length] : '✗ คำตอบที่ถูกคือ '+TL[ORD[k].indexOf(q[2])]+'. '+q[1][q[2]][1])+
    (q[4]?'<small>'+q[4]+'</small>':'');
  /* อ่านเฉลยให้ฟังทันทีที่เลือก (ตอนโหลดหน้าเก่าคืนมาไม่ต้องอ่าน) */
  if(say) speak((ok ? 'ถูกต้อง เก่งมาก … '+spoken(q[1][q[2]][1]) : 'ยังไม่ใช่ คำตอบที่ถูกคือ '+spoken(q[1][q[2]][1])) + (q[4] ? ' … '+strip(q[4]) : ''));
}

function pick(k,i,fresh){
  if(ans[k]!==undefined) return;
  ans[k]=i; save(); show(k,i,fresh); updateScore(fresh);
  if(fresh){
    const nx=$('#q'+(k+1));
    if(nx && ans[k+1]===undefined){
      setTimeout(()=>{ nx.scrollIntoView({behavior:'smooth',block:'center'});
        if($('#autoread').checked) readQ(questions()[k+1],k+1); },650);
    }
  }
}

function updateScore(fresh){
  const Q=questions(), keys=Object.keys(ans);
  const right=keys.filter(k=>ans[k]===Q[k][2]).length;
  $('#score').textContent=right+' / '+Q.length;
  const r=$('#result');
  if(keys.length<Q.length){ r.className='result hide'; return; }
  const pct=right/Q.length;
  const stars = pct>=.9?'⭐⭐⭐' : pct>=.7?'⭐⭐' : pct>=.5?'⭐' : '💪';
  const msg = pct>=.9?'เก่งมาก! พร้อมสอบแล้ว' : pct>=.7?'ดีมาก! ทบทวนข้อที่ผิดอีกนิดนะ'
            : pct>=.5?'ผ่านแล้ว ลองอ่านสรุปอีกรอบแล้วทำใหม่นะ' : 'ไม่เป็นไร กลับไปอ่านสรุปก่อน แล้วค่อยลองใหม่นะ';
  r.className='result';
  r.innerHTML='<div class="cheer">'+(pct>=.7?'🎉🏆🎉':'🌈')+'</div><div class="stars">'+stars+'</div>'+
    '<div class="big">'+right+' / '+Q.length+'</div><p>'+msg+'</p>'+
    '<button class="btn" type="button" id="again">'+(TABS[cur].pool?'🎲 สุ่มข้อสอบชุดใหม่':'ทำชุดนี้ใหม่')+'</button>'+
    (TABS[cur+1]?'<button class="btn gh" type="button" id="toNext">ไปชุดถัดไป ▶</button>':'')+
    '<a class="btn gh" href="unit1-body.html#sum" style="display:inline-block;text-decoration:none">กลับไปอ่านสรุป</a>';
  $('#again').onclick=resetCur;
  const nx=$('#toNext'); if(nx) nx.onclick=()=>goTab(cur+1);
  if(fresh) setTimeout(()=>r.scrollIntoView({behavior:'smooth',block:'center'}),700);
  if(fresh){ try{ const bk=K(TABS[cur].id)+'-best'; if(pct>+(localStorage.getItem(bk)||0)) localStorage.setItem(bk, pct); }catch(e){} renderTabs(); }
  if(fresh && window.KP){
    const wrong=keys.filter(k=>ans[k]!==Q[k][2]).map(k=>strip(Q[k][0])).slice(0,15);
    KP.log({ kind:'test', page:'science-exam', subject:'วิทยาศาสตร์', title:'ข้อสอบเตรียมสอบ · '+TABS[cur].title,
             score:right, total:Q.length, stars: pct>=.9?3 : pct>=.7?2 : 1, wrong });
  }
}

function resetCur(){ ans={}; save(); render(); window.scrollTo({top:0,behavior:'smooth'}); }
$('#reset').onclick=()=>{ if(!Object.keys(ans).length || confirm('ล้างคำตอบของชุดนี้แล้วเริ่มใหม่?')) resetCur(); };

render();
</script>
<script src="../common/progress.js"></script>
</body>
</html>
