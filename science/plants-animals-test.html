<!doctype html>
<html lang="th">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<link rel="apple-touch-icon" href="../apple-touch-icon.png">
<link rel="icon" type="image/png" href="../favicon.png">
<title>แบบทดสอบ พืชและสัตว์ ป.1</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Mali:wght@600;700&family=Noto+Sans+Thai+Looped:wght@400;600;700&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
:root{
  --paper:#F7F9F2; --card:#fff; --ink:#1F2A24; --mute:#6B7A70; --line:#DCE3D6;
  --leaf:#2E7D4F; --leaf-soft:#E3F1E8; --sky:#1E6FB8; --sky-soft:#E4EFFA;
  --ok:#2E7D32; --okbg:#E3F4E5; --no:#C62828; --nobg:#FDE8E8; --gold:#E0A100;
  --ac:var(--leaf); --acs:var(--leaf-soft);
}
body{background:var(--paper);color:var(--ink);font-family:'Noto Sans Thai Looped','Noto Sans Thai',sans-serif;
  font-size:18px;line-height:1.6;-webkit-text-size-adjust:100%}
button{font:inherit;color:inherit;cursor:pointer}

.top{position:sticky;top:0;z-index:20;background:rgba(247,249,242,.95);backdrop-filter:blur(6px);
  border-bottom:1px solid var(--line);padding-top:env(safe-area-inset-top)}
.top .in{max-width:900px;margin:0 auto;padding:8px 14px;display:flex;align-items:center;gap:10px}
.back{text-decoration:none;color:var(--ink);border:2px solid var(--ink);background:#fff;border-radius:12px;
  padding:3px 12px;font-size:.9rem;font-weight:700;white-space:nowrap}
.top .tt{flex:1;font-family:'Mali',sans-serif;font-weight:700;overflow:hidden;white-space:nowrap;text-overflow:ellipsis}
.score{background:var(--ac);color:#fff;border-radius:999px;padding:3px 12px;font-weight:700;font-size:.9rem;white-space:nowrap}

.wrap{max-width:900px;margin:0 auto;padding:16px 14px 60px}
.hero{text-align:center;padding:10px 0 14px}
.hero h1{font-family:'Mali',sans-serif;font-size:1.7rem;line-height:1.3;color:var(--leaf)}
.hero p{color:var(--mute);font-size:.95rem}

.tabs{display:flex;gap:8px;justify-content:center;flex-wrap:wrap;margin:6px 0 18px}
.tabs button{border:2px solid var(--line);background:#fff;border-radius:999px;padding:6px 16px;font-weight:700;font-size:.95rem}
.tabs button.on{background:var(--ac);border-color:var(--ac);color:#fff}

.tools{display:flex;gap:10px;justify-content:center;align-items:center;flex-wrap:wrap;margin-bottom:16px;font-size:.9rem;color:var(--mute)}
.tools label{display:flex;align-items:center;gap:6px}
.tools input{width:20px;height:20px;accent-color:var(--ac)}

.part{margin:22px 0 10px;background:var(--ac);color:#fff;border-radius:14px;padding:8px 16px;
  font-family:'Mali',sans-serif;font-weight:700;font-size:1.1rem}

.q{background:var(--card);border:2px solid var(--line);border-radius:18px;padding:14px;margin-bottom:14px;transition:.2s}
.q.ok{border-color:var(--ok)} .q.no{border-color:var(--no)}
.qh{display:flex;align-items:flex-start;gap:10px;margin-bottom:10px}
.num{flex-shrink:0;width:38px;height:38px;border-radius:50%;background:var(--ac);color:#fff;display:grid;place-items:center;
  font-weight:700;font-size:1.05rem}
.qt{flex:1;font-weight:700;font-size:1.1rem;padding-top:4px}
.qe{font-size:2rem;line-height:1}
.spk{flex-shrink:0;border:2px solid var(--line);background:#fff;border-radius:12px;width:42px;height:42px;font-size:1.2rem}
.spk:active{background:var(--acs)}

.opts{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.opts.list{grid-template-columns:1fr}
.opt{position:relative;border:2px solid var(--line);background:#fff;border-radius:14px;padding:10px 6px 10px;
  display:flex;flex-direction:column;align-items:center;gap:4px;text-align:center;min-height:118px;transition:.12s}
.opt .em{font-size:2.6rem;line-height:1.15}
.opt .lb{font-size:.98rem;font-weight:600;line-height:1.35}
.opt .lt{position:absolute;top:6px;left:8px;width:26px;height:26px;border-radius:50%;border:2px solid var(--ac);
  color:var(--ac);font-weight:700;font-size:.85rem;display:grid;place-items:center;background:#fff}
.opt.noem{justify-content:center}
.opt.noem .lb{font-size:1.15rem}
.opts.list .opt{flex-direction:row;min-height:0;padding:10px 12px;text-align:left;gap:12px}
.opts.list .opt .lt{position:static;flex-shrink:0}
.opts.list .opt.noem{justify-content:flex-start}
.opts.list .opt .lb{font-size:1.02rem}
.opt:not([disabled]):hover{border-color:var(--ac);background:var(--acs)}
.opt:not([disabled]):active{transform:scale(.97)}
.opt[disabled]{cursor:default}
.opt.right{border-color:var(--ok);background:var(--okbg)}
.opt.right .lt{border-color:var(--ok);background:var(--ok);color:#fff}
.opt.wrong{border-color:var(--no);background:var(--nobg)}
.opt.wrong .lt{border-color:var(--no);background:var(--no);color:#fff}
.opt.dim{opacity:.45}
.fb{margin-top:8px;font-weight:700;font-size:.98rem;min-height:0}
.fb.ok{color:var(--ok)} .fb.no{color:var(--no)}

.result{background:#fff;border:3px solid var(--gold);border-radius:20px;padding:20px;text-align:center;margin-top:20px}
.result .stars{font-size:2.4rem;letter-spacing:4px}
.result .big{font-family:'Mali',sans-serif;font-size:2.2rem;font-weight:700;color:var(--ac)}
.result p{margin:4px 0 12px}
.btn{border:none;background:var(--ac);color:#fff;border-radius:12px;padding:9px 20px;font-weight:700;margin:4px}
.btn.gh{background:#fff;color:var(--ac);border:2px solid var(--ac)}
.hide{display:none}

@media (max-width:480px){
  body{font-size:17px}
  .hero h1{font-size:1.4rem}
  .opts{gap:7px}
  .opt{min-height:104px;padding:8px 3px}
  .opt .em{font-size:2.1rem}
  .opt .lb{font-size:.86rem}
  .opt .lt{width:22px;height:22px;font-size:.75rem;top:4px;left:4px}
  .qt{font-size:1.02rem}
}

/* ================= ธีมเด็ก: กล่องลอย สีพาสเทล สบายตา ================= */
body{background:#FFFBF4;color:#3A3350}
body::before{content:"";position:fixed;inset:0;pointer-events:none;z-index:-1;
  background:radial-gradient(circle at 0% 15%,#FFE3EC 0 120px,transparent 121px),
             radial-gradient(circle at 100% 40%,#E3F1FF 0 100px,transparent 101px),
             radial-gradient(circle at 0% 75%,#E6F8EE 0 140px,transparent 141px),
             radial-gradient(circle at 100% 92%,#FFF1D6 0 110px,transparent 111px)}
.top{background:rgba(255,251,244,.92);border-bottom:none;box-shadow:0 4px 18px rgba(58,51,80,.06)}
.back{border:none;background:#fff;color:var(--leaf);border-radius:999px;box-shadow:0 3px 12px rgba(58,51,80,.12)}
.top .tt{color:#3A3350}
.score{background:#fff;color:var(--leaf);box-shadow:0 3px 12px rgba(58,51,80,.12)}
.hero{position:relative;overflow:hidden;border-radius:30px;margin-top:8px;padding:20px 18px 80px;border:none;
  background:linear-gradient(180deg,#9AD7F7,#DDF3FF);box-shadow:0 12px 30px rgba(58,51,80,.10)}
.hero svg{position:absolute;left:0;bottom:0;width:100%;height:90px}
.hero h1{position:relative;color:#fff;text-shadow:0 2px 8px rgba(30,80,120,.35)}
.hero p{position:relative;color:#2D5B78;font-weight:600}
.hero .deco{position:relative;font-size:2.3rem;letter-spacing:6px;display:block;margin-bottom:2px}
.tabs button{border:none;background:#fff;box-shadow:0 4px 14px rgba(58,51,80,.10);padding:8px 20px;color:#3A3350}
.tabs button.on{background:var(--leaf);color:#fff}
.tools .btn.gh{border:none;box-shadow:0 3px 12px rgba(58,51,80,.10)}
.part{background:var(--pl);color:var(--pcd);box-shadow:none;border-radius:20px;padding:8px 14px 8px 8px;font-size:1.12rem;
  display:flex;align-items:center;gap:10px}
.part .pe{width:40px;height:40px;border-radius:14px;background:#fff;display:grid;place-items:center;font-size:1.3rem;
  box-shadow:0 3px 10px rgba(58,51,80,.08)}
.q{border:none;border-radius:24px;background:#fff;box-shadow:0 6px 18px rgba(58,51,80,.07)}
.q.ok{border:none;background:#fff;box-shadow:0 0 0 3px #BDEBCB, 0 6px 18px rgba(58,51,80,.07)}
.q.no{border:none;background:#fff;box-shadow:0 0 0 3px #FFD9C6, 0 6px 18px rgba(58,51,80,.07)}
.num{background:var(--pl);color:var(--pcd);border-radius:13px}
.spk{border:none;background:var(--pl)}
.opt{border:2px solid transparent;background:var(--ob);box-shadow:none}
.opt .lt{border:none;color:#fff;background:var(--od)}
.opts .opt:nth-child(1){--ob:#FFF1F6;--od:#F07AA6}
.opts .opt:nth-child(2){--ob:#EEF6FF;--od:#5AA0E6}
.opts .opt:nth-child(3){--ob:#FFF8E1;--od:#E0AE2B}
.opt:not([disabled]):hover{background:#fff;border-color:var(--od)}
.opt.right{border-color:#9EDDB2;background:#EFFAF2;box-shadow:none}
.opt.right .lt{background:#5BC07D}
.opt.wrong{border-color:#FFCBB3;background:#FFF5EF;box-shadow:none}
.opt.wrong .lt{background:#F29B72}
.opt.dim{opacity:.5}
.fb{font-family:'Mali',sans-serif;font-size:1.05rem}
.fb.ok{color:#2F9E5B} .fb.no{color:#D2693C}
.result{border:none;border-radius:30px;box-shadow:0 16px 40px rgba(58,51,80,.14)}
.result .cheer{font-size:2.6rem}
.btn{border:none;border-radius:999px;box-shadow:0 6px 16px rgba(58,51,80,.16)}
</style>
</head>
<body>
<div class="top"><div class="in">
  <a class="back" href="../">‹ หน้ารวม</a>
  <div class="tt" id="tt">แบบทดสอบ พืชและสัตว์</div>
  <span class="score" id="score">0 / 0</span>
</div></div>

<div class="wrap">
  <div class="hero">
    <svg viewBox="0 0 600 90" preserveAspectRatio="none" aria-hidden="true">
      <path d="M0 52 Q120 20 260 46 T600 36 V90 H0Z" fill="#8FD46B"/>
      <path d="M0 70 Q170 44 360 66 T600 60 V90 H0Z" fill="#6CC04A"/>
      <g fill="#FF7AB6"><circle cx="70" cy="74" r="5"/><circle cx="310" cy="78" r="5"/><circle cx="530" cy="72" r="5"/></g>
      <g fill="#FFD93D"><circle cx="70" cy="74" r="2"/><circle cx="310" cy="78" r="2"/><circle cx="530" cy="72" r="2"/></g>
    </svg>
    <span class="deco" aria-hidden="true">🌱🌵🐟🐦🐢</span>
    <h1>แบบทดสอบวิทยาศาสตร์ ป.1</h1>
    <p>เรื่อง ส่วนต่าง ๆ ของพืชและสัตว์ · แตะคำตอบที่ถูกต้องที่สุดเพียงข้อเดียว</p>
  </div>
  <div class="tabs" id="tabs"></div>
  <div class="tools">
    <label><input type="checkbox" id="autoread"> อ่านโจทย์ให้ฟังอัตโนมัติ</label>
    <button class="btn gh" id="reset" type="button" style="padding:4px 14px;margin:0">เริ่มชุดนี้ใหม่</button>
  </div>
  <div id="list"></div>
  <div id="result" class="result hide"></div>
</div>

<script>
/* ============================================================
   ข้อมูลข้อสอบ
   แต่ละข้อ: [โจทย์, [[อิโมจิ, คำตอบ], ...], ลำดับคำตอบที่ถูก (0=ก 1=ข 2=ค), อิโมจิประกอบโจทย์ (ถ้ามี)]
   { part:'ชื่อตอน' } = หัวตอน

  {part:'ตอนที่ 1 ส่วนต่าง ๆ ของพืช'},

  ['ส่วนใดลำเลียงน้ำและธาตุอาหารจากราก', [['🎋','ลำต้น'],['🍏','ผล'],['🌸','ดอก']], 0],
  ['ส่วนใดสร้างอาหารให้พืช', [['🫚','ราก'],['🌸','ดอก'],['🍃','ใบ']], 2],
  ['ใบมีหน้าที่ใดอีก', [['🫛','ห่อหุ้มเมล็ด'],['🍃','หายใจและคายน้ำ'],['🫚','ยึดต้นกับดิน']], 1],
  ['ดอกมีหน้าที่สำคัญอย่างไร', [['🌸','ช่วยสืบพันธุ์'],['🚿','ดูดน้ำ'],['🫚','ยึดต้น']], 0],

  ['ดอกของพืชแต่ละชนิดอาจต่างกันในเรื่องใด', [['🌺','สี รูปร่าง และกลิ่น'],['🦵','มีขาและไม่มีขา'],['🐶','มีหูและไม่มีหู']], 0],

{ id:'txt20', name:'ชุด 20 ข้อ', title:'เรื่อง พืชและสัตว์', style:'list', items:[

  ['กระบองเพชรทนแล้งได้ดี เพราะเหตุใด', [['','ใบมีขนาดใหญ่'],['','ลำต้นเก็บน้ำได้มาก'],['','รากมีสีเขียว']], 1, '🌵'],
  {part:'ตอนที่ 2 สัตว์และส่วนต่าง ๆ ของสัตว์'},

  ['เต่าใช้ส่วนใดห่อหุ้มและปกป้องร่างกาย', [['','กระดอง'],['','เขา'],['','งา']], 0, '🐢'],

const TL=['ก','ข','ค'];
/* สีประจำตอน: [สีหลัก, สีเข้ม, สีอ่อน, รูป] */
const PARTC=[['#7ED9B0','#1F7F58','#EAFAF2','🌱'],['#FFB38A','#B4551C','#FFF2EA','🌵'],['#8EC5FF','#2F6DB0','#EEF6FF','🐾']];
const PRAISE=['✓ ถูกต้อง เก่งมาก! 🎉','✓ สุดยอดเลย! ⭐','✓ ถูกต้อง! 👏','✓ เยี่ยมมาก! 🌈','✓ ใช่แล้ว! 😄'];
const $=s=>document.querySelector(s);
let cur=0, ans={};      // ans[ลำดับข้อ] = ตัวเลือกที่แตะ

/* ---- จำคำตอบไว้ในเครื่อง ปิดแล้วเปิดใหม่ยังอยู่ ---- */
const KEY=id=>'kids-plants-animals-'+id;
function load(){ try{ ans=JSON.parse(localStorage.getItem(KEY(TESTS[cur].id))||'{}')||{}; }catch(e){ ans={}; } }
function save(){ try{ localStorage.setItem(KEY(TESTS[cur].id), JSON.stringify(ans)); }catch(e){} }
try{ const t=localStorage.getItem('kids-plants-animals-tab'); if(t!==null && TESTS[+t]) cur=+t; }catch(e){}
try{ $('#autoread').checked = localStorage.getItem('kids-plants-animals-read')==='1'; }catch(e){}
$('#autoread').onchange=e=>{ try{ localStorage.setItem('kids-plants-animals-read', e.target.checked?'1':'0'); }catch(err){} };

/* ---- อ่านออกเสียงภาษาไทย ---- */
const synth=window.speechSynthesis;
let thVoice=null;
function pickVoice(){ if(!synth) return; const v=synth.getVoices().filter(x=>/^th/i.test(x.lang));
  thVoice=v.find(x=>/Kanya|Narisa|Premwadee|Achara/i.test(x.name))||v[0]||null; }
if(synth){ pickVoice(); synth.onvoiceschanged=pickVoice; }
function speak(text){
  if(!synth) return;
  try{ synth.cancel(); }catch(e){}
  const u=new SpeechSynthesisUtterance(text); u.lang='th-TH'; u.rate=0.9;
  if(thVoice) u.voice=thVoice;
  synth.speak(u);
}
const readQ=q=>speak(q[0]+' … '+q[1].map((o,i)=>TL[i]+' '+o[1]).join(' … '));

function questions(){ return TESTS[cur].items.filter(x=>Array.isArray(x)); }

function renderTabs(){
  $('#tabs').innerHTML=TESTS.map((t,i)=>'<button type="button" class="'+(i===cur?'on':'')+'" data-i="'+i+'">'+t.name+'</button>').join('');
  $('#tabs').querySelectorAll('button').forEach(b=>b.onclick=()=>{
    cur=+b.dataset.i; try{ localStorage.setItem('kids-plants-animals-tab', cur); }catch(e){}
    render(); window.scrollTo({top:0});
  });
}

function render(){
  load(); renderTabs();
  const T=TESTS[cur];
  $('#tt').textContent=T.name+' · '+T.title;
  let n=0, h='', pi=0, pc=PARTC[0];
  const pcv=()=>'--pc:'+pc[0]+';--pcd:'+pc[1]+';--pl:'+pc[2];
  T.items.forEach(x=>{
    if(!Array.isArray(x)){ pc=PARTC[pi++%PARTC.length]; h+='<div class="part" style="'+pcv()+'"><span class="pe">'+pc[3]+'</span>'+x.part+'</div>'; return; }
    const k=n++;
    h+='<div class="q" style="'+pcv()+'" id="q'+k+'"><div class="qh"><div class="num">'+(k+1)+'</div>'+
       '<div class="qt">'+x[0]+'</div>'+(x[3]?'<div class="qe">'+x[3]+'</div>':'')+
       '<button class="spk" type="button" data-k="'+k+'" aria-label="อ่านโจทย์ข้อ '+(k+1)+'">🔊</button></div>'+
       '<div class="opts'+(T.style==='list'?' list':'')+'">'+
       x[1].map((o,i)=>'<button type="button" class="opt'+(o[0]?'':' noem')+'" data-k="'+k+'" data-i="'+i+'">'+
         '<span class="lt">'+TL[i]+'</span>'+(o[0]?'<span class="em">'+o[0]+'</span>':'')+
         '<span class="lb">'+o[1]+'</span></button>').join('')+
       '</div><div class="fb"></div></div>';
  });
  $('#list').innerHTML=h;
  const Q=questions();
  $('#list').querySelectorAll('.spk').forEach(b=>b.onclick=()=>readQ(Q[+b.dataset.k]));
  $('#list').querySelectorAll('.opt').forEach(b=>b.onclick=()=>pick(+b.dataset.k,+b.dataset.i,true));
  Object.keys(ans).forEach(k=>show(+k, ans[k]));
  updateScore(false);
}

function show(k,i){
  const q=questions()[k], el=$('#q'+k); if(!q||!el) return;
  const ok=i===q[2];
  el.classList.add(ok?'ok':'no');
  el.querySelectorAll('.opt').forEach((b,j)=>{
    b.disabled=true;
    if(j===q[2]) b.classList.add('right');
    else if(j===i) b.classList.add('wrong');
    else b.classList.add('dim');
  });
  const fb=el.querySelector('.fb');
  fb.className='fb '+(ok?'ok':'no');
  fb.textContent= ok ? PRAISE[k%PRAISE.length] : '✗ คำตอบที่ถูกคือ '+TL[q[2]]+'. '+q[1][q[2]][1];
}

function pick(k,i,fresh){
  if(ans[k]!==undefined) return;
  ans[k]=i; save(); show(k,i); updateScore(fresh);
  if(fresh){
    const nx=$('#q'+(k+1));
    if(nx && ans[k+1]===undefined){
      setTimeout(()=>{ nx.scrollIntoView({behavior:'smooth',block:'center'});
        if($('#autoread').checked) readQ(questions()[k+1]); },650);
    }
  }
}

function updateScore(fresh){
  const Q=questions(), keys=Object.keys(ans);
  const right=keys.filter(k=>ans[k]===Q[k][2]).length;
  $('#score').textContent=right+' / '+Q.length;
  const r=$('#result');
  if(keys.length<Q.length){ r.className='result hide'; return; }
  const pct=right/Q.length;
  const stars = pct>=.9?'⭐⭐⭐' : pct>=.7?'⭐⭐' : pct>=.5?'⭐' : '💪';
  const msg = pct>=.9?'เก่งมาก! พร้อมสอบแล้ว' : pct>=.7?'ดีมาก! ทบทวนข้อที่ผิดอีกนิดนะ'
            : pct>=.5?'ผ่านแล้ว ลองดูข้อสีแดงแล้วทำใหม่อีกรอบ' : 'ไม่เป็นไร ค่อย ๆ ทบทวนแล้วลองใหม่นะ';
  const other=TESTS[(cur+1)%TESTS.length];
  r.className='result';
  r.innerHTML='<div class="cheer">'+(pct>=.7?'🎉🏆🎉':'🌈')+'</div><div class="stars">'+stars+'</div><div class="big">'+right+' / '+Q.length+'</div><p>'+msg+'</p>'+
    '<button class="btn" type="button" id="again">ทำชุดนี้ใหม่</button>'+
    '<button class="btn gh" type="button" id="other">ไปทำ'+other.name+'</button>';
  $('#again').onclick=resetCur;
  $('#other').onclick=()=>{ cur=(cur+1)%TESTS.length; try{ localStorage.setItem('kids-plants-animals-tab', cur); }catch(e){} render(); window.scrollTo({top:0}); };
  if(fresh) setTimeout(()=>r.scrollIntoView({behavior:'smooth',block:'center'}),700);
  if(fresh && window.KP){
    const wrong=keys.filter(k=>ans[k]!==Q[k][2]).map(k=>Q[k][0]).slice(0,15);
    KP.log({ kind:'test', page:'plants', subject:'วิทยาศาสตร์', title:'แบบทดสอบพืชและสัตว์ · '+TESTS[cur].name, score:right, total:Q.length,
             stars: pct>=.9?3 : pct>=.7?2 : 1, wrong });
  }
}

function resetCur(){ ans={}; save(); render(); window.scrollTo({top:0,behavior:'smooth'}); }
$('#reset').onclick=()=>{ if(!Object.keys(ans).length || confirm('ล้างคำตอบของชุดนี้แล้วเริ่มใหม่?')) resetCur(); };

render();
</script>
