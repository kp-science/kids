<!doctype html>
<html lang="th">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<link rel="apple-touch-icon" href="../apple-touch-icon.png">
<link rel="icon" type="image/png" href="../favicon.png">
<title>เกมฝึกสมอง</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Mali:wght@600;700&family=Noto+Sans+Thai+Looped:wght@400;600;700&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
:root{--ink:#3A3350;--mute:#8C849E;--paper:#FFFBF4;--ok:#2F9E5B;--no:#D2693C;
  --k:#8EE0D2;--kl:#E6F8F4;--kd:#1F7A70}
body{background:var(--paper);color:var(--ink);font-family:'Noto Sans Thai Looped','Noto Sans Thai',sans-serif;
  font-size:18px;line-height:1.6;-webkit-text-size-adjust:100%;min-height:100vh}
button{font:inherit;color:inherit;cursor:pointer;border:none;background:none}
h1,h2,h3,.mali{font-family:'Mali',sans-serif;font-weight:700}

/* ฉากลอยด้านหลัง */
.deco{position:fixed;inset:0;z-index:0;pointer-events:none;overflow:hidden}
.deco i{position:absolute;border-radius:50%;opacity:.55;animation:floaty 14s ease-in-out infinite}
.deco i:nth-child(1){width:220px;height:220px;background:#FFE3EC;left:-60px;top:14%}
.deco i:nth-child(2){width:160px;height:160px;background:#E3F1FF;right:-40px;top:34%;animation-delay:-4s}
.deco i:nth-child(3){width:260px;height:260px;background:#E6F8EE;left:-90px;top:66%;animation-delay:-8s}
.deco i:nth-child(4){width:180px;height:180px;background:#FFF1D6;right:-50px;top:82%;animation-delay:-2s}
@keyframes floaty{50%{transform:translateY(-22px) scale(1.04)}}
@keyframes bob{50%{transform:translateY(-5px)}}
@keyframes pop{0%{transform:scale(.6);opacity:0}70%{transform:scale(1.08)}100%{transform:scale(1);opacity:1}}
@keyframes shake{25%{transform:translateX(-6px)}75%{transform:translateX(6px)}}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}

.top{position:sticky;top:0;z-index:20;background:rgba(255,251,244,.92);backdrop-filter:blur(6px);
  box-shadow:0 4px 18px rgba(58,51,80,.06);padding-top:env(safe-area-inset-top)}
.top .in{max-width:860px;margin:0 auto;padding:8px 14px;display:flex;align-items:center;gap:10px}
.pillbtn{background:#fff;color:var(--kd);border-radius:999px;padding:4px 14px;font-weight:700;font-size:.92rem;
  box-shadow:0 3px 12px rgba(58,51,80,.12);text-decoration:none;white-space:nowrap}
.top .tt{flex:1;font-family:'Mali',sans-serif;font-weight:700;overflow:hidden;white-space:nowrap;text-overflow:ellipsis}
.wrap{position:relative;z-index:1;max-width:860px;margin:0 auto;padding:14px 16px 60px}

.hero{position:relative;overflow:hidden;border-radius:30px;padding:20px 22px 78px;margin:6px 0 18px;
  background:linear-gradient(180deg,#9AD7F7,#DDF3FF);box-shadow:0 12px 30px rgba(58,51,80,.10)}
.hero svg{position:absolute;left:0;bottom:0;width:100%;height:86px}
.hero .row{position:relative;display:flex;align-items:center;gap:14px}
.hero .emo{width:76px;height:76px;border-radius:26px;background:#fff;display:grid;place-items:center;font-size:2.6rem;
  box-shadow:0 8px 18px rgba(58,51,80,.14);flex:none;animation:bob 3.5s ease-in-out infinite}
.hero h1{font-size:1.9rem;line-height:1.2;color:#fff;text-shadow:0 2px 8px rgba(30,80,120,.35)}
.hero p{color:#2D5B78;font-weight:600;font-size:.95rem}

/* เมนูเกม */
.games{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:16px}
.gcard{background:#fff;border-radius:26px;padding:16px;box-shadow:0 8px 22px rgba(58,51,80,.08);display:flex;flex-direction:column;gap:10px}
.gcard .gh{display:flex;align-items:center;gap:12px}
.gcard .gi{width:60px;height:60px;border-radius:20px;background:var(--gl);display:grid;place-items:center;font-size:2rem;flex:none}
.gcard h3{font-size:1.2rem;line-height:1.25}
.gcard .skill{display:inline-block;font-size:.76rem;font-weight:700;color:var(--gd);background:var(--gl);border-radius:999px;padding:1px 10px}
.gcard p{font-size:.86rem;color:var(--mute)}
.levels{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.lv{background:var(--gl);border-radius:16px;padding:8px 4px;text-align:center;font-weight:700;color:var(--gd);transition:transform .12s}
.lv:hover{transform:translateY(-2px)}
.lv:active{transform:translateY(1px)}
.lv small{display:block;font-size:.8rem;letter-spacing:1px}
.lv.lock{background:#F3F1F6;color:#B7B0C4;cursor:default}

/* หน้าเกม */
.stage{background:#fff;border-radius:28px;padding:16px;box-shadow:0 10px 26px rgba(58,51,80,.08);margin-bottom:14px}
.ghead{display:flex;align-items:center;gap:10px;margin-bottom:12px;flex-wrap:wrap}
.ghead .say{flex:1;min-width:200px;font-weight:700;font-size:1.05rem}
.chip{background:var(--kl);color:var(--kd);border-radius:999px;padding:2px 12px;font-weight:700;font-size:.88rem;white-space:nowrap}
.spk{width:40px;height:40px;border-radius:14px;background:var(--kl);font-size:1.15rem;flex:none}
.msg{min-height:34px;text-align:center;font-family:'Mali',sans-serif;font-size:1.15rem;margin-top:10px}
.msg.ok{color:var(--ok)} .msg.no{color:var(--no)}
.shake{animation:shake .35s}

/* 1 จับคู่ */
.mgrid{display:grid;gap:10px;margin:0 auto;max-width:560px}
.mc{aspect-ratio:1;border-radius:18px;background:linear-gradient(135deg,#B9A2F5,#8EC5FF);font-size:2.4rem;display:grid;place-items:center;
  box-shadow:0 5px 14px rgba(58,51,80,.14);transition:transform .25s,background .25s;color:transparent;position:relative}
.mc::after{content:"❓";position:absolute;font-size:1.5rem;opacity:.7;color:#fff}
.mc.open,.mc.done{background:#fff;color:inherit;transform:rotateY(0);box-shadow:0 0 0 3px var(--k),0 5px 14px rgba(58,51,80,.1)}
.mc.open::after,.mc.done::after{content:none}
.mc.done{box-shadow:0 0 0 3px #9EDDB2;opacity:.8}

/* 2 ไซมอน */
.simon{display:grid;grid-template-columns:1fr 1fr;gap:14px;max-width:380px;margin:6px auto}
.pad{aspect-ratio:1;border-radius:30px;font-size:3.2rem;display:grid;place-items:center;background:var(--pb);
  box-shadow:0 6px 0 var(--ps);transition:transform .1s,filter .1s;filter:saturate(.75) brightness(1)}
.pad.lit{transform:scale(1.07);filter:saturate(1.2) brightness(1.08);box-shadow:0 0 0 6px #fff,0 0 28px var(--pb)}
.pad:active{transform:translateY(4px);box-shadow:0 2px 0 var(--ps)}
.bigbtn{display:block;margin:14px auto 0;background:var(--kd);color:#fff;border-radius:999px;padding:10px 28px;font-weight:700;
  box-shadow:0 6px 16px rgba(58,51,80,.18)}
.bigbtn.gh{background:#fff;color:var(--kd)}

/* 3 ไม่เข้าพวก / 4 ลำดับ */
.row-items{display:flex;flex-wrap:wrap;justify-content:center;gap:10px;margin:8px 0}
.it{width:84px;height:84px;border-radius:22px;background:#FDFCFF;font-size:2.8rem;display:grid;place-items:center;
  box-shadow:0 4px 12px rgba(58,51,80,.09);border:3px solid transparent;transition:transform .12s}
button.it:hover{transform:translateY(-3px);border-color:var(--k)}
.it.right{border-color:#9EDDB2;background:#EFFAF2}
.it.wrong{border-color:#FFCBB3;background:#FFF5EF}
.it.q{background:var(--kl);color:var(--kd);font-size:2.2rem;border:3px dashed var(--k)}
.seq .it{width:66px;height:66px;font-size:2.2rem;border-radius:18px}
.opts{display:flex;justify-content:center;gap:12px;flex-wrap:wrap;margin-top:14px;padding-top:14px;border-top:2px dashed #EFEAF5}

/* 5 พีระมิด */
.pyr{display:flex;flex-direction:column;align-items:center;gap:8px;margin:8px 0 6px}
.pyr .prow{display:flex;gap:8px}
.cell{width:64px;height:54px;border-radius:14px;display:grid;place-items:center;font-size:1.5rem;font-weight:700;background:var(--kl);color:var(--kd)}
.cell.blank{background:#FBFAFE;border:3px dashed var(--k);cursor:pointer;color:var(--ink)}
.cell.blank.focus,.cell.blank.hot{background:#FFF6CC;border-color:#F2C94C;border-style:solid}
.cell.good{background:#EFFAF2;color:var(--ok);border:3px solid #9EDDB2}
.numpad{display:flex;flex-wrap:wrap;gap:6px;justify-content:center;margin-top:12px}
.num{min-width:44px;height:44px;border-radius:14px;font-size:1.15rem;font-weight:700;color:#4A4060;box-shadow:0 2px 6px rgba(58,51,80,.1);
  touch-action:none;-webkit-user-select:none;user-select:none}
.num:nth-child(6n+1){background:#FFD6E5}.num:nth-child(6n+2){background:#FFE2C7}.num:nth-child(6n+3){background:#FFF0B3}
.num:nth-child(6n+4){background:#D5F3DF}.num:nth-child(6n+5){background:#D6EBFF}.num:nth-child(6n){background:#E6DBFF}
.num.sel{outline:3px solid var(--kd);transform:scale(1.1)}
.ghost{position:fixed;left:0;top:0;z-index:99;pointer-events:none;opacity:.92;box-shadow:0 8px 18px rgba(0,0,0,.2)}

/* 6 พาน้องหมา */
.board{display:grid;gap:4px;margin:0 auto;background:#DDF3E4;padding:6px;border-radius:20px;width:max-content;max-width:100%}
.sq{border-radius:10px;background:#F4FBF2;display:grid;place-items:center;position:relative}
.sq.path{background:#FFF3C4}
.dog{position:absolute;inset:0;display:grid;place-items:center;transition:transform .12s}
.dog.bonk{animation:shake .35s}
.prog{display:flex;flex-wrap:wrap;gap:6px;min-height:56px;background:#FBFAFE;border:3px dashed var(--k);border-radius:18px;padding:8px;margin:12px 0 8px;align-items:center}
.prog:empty::before{content:"แตะลูกศรด้านล่างเพื่อสั่งให้น้องหมาเดิน";color:var(--mute);font-size:.9rem;padding-left:6px}
.prog span{width:40px;height:40px;border-radius:12px;background:var(--kl);display:grid;place-items:center;font-size:1.4rem}
.prog span.now{background:#FFE08A;transform:scale(1.1)}
.arrows{display:flex;justify-content:center;gap:10px;flex-wrap:wrap}
.arrow{width:62px;height:62px;border-radius:20px;background:#fff;font-size:2rem;box-shadow:0 5px 14px rgba(58,51,80,.12)}
.arrow:active{transform:translateY(3px)}
.ctrl{display:flex;justify-content:center;gap:10px;margin-top:10px;flex-wrap:wrap}
.ctrl button{background:#fff;border-radius:999px;padding:7px 18px;font-weight:700;box-shadow:0 3px 12px rgba(58,51,80,.12)}
.ctrl .run{background:var(--kd);color:#fff}

/* ชนะ */
.win{text-align:center;padding:26px 16px;animation:pop .45s ease-out}
.win .cheer{font-size:3rem;animation:bob 2.4s ease-in-out infinite}
.win .stars{font-size:2.8rem;letter-spacing:8px}
.win h2{font-size:1.8rem;color:var(--kd)}
.win p{color:var(--mute);margin-bottom:10px}
.win .btns{display:flex;justify-content:center;gap:10px;flex-wrap:wrap}
.win .btns .bigbtn{margin:0}


/* ================= วิธีเล่น ================= */
details.howto{background:#fff;border-radius:26px;margin-bottom:14px;box-shadow:0 10px 26px rgba(58,51,80,.08);overflow:hidden}
details.howto summary{list-style:none;cursor:pointer;display:flex;align-items:center;gap:10px;padding:12px 16px;font-family:'Mali',sans-serif;font-weight:700;color:var(--kd)}
details.howto summary::-webkit-details-marker{display:none}
details.howto summary .hi{width:38px;height:38px;border-radius:13px;background:var(--kl);display:grid;place-items:center;font-size:1.3rem}
details.howto summary::after{content:"แตะเพื่อเปิด ▾";margin-left:auto;font-family:'Noto Sans Thai Looped',sans-serif;font-size:.8rem;color:var(--mute);font-weight:600}
details.howto[open] summary::after{content:"ซ่อน ▴"}
.hbody{padding:0 16px 16px}
.hgoal{background:var(--kl);color:var(--kd);border-radius:16px;padding:10px 14px;font-weight:700;margin-bottom:10px;display:flex;gap:10px;align-items:center}
.hsteps{list-style:none;display:grid;gap:8px}
.hsteps li{display:flex;gap:12px;align-items:center;background:#FDFCFF;border-radius:16px;padding:8px 12px}
.hsteps li .hn{width:28px;height:28px;border-radius:50%;background:var(--kd);color:#fff;font-weight:700;display:grid;place-items:center;font-size:.9rem;flex:none}
.hsteps li .he{font-size:1.7rem;flex:none;width:36px;text-align:center}
.htip{margin-top:10px;background:#FFF9DB;border-radius:16px;padding:9px 14px;font-size:.95rem}
.hlv{margin-top:8px;font-size:.85rem;color:var(--mute);text-align:center}
.hbtns{display:flex;justify-content:center;gap:10px;flex-wrap:wrap;margin-top:12px}
.hbtns .bigbtn{margin:0}
/* ================= เกมท้าทาย ================= */
.sechead{display:flex;align-items:center;gap:10px;margin:26px 0 12px}
.sechead .si{width:44px;height:44px;border-radius:16px;background:#fff;display:grid;place-items:center;font-size:1.5rem;box-shadow:0 4px 12px rgba(58,51,80,.08)}
.sechead h2{font-size:1.35rem}
.sechead small{display:block;font-family:'Noto Sans Thai Looped',sans-serif;font-weight:600;font-size:.82rem;color:var(--mute)}
.pal{display:flex;justify-content:center;gap:10px;flex-wrap:wrap;margin-top:14px}
.pal button{width:62px;height:62px;border-radius:18px;background:#FDFCFF;font-size:2rem;box-shadow:0 4px 12px rgba(58,51,80,.1);border:3px solid transparent}
.pal button.sel{border-color:var(--kd);transform:scale(1.08)}

/* ซูดูกุ */
.sdk{display:grid;margin:4px auto;background:#fff;border:3px solid var(--kd);border-radius:14px;overflow:hidden;width:max-content}
.sdk .c{display:grid;place-items:center;background:#FDFCFF;border-right:1px solid #E9E3F1;border-bottom:1px solid #E9E3F1}
.sdk .c.given{background:var(--kl)}
.sdk .c.bl{cursor:pointer}
.sdk .c.focus{background:#FFF1B8}
.sdk .c.good{background:#EFFAF2}
.sdk .c.br{border-right:3px solid var(--kd)} .sdk .c.bb{border-bottom:3px solid var(--kd)}

/* ตาชั่ง */
.eq{display:flex;align-items:center;justify-content:center;gap:10px;background:#FDFCFF;border-radius:20px;padding:10px 12px;margin:8px auto;max-width:560px;
  box-shadow:0 3px 10px rgba(58,51,80,.06);flex-wrap:wrap}
.eq .pan{min-width:90px;min-height:58px;display:flex;flex-wrap:wrap;justify-content:center;align-items:center;gap:2px;font-size:1.9rem;
  background:var(--kl);border-radius:14px;padding:4px 10px}
.eq .mid{font-size:1.8rem}
.eq.ask{box-shadow:0 0 0 3px var(--k)}
.eq .pan .qm{font-family:'Mali',sans-serif;font-size:1.6rem;color:var(--kd)}
.numopts{display:flex;justify-content:center;gap:12px;flex-wrap:wrap;margin-top:14px}
.numopts button{min-width:70px;height:62px;border-radius:18px;font-size:1.6rem;font-weight:700;background:#FDFCFF;box-shadow:0 4px 12px rgba(58,51,80,.1);border:3px solid transparent;padding:0 10px}
.numopts button.right{border-color:#9EDDB2;background:#EFFAF2}
.numopts button.wrong{border-color:#FFCBB3;background:#FFF5EF}

/* ฮานอย */
.hanoi{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin:6px 0}
.peg{position:relative;height:230px;border-radius:20px;background:#FDFCFF;display:flex;flex-direction:column-reverse;align-items:center;
  padding:10px 4px 16px;gap:4px;box-shadow:0 3px 10px rgba(58,51,80,.06);cursor:pointer}
.peg::before{content:"";position:absolute;bottom:16px;top:24px;left:50%;width:8px;margin-left:-4px;border-radius:8px;background:#E2D9EC}
.peg::after{content:"";position:absolute;bottom:8px;left:10%;right:10%;height:8px;border-radius:8px;background:#D4C8E2}
.peg.sel{box-shadow:0 0 0 3px var(--k)}
.peg.goal{background:#F3FBF5}
.disk{position:relative;z-index:1;height:26px;border-radius:13px;box-shadow:0 2px 0 rgba(0,0,0,.08)}
.disk.up{transform:translateY(-14px)}

/* เลื่อนตัวเลข */
.slide{display:grid;gap:6px;margin:4px auto;width:max-content;background:#EFEAF5;padding:6px;border-radius:18px}
.tl{display:grid;place-items:center;border-radius:14px;font-family:'Mali',sans-serif;font-weight:700;color:#4A4060;box-shadow:0 3px 0 rgba(58,51,80,.12);transition:transform .12s}
.tl.empty{background:transparent;box-shadow:none}
.tl.ok{outline:3px solid #9EDDB2}

/* รถติด */
.lot{position:relative;margin:6px auto;background:#E9E4F0;border-radius:18px;padding:0}
.lot .gridbg{position:absolute;inset:0;display:grid;border-radius:18px;overflow:hidden}
.lot .gridbg span{border:1px dashed #D7CFE3}
.lot .exit{position:absolute;right:-18px;width:18px;background:#9EDDB2;border-radius:0 10px 10px 0;display:grid;place-items:center;font-size:.8rem}
.car{position:absolute;border-radius:12px;display:grid;place-items:center;font-size:1.6rem;touch-action:none;cursor:grab;
  box-shadow:0 3px 0 rgba(0,0,0,.14);transition:transform .15s,left .15s,top .15s}
.car.drag{transition:none;z-index:5;box-shadow:0 8px 16px rgba(0,0,0,.2)}
.car.red{background:#FF8A80}

/* นักสืบ */
.houses{display:grid;gap:10px;margin:6px 0}
.house{border-radius:20px;background:#FDFCFF;text-align:center;padding:0 0 8px;box-shadow:0 3px 10px rgba(58,51,80,.07);overflow:hidden;cursor:pointer}
.house .roof{font-size:.85rem;font-weight:700;padding:4px 2px;color:#fff}
.house .spot{height:64px;margin:8px auto 0;width:64px;border-radius:18px;border:3px dashed #DCD3E6;display:grid;place-items:center;font-size:2.4rem}
.house.hot .spot{background:#FFF1B8;border-color:#F2C94C}
.house .pos{font-size:.75rem;color:var(--mute)}
.clues{list-style:none;background:#FDFCFF;border-radius:18px;padding:8px 12px;margin:10px 0}
.clues li{display:flex;gap:8px;align-items:center;padding:6px 2px;border-bottom:1px dashed #EFEAF5;font-weight:600}
.clues li:last-child{border-bottom:none}
.clues li .cn{width:26px;height:26px;border-radius:9px;background:var(--kl);color:var(--kd);display:grid;place-items:center;font-size:.85rem;flex:none}
.clues li.bad{background:#FFF5EF;border-radius:10px}
.clues li.bad .cn{background:#F29B72;color:#fff}
.tray2{display:flex;justify-content:center;gap:10px;flex-wrap:wrap;min-height:70px;margin-top:6px}
.tray2 button{width:64px;height:64px;border-radius:18px;background:#fff;font-size:2.3rem;box-shadow:0 4px 12px rgba(58,51,80,.1);border:3px solid transparent}
.tray2 button.sel{border-color:var(--kd);transform:scale(1.08)}
@media (max-width:480px){
  .peg{height:190px}.pal button{width:52px;height:52px;font-size:1.7rem}.eq .pan{font-size:1.5rem;min-width:70px}
  .house .spot{width:52px;height:52px;font-size:2rem}.tray2 button{width:54px;height:54px;font-size:2rem}
}
@media (max-width:480px){
  .hero h1{font-size:1.5rem}.hero .emo{width:62px;height:62px;font-size:2.2rem}
  .it{width:70px;height:70px;font-size:2.3rem}.seq .it{width:48px;height:48px;font-size:1.7rem;border-radius:14px}
  .cell{width:54px;height:48px;font-size:1.3rem}.arrow{width:56px;height:56px}
  .mc{font-size:1.9rem;border-radius:14px}
}
</style>
</head>
<body>
<div class="deco" aria-hidden="true"><i></i><i></i><i></i><i></i></div>
<div class="top"><div class="in">
  <a class="pillbtn" id="backbtn" href="../">‹ หน้ารวม</a>
  <div class="tt" id="tt">เกมฝึกสมอง</div>
  <button class="pillbtn" id="mute" type="button" aria-label="เปิดปิดเสียง">🔊</button>
</div></div>
<main class="wrap" id="app"></main>

<script>
/* ============================================================
   เกมฝึกสมอง 6 เกม · เกมละ 3 ระดับ · ผ่านระดับแล้วปลดระดับถัดไป
   ดาวที่ได้เก็บไว้ในเครื่อง (localStorage)
   ============================================================ */
const GAMES = [

let SAVE = {};
try{ SAVE = JSON.parse(localStorage.getItem('kids-brain')||'{}') || {}; }catch(e){ SAVE = {}; }
const starsOf = (g,l) => (SAVE[g]||[])[l]||0;
function saveStars(g,l,s){
  SAVE[g] = SAVE[g]||[0,0,0]; SAVE[g][l] = Math.max(SAVE[g][l]||0, s);
  try{ localStorage.setItem('kids-brain', JSON.stringify(SAVE)); }catch(e){}
}
const unlocked = (g,l) => l===0 || starsOf(g,l-1)>0;

/* ---------------- เสียง ---------------- */
let muted = false, AC = null;
try{ muted = localStorage.getItem('kids-brain-mute')==='1'; }catch(e){}
$('#mute').textContent = muted ? '🔇' : '🔊';
$('#mute').onclick = () => { muted=!muted; $('#mute').textContent = muted?'🔇':'🔊'; try{ localStorage.setItem('kids-brain-mute', muted?'1':'0'); }catch(e){} if(muted&&window.speechSynthesis) speechSynthesis.cancel(); };
function tone(f, d=.16, type='sine', v=.14, when=0){
  if(muted) return;
  try{
    AC = AC || new (window.AudioContext||window.webkitAudioContext)();
    const t = AC.currentTime + when, o = AC.createOscillator(), g = AC.createGain();
    o.type = type; o.frequency.value = f; g.gain.setValueAtTime(v, t); g.gain.exponentialRampToValueAtTime(.001, t+d);
    o.connect(g).connect(AC.destination); o.start(t); o.stop(t+d+.02);
  }catch(e){}
}
const sfx = {
  ok: () => { tone(660,.12); tone(880,.18,'sine',.14,.1); },
  no: () => { tone(260,.22,'triangle',.12); },
  tap:() => { tone(520,.06,'sine',.08); },
  win:() => { [523,659,784,1046].forEach((f,i)=>tone(f,.2,'sine',.14,i*.12)); },
};
let thVoice = null;
function pickVoice(){ if(!window.speechSynthesis) return; const v=speechSynthesis.getVoices().filter(x=>/^th/i.test(x.lang)); thVoice=v.find(x=>/Kanya|Narisa|Premwadee/i.test(x.name))||v[0]||null; }
if(window.speechSynthesis){ pickVoice(); speechSynthesis.onvoiceschanged = pickVoice; }
function speak(t){
  if(muted || !window.speechSynthesis) return;
  try{ speechSynthesis.cancel(); }catch(e){}
  const u = new SpeechSynthesisUtterance(t); u.lang='th-TH'; u.rate=.95; if(thVoice) u.voice=thVoice; speechSynthesis.speak(u);
}

const PADS = [['🐸','#9EE6A8','#5FBF6E',330],['🐥','#FFE08A','#E0B53A',392],['🐳','#9CCBFF','#5A95D6',440],['🦊','#FFB99A','#E07F55',523]];
function gSimon(l, st, tok){
  const target=[4,6,8][l], speed=[750,600,480][l];
  let seq=[pick([0,1,2,3]), pick([0,1,2,3])], pos=0, listening=false;
  st.innerHTML = head('ดูและฟังให้ดี แล้วแตะสัตว์ตามลำดับเดิม', '<span class="chip" id="sc">ยาว 2 / '+target+'</span>')+
    '<div class="simon">'+PADS.map((p,i)=>'<button class="pad" type="button" data-i="'+i+'" style="--pb:'+p[1]+';--ps:'+p[2]+'" aria-label="'+p[0]+'">'+p[0]+'</button>').join('')+'</div>'+
    '<div class="msg" id="msg">กด "เริ่ม" แล้วดูให้ดีนะ</div><button class="bigbtn" id="sgo" type="button">▶ เริ่ม</button>';
  const pads = st.querySelectorAll('.pad');
  async function flash(i, d){ pads[i].classList.add('lit'); tone(PADS[i][3], d/1000, 'sine', .16); await sleep(d); pads[i].classList.remove('lit'); }
  async function play(){
    listening=false; setMsg('ดูนะ… 👀'); $('#sgo').style.visibility='hidden';
    await sleep(500);
    for(const i of seq){ if(!alive(tok)) return; await flash(i, speed*.75); await sleep(speed*.3); }
    if(!alive(tok)) return;
    pos=0; listening=true; setMsg('ตาหนูแล้ว แตะตามได้เลย 👆');
  }
  $('#sgo').onclick = play;
  pads.forEach(p => p.onclick = async () => {
    if(!listening) return;
    const i=+p.dataset.i; flash(i, 220);
    if(i!==seq[pos]){ listening=false; bad(p); await sleep(900); if(alive(tok)){ setMsg('ดูลำดับเดิมอีกครั้งนะ'); await sleep(600); if(alive(tok)) play(); } return; }
    pos++;
    if(pos===seq.length){
      listening=false;
      if(seq.length>=target){ good(); await sleep(800); if(alive(tok)) win(starsByMistakes(CUR.mistakes)); return; }
      good(); seq.push(pick([0,1,2,3])); $('#sc').textContent='ยาว '+seq.length+' / '+target;
      await sleep(900); if(alive(tok)) play();
    }
  });
}

   ============================================================ */
function makePyramid(l){
  for(let tries=0; tries<500; tries++){
    const n = l===1 ? 4 : 3;
    const base = Array.from({length:n},()=> l===1 ? rnd(4) : 1+rnd(l===0?4:6));
    const rows=[base];
    while(rows[0].length>1){ const b=rows[0]; rows.unshift(b.slice(1).map((x,i)=>x+b[i])); }
    if(rows[0][0]>20) continue;
    /* rows[0] = ยอด … rows[last] = ฐาน · hidden = [แถว,ช่อง] */
    let hidden;
    if(l===0) hidden=[[0,0],[1,0],[1,1]];
    else if(l===1) hidden=[[0,0],[1,0],[1,1],[2,0],[2,1],[2,2]];
    else hidden=[[0,0],[1,1],[2,0]];
    return {rows, hidden};
  }
}
function gPyramid(l, st, tok){
  const rounds=3; let r=0;
  function round(){
    const {rows, hidden} = makePyramid(l);
    const isHidden = (i,j) => hidden.some(h=>h[0]===i&&h[1]===j);
    st.innerHTML = head(l===2?'เติมเลขให้ครบ ช่องบน = 2 ช่องล่างบวกกัน (บางช่องต้องลบนะ)':'เติมเลขให้ครบ ช่องบน = 2 ช่องล่างบวกกัน',
        '<span class="chip">พีระมิด '+(r+1)+' / '+rounds+'</span>')+
      '<div class="pyr">'+rows.map((row,i)=>'<div class="prow">'+row.map((v,j)=> isHidden(i,j)
        ? '<span class="cell blank" data-a="'+v+'" tabindex="0"></span>' : '<span class="cell">'+v+'</span>').join('')+'</div>').join('')+'</div>'+
      '<div class="numpad">'+Array.from({length:21},(_,n)=>'<button class="num" type="button" data-n="'+n+'">'+n+'</button>').join('')+'</div>'+
      '<div class="msg" id="msg">แตะช่องว่างแล้วแตะตัวเลข หรือลากตัวเลขไปวาง</div>';
    let left = hidden.length, sel=null, foc=null;
    const cells = st.querySelectorAll('.cell.blank'), nums = st.querySelectorAll('.num');
    async function put(cell, n){
      if(!cell || cell.classList.contains('good')) return;
      if(+cell.dataset.a===n){
        cell.textContent=n; cell.classList.add('good'); cell.classList.remove('focus'); good(); foc=null; left--;
        if(left===0){ await sleep(900); if(!alive(tok)) return; if(++r===rounds) win(starsByMistakes(CUR.mistakes)); else round(); }
      }else{ cell.textContent=n; bad(cell); setTimeout(()=>{ if(!cell.classList.contains('good')) cell.textContent=''; },650); }
    }
    cells.forEach(c => c.onclick = () => {
      if(c.classList.contains('good')) return;
      if(sel){ const n=+sel.dataset.n; sel.classList.remove('sel'); sel=null; put(c,n); return; }
      cells.forEach(x=>x.classList.remove('focus')); foc=c; c.classList.add('focus');
    });
    /* ลากตัวเลข หรือแตะเลือก */
    nums.forEach(b => {
      let sx=0, sy=0, moved=false, ghost=null, hot=null;
      let down=false;
      b.onpointerdown = e => { e.preventDefault(); sx=e.clientX; sy=e.clientY; moved=false; down=true; try{ b.setPointerCapture(e.pointerId); }catch(err){} };
      b.onpointermove = e => {
        if(!down) return;
        if(!moved && Math.hypot(e.clientX-sx,e.clientY-sy)>8){ moved=true; ghost=b.cloneNode(true); ghost.classList.add('ghost'); document.body.appendChild(ghost); }
        if(moved){ ghost.style.transform='translate('+e.clientX+'px,'+e.clientY+'px) translate(-50%,-50%)';
          const el=document.elementFromPoint(e.clientX,e.clientY), c=el&&el.closest('.cell.blank');
          if(hot&&hot!==c) hot.classList.remove('hot'); if(c) c.classList.add('hot'); hot=c; }
      };
      b.onpointerup = e => {
        if(!down) return; down=false;
        if(ghost){ ghost.remove(); ghost=null; }
        if(hot){ hot.classList.remove('hot'); }
        if(moved){ if(hot) put(hot,+b.dataset.n); hot=null; return; }
        sfx.tap();
        if(foc){ put(foc,+b.dataset.n); return; }
        if(sel===b){ b.classList.remove('sel'); sel=null; return; }
        if(sel) sel.classList.remove('sel'); sel=b; b.classList.add('sel');
      };
      b.onpointercancel = () => { down=false; if(ghost){ ghost.remove(); ghost=null; } if(hot) hot.classList.remove('hot'); hot=null; };
    });
  }
  round();
}

const DIRS = { '⬆️':[-1,0], '⬇️':[1,0], '⬅️':[0,-1], '➡️':[0,1] };
function makeMap(l){
  const n=[4,5,6][l], trees=[0,5,9][l], minLen=[3,5,7][l];
  for(let t=0;t<2000;t++){
    const grid = Array.from({length:n},()=>Array(n).fill(0));
    const dog=[rnd(n),rnd(n)], bone=[rnd(n),rnd(n)];
    if(dog[0]===bone[0]&&dog[1]===bone[1]) continue;
    let placed=0; while(placed<trees){ const r=rnd(n), c=rnd(n); if(grid[r][c]||(r===dog[0]&&c===dog[1])||(r===bone[0]&&c===bone[1])) continue; grid[r][c]=1; placed++; }
    /* หาทางสั้นที่สุดด้วย BFS */
    const dist = Array.from({length:n},()=>Array(n).fill(-1)); dist[dog[0]][dog[1]]=0; const q=[dog];
    while(q.length){ const [r,c]=q.shift(); for(const d of Object.values(DIRS)){ const rr=r+d[0], cc=c+d[1];
      if(rr<0||cc<0||rr>=n||cc>=n||grid[rr][cc]||dist[rr][cc]>=0) continue; dist[rr][cc]=dist[r][c]+1; q.push([rr,cc]); } }
    const best = dist[bone[0]][bone[1]];
    if(best<minLen || best>minLen+3) continue;
    return {n, grid, dog, bone, best};
  }
}
function gDog(l, st, tok){

      '<div class="board" id="board" style="grid-template-columns:repeat('+m.n+','+size+'px)">'+

          (v?'🌳':(i===m.bone[0]&&j===m.bone[1]?'🦴':''))+'</div>').join('')).join('')+'</div>'+
      '<div class="prog" id="prog"></div>'+

}

function sdkOk(g,n,bw,bh,r,c,v){
  for(let i=0;i<n;i++){ if(g[r][i]===v||g[i][c]===v) return false; }
  const r0=r-r%bh, c0=c-c%bw;
  for(let i=r0;i<r0+bh;i++) for(let j=c0;j<c0+bw;j++) if(g[i][j]===v) return false;
  return true;
}
function sdkCount(g,n,bw,bh,limit){
  for(let r=0;r<n;r++) for(let c=0;c<n;c++) if(!g[r][c]){
    let cnt=0;
    for(let v=1;v<=n;v++) if(sdkOk(g,n,bw,bh,r,c,v)){ g[r][c]=v; cnt+=sdkCount(g,n,bw,bh,limit-cnt); g[r][c]=0; if(cnt>=limit) return cnt; }
    return cnt;
  }
  return 1;
}
function sdkFill(g,n,bw,bh){
  for(let r=0;r<n;r++) for(let c=0;c<n;c++) if(!g[r][c]){
    for(const v of shuffle(Array.from({length:n},(_,i)=>i+1))) if(sdkOk(g,n,bw,bh,r,c,v)){ g[r][c]=v; if(sdkFill(g,n,bw,bh)) return true; g[r][c]=0; }
    return false;
  }
  return true;
}
function makeSudoku(l){
  const n=l<2?4:6, bw=l<2?2:3, bh=2, want=[6,10,18][l];
  const sol=Array.from({length:n},()=>Array(n).fill(0)); sdkFill(sol,n,bw,bh);
  const puz=sol.map(r=>r.slice()); let removed=0;
  for(const k of shuffle(Array.from({length:n*n},(_,i)=>i))){
    if(removed>=want) break;
    const r=Math.floor(k/n), c=k%n, keep=puz[r][c]; puz[r][c]=0;
    if(sdkCount(puz.map(x=>x.slice()),n,bw,bh,2)===1) removed++; else puz[r][c]=keep;
  }
  return {n,bw,bh,sol,puz};
}
const SDK_EMO=['🍎','🍌','🍇','🍓','🍉','🍊'];

function makeBalance(l){
  const [Y,X,Z]=shuffle(['🍒','🍓','🍎','🍋','🥝','🍐']).slice(0,1).concat(shuffle(['🍌','🥕','🍆','🌽']).slice(0,1), shuffle(['🍉','🍍','🎃','🥥']).slice(0,1));
  const rep_=(e,k)=>Array(k).fill(e);
  const two=()=>2+rnd(2);
  if(l===0){
    const a=two(), k=two();
    return rnd(2)
      ? {known:[[[X],rep_(Y,a)]], ask:[rep_(X,k),Y], ans:a*k}
      : {known:[[[X],rep_(Y,a)]], ask:[rep_(Y,a*k),X], ans:k};
  }
  if(l===1){
    const a=two(), b=two();
    return rnd(2)
      ? {known:[[[X],rep_(Y,a)],[[Z],rep_(X,b)]], ask:[[Z],Y], ans:a*b}
      : {known:[[[X],rep_(Y,a)]], ask:[[X,Y],Y], ans:a+1};
  }
  const v=rnd(3);
  if(v===0){ const n=1+rnd(2), d=two(); return {known:[[[X].concat(rep_(Y,n)),rep_(Y,n+d)]], ask:[[X,X],Y], ans:2*d}; }
  if(v===1){ const a=two(), b=1+rnd(3); return {known:[[[X],rep_(Y,a)],[[Z],[X].concat(rep_(Y,b))]], ask:[[Z],Y], ans:a+b}; }
  const c=[4,6][rnd(2)]; return {known:[[[X,X],[Z]],[[Z],rep_(Y,c)]], ask:[[X],Y], ans:c/2};
}
function gBalance(l, st, tok){

   11) รถติด! พารถแดงออก
   ============================================================ */
const RH_N=6, RH_ROW=2;
function rhSolve(cars, limit=40000){
  const key=pos=>pos.join(',');
  const start=cars.map(c=>c.d==='h'?c.c:c.r), seen=new Map([[key(start),0]]); let q=[start], depth=0;
  while(q.length){
    const nq=[];
    for(const pos of q){
      if(pos[0]+cars[0].len===RH_N) return depth;
      const occ=Array(RH_N*RH_N).fill(-1);
      cars.forEach((c,i)=>{ for(let k=0;k<c.len;k++){ const r=c.d==='h'?c.r:pos[i]+k, cc=c.d==='h'?pos[i]+k:c.c; occ[r*RH_N+cc]=i; } });
      cars.forEach((c,i)=>{
        for(const dir of [-1,1]){
          let p=pos[i];
          while(true){
            const np=p+dir, lead=dir<0?np:np+c.len-1;
            if(lead<0||lead>=RH_N) break;
            const cell=c.d==='h'?c.r*RH_N+lead:lead*RH_N+c.c;
            if(occ[cell]!==-1) break;
            p=np; const npos=pos.slice(); npos[i]=p; const k=key(npos);
            if(!seen.has(k)){ seen.set(k,depth+1); nq.push(npos); if(seen.size>limit) return -1; }
          }
        }
      });
    }
    q=nq; depth++;
  }
  return -1;
}
function rhFits(cars,cand){
  const occ=new Set();
  for(const c of cars) for(let k=0;k<c.len;k++) occ.add(c.d==='h'?c.r*RH_N+c.c+k:(c.r+k)*RH_N+c.c);
  for(let k=0;k<cand.len;k++){ const cell=cand.d==='h'?cand.r*RH_N+cand.c+k:(cand.r+k)*RH_N+cand.c; if(occ.has(cell)) return false; }
  return true;
}
function rhRandCar(){
  const len=rnd(4)===0?3:2, d=rnd(2)?'h':'v';
  if(d==='h'){ let r=rnd(RH_N); if(r===RH_ROW) r=(r+1+rnd(RH_N-1))%RH_N; return {r,c:rnd(RH_N-len+1),len,d}; }
  return {r:rnd(RH_N-len+1),c:rnd(RH_N),len,d};
}
function makeTraffic(l){
  const [lo,hi]=[[3,5],[6,9],[10,15]][l], t0=Date.now();
  let best=null, bestM=-1;
  while(Date.now()-t0<2500){
    let cars=[{r:RH_ROW,c:rnd(2),len:2,d:'h'}];
    const count=[5,8,9][l]+rnd(3);
    for(let tries=0; cars.length<count && tries<80; tries++){ const cand=rhRandCar(); if(rhFits(cars,cand)) cars.push(cand); }
    let m=rhSolve(cars);
    for(let it=0; it<[20,60,120][l] && m>=0 && m<lo && Date.now()-t0<2500; it++){
      const trial=cars.map(c=>({...c}));
      const cap=[8,11,12][l];   /* ไม่ให้ลานแน่นเกินไปจนดูยาก */
      if(trial.length>2 && (trial.length>=cap || rnd(2))) trial.splice(1+rnd(trial.length-1),1);
      if(trial.length<cap) for(let tries=0;tries<20;tries++){ const cand=rhRandCar(); if(rhFits(trial,cand)){ trial.push(cand); break; } }
      const tm=rhSolve(trial); if(tm>=m){ cars=trial; m=tm; }
    }
    if(m>=lo && m<=hi) return {cars,m};
    if(m>=0 && Math.abs(m-(lo+hi)/2)<Math.abs(bestM-(lo+hi)/2)){ best=cars; bestM=m; }
  }
  return {cars:best,m:bestM};
}
const CAR_EMO=['🚙','🚕','🚓','🚑','🚜','🚌','🚚','🚐'], CAR_BG=['#D6EBFF','#FFF0B3','#D5F3DF','#E6DBFF','#FFE2C7','#FFD6E5'];
function gTraffic(l, st, tok){
  const rounds=2; let r=0;
  function round(){
    st.innerHTML=head('กำลังสร้างลานจอดรถ… 🚧');
    setTimeout(()=>{ if(!alive(tok)) return; build(makeTraffic(l)); },30);
  }
  function build({cars,m}){
    const size=Math.min(62, Math.floor((Math.min(window.innerWidth,860)-90)/RH_N)), W=size*RH_N;
    let moves=0;
    st.innerHTML=head('ลากรถคันอื่นหลบ แล้วพา 🚗 รถแดงออกประตูขวา','<span class="chip">ลาน '+(r+1)+' / '+rounds+'</span><span class="chip" id="rm">ขยับ 0 ครั้ง</span><span class="chip">ทำได้ใน '+m+' ครั้ง</span>')+
      '<div class="lot" id="lot" style="width:'+W+'px;height:'+W+'px"><div class="gridbg" style="grid-template-columns:repeat('+RH_N+',1fr)">'+'<span></span>'.repeat(RH_N*RH_N)+'</div>'+
      '<div class="exit" style="top:'+(RH_ROW*size)+'px;height:'+size+'px">➡️</div></div>'+
      '<div class="msg" id="msg">ลากรถไปข้างหน้าหรือถอยหลังตามแนวของรถ</div>';
    const lot=$('#lot');
    const els=cars.map((c,i)=>{
      const d=document.createElement('div'); d.className='car'+(i===0?' red':'');
      d.style.width=(c.d==='h'?c.len*size:size)-6+'px'; d.style.height=(c.d==='v'?c.len*size:size)-6+'px';
      d.style.left=c.c*size+3+'px'; d.style.top=c.r*size+3+'px';
      if(i>0) d.style.background=CAR_BG[i%CAR_BG.length];
      d.textContent=i===0?'🚗':(c.len===3?'🚚':CAR_EMO[i%CAR_EMO.length]);
      lot.appendChild(d); return d;
    });
    const occupied=(skip)=>{ const s=new Set(); cars.forEach((c,i)=>{ if(i===skip) return; for(let k=0;k<c.len;k++) s.add(c.d==='h'?c.r*RH_N+c.c+k:(c.r+k)*RH_N+c.c); }); return s; };
    els.forEach((el,i)=>{
      let start=null, min=0, max=0, base=0;
      el.onpointerdown=e=>{
        e.preventDefault(); try{ el.setPointerCapture(e.pointerId); }catch(err){} el.classList.add('drag');
        const c=cars[i], occ=occupied(i); base=c.d==='h'?c.c:c.r; min=base; max=base;
        while(min-1>=0 && !occ.has(c.d==='h'?c.r*RH_N+min-1:(min-1)*RH_N+c.c)) min--;
        while(max+c.len<RH_N && !occ.has(c.d==='h'?c.r*RH_N+max+c.len:(max+c.len)*RH_N+c.c)) max++;
        start=c.d==='h'?e.clientX:e.clientY;
      };
      el.onpointermove=e=>{
        if(start===null) return; const c=cars[i];
        const delta=((c.d==='h'?e.clientX:e.clientY)-start)/size;
        const p=Math.max(min,Math.min(max,base+delta));
        if(c.d==='h') el.style.left=p*size+3+'px'; else el.style.top=p*size+3+'px';
      };
      el.onpointerup=el.onpointercancel=async e=>{
        if(start===null) return; const c=cars[i];
        const delta=((c.d==='h'?e.clientX:e.clientY)-start)/size;
        const p=Math.max(min,Math.min(max,Math.round(base+delta)));
        start=null; el.classList.remove('drag');
        if(c.d==='h'){ c.c=p; el.style.left=p*size+3+'px'; } else { c.r=p; el.style.top=p*size+3+'px'; }
        if(p!==base){ moves++; $('#rm').textContent='ขยับ '+moves+' ครั้ง'; sfx.tap(); }
        if(i===0 && c.c+c.len===RH_N){
          el.style.left=(RH_N+1)*size+'px'; good(); await sleep(1000); if(!alive(tok)) return;
          CUR.mistakes+=Math.max(0,Math.floor((moves-m)/3));
          if(++r===rounds) win(starsByMistakes(CUR.mistakes)); else round();
        }
      };
    });
  }
  round();
}

/* ============================================================
   12) นักสืบหาบ้านสัตว์
   ============================================================ */
const DET_A=[['🐶','หมา'],['🐱','แมว'],['🐰','กระต่าย'],['🐸','กบ']];
const DET_H=[['#F08080','แดง'],['#6FB8F5','ฟ้า'],['#6FD08C','เขียว'],['#F2C94C','เหลือง']];
function perms(n){ if(n===1) return [[0]]; const out=[]; perms(n-1).forEach(p=>{ for(let i=0;i<=p.length;i++){ const q=p.slice(); q.splice(i,0,n-1); out.push(q); } }); return out; }
function makeDetective(l){
  const N=l<2?3:4, A=shuffle(DET_A).slice(0,N), H=shuffle(DET_H).slice(0,N), all=perms(N);
  const nm=i=>A[i][0]+A[i][1], hn=j=>'บ้านสี'+H[j][1];
  for(let tries=0;tries<300;tries++){
    const sol=pick(all);                       /* sol[สัตว์] = ตำแหน่งบ้าน (0 = ซ้ายสุด) */
    const cand=[];
    for(let a=0;a<N;a++){
      for(let h=0;h<N;h++){
        if(l===0) cand.push({t:nm(a)+' อยู่'+hn(h), f:p=>p[a]===h, ok:sol[a]===h, w:'direct'});
        cand.push({t:nm(a)+' ไม่ได้อยู่'+hn(h), f:p=>p[a]!==h, ok:sol[a]!==h});
      }
      cand.push({t:nm(a)+' อยู่บ้านซ้ายสุด', f:p=>p[a]===0, ok:sol[a]===0});
      cand.push({t:nm(a)+' อยู่บ้านขวาสุด', f:p=>p[a]===N-1, ok:sol[a]===N-1});
      if(l>0) for(let b=0;b<N;b++) if(a!==b){
        cand.push({t:nm(a)+' อยู่ติดกับ'+nm(b), f:p=>Math.abs(p[a]-p[b])===1, ok:Math.abs(sol[a]-sol[b])===1});
        cand.push({t:nm(a)+' อยู่ทางซ้ายของ'+nm(b), f:p=>p[a]<p[b], ok:sol[a]<sol[b]});
        if(l===2){ cand.push({t:nm(a)+' ไม่ได้อยู่ติดกับ'+nm(b), f:p=>Math.abs(p[a]-p[b])!==1, ok:Math.abs(sol[a]-sol[b])!==1});
                   cand.push({t:nm(a)+' อยู่ถัดจาก'+nm(b)+'ไปทางขวา 1 หลัง', f:p=>p[a]===p[b]+1, ok:sol[a]===sol[b]+1}); }
      }
    }
    let pool=shuffle(cand.filter(c=>c.ok)), clues=[], direct=0;
    const count=cs=>all.filter(p=>cs.every(c=>c.f(p))).length;
    for(const c of pool){ if(c.w==='direct'){ if(direct) continue; direct++; } clues.push(c); if(count(clues)===1) break; }
    if(count(clues)!==1) continue;
    for(let i=clues.length-1;i>=0;i--){ const t=clues.slice(0,i).concat(clues.slice(i+1)); if(count(t)===1) clues=t; }
    if(clues.length<=[3,4,6][l] && clues.length>=[2,3,4][l]) return {N,A,H,sol,clues:shuffle(clues)};
  }
}
function gDetective(l, st, tok){
  const rounds=2; let r=0;
  function round(){
    const D=makeDetective(l), N=D.N; let place=Array(N).fill(-1), sel=null;   /* place[บ้าน] = สัตว์ */
    st.innerHTML=head('อ่านเบาะแส แล้วพาสัตว์ไปอยู่บ้านที่ถูกต้อง','<span class="chip">คดี '+(r+1)+' / '+rounds+'</span>')+
      '<ul class="clues">'+D.clues.map((c,i)=>'<li data-i="'+i+'"><span class="cn">'+(i+1)+'</span><span style="flex:1">'+c.t+'</span></li>').join('')+'</ul>'+
      '<div class="houses" style="grid-template-columns:repeat('+N+',1fr)">'+D.H.map((h,j)=>
        '<div class="house" data-j="'+j+'"><div class="roof" style="background:'+h[0]+'">🏠 บ้านสี'+h[1]+'</div><div class="spot"></div>'+
        '<div class="pos">'+(j===0?'ซ้ายสุด':j===N-1?'ขวาสุด':'หลังที่ '+(j+1))+'</div></div>').join('')+'</div>'+
      '<div class="tray2" id="tray2"></div>'+
      '<button class="bigbtn" id="check" type="button">🔍 ตรวจคำตอบ</button><div class="msg" id="msg">แตะสัตว์ แล้วแตะบ้านที่คิดว่าใช่</div>';
    st.querySelectorAll('.clues li').forEach(li=>li.onclick=()=>speak(D.clues[+li.dataset.i].t.replace(/[^฀-๿\s0-9]/gu,'')));
    function draw(){
      st.querySelectorAll('.house').forEach(h=>{ const a=place[+h.dataset.j]; h.querySelector('.spot').textContent=a>=0?D.A[a][0]:''; });
      $('#tray2').innerHTML=D.A.map((a,i)=>place.includes(i)?'':'<button type="button" data-a="'+i+'" class="'+(sel===i?'sel':'')+'">'+a[0]+'</button>').join('');
      st.querySelectorAll('#tray2 button').forEach(b=>b.onclick=()=>{ sfx.tap(); const a=+b.dataset.a; sel=sel===a?null:a; draw(); });
    }
    st.querySelectorAll('.house').forEach(h=>h.onclick=()=>{
      const j=+h.dataset.j;
      if(sel!==null){ if(place[j]>=0){} place[j]=sel; sel=null; sfx.tap(); }
      else if(place[j]>=0){ place[j]=-1; }
      st.querySelectorAll('.clues li').forEach(li=>li.classList.remove('bad')); draw();
    });
    $('#check').onclick=async()=>{
      if(place.includes(-1)){ setMsg('พาสัตว์ไปอยู่บ้านให้ครบทุกตัวก่อนนะ','no'); return; }
      const p=Array(N); place.forEach((a,j)=>p[a]=j);
      const wrong=D.clues.map((c,i)=>c.f(p)?-1:i).filter(i=>i>=0);
      st.querySelectorAll('.clues li').forEach(li=>li.classList.toggle('bad', wrong.includes(+li.dataset.i)));
      if(!wrong.length){ good(); setMsg('✓ ไขคดีสำเร็จ! นักสืบเก่งมาก 🕵️','ok'); await sleep(1300); if(!alive(tok)) return;
        if(++r===rounds) win(starsByMistakes(CUR.mistakes)); else round(); }
      else { bad(); setMsg('ยังไม่ตรงกับเบาะแสข้อ '+wrong.map(i=>i+1).join(', ')+' ลองสลับบ้านดูนะ 💪','no'); }
    };
    draw();
  }
  round();
}

const RUN = { memory:gMemory, simon:gSimon, odd:gOdd, pattern:gPattern, pyramid:gPyramid, dog:gDog,
  sudoku:gSudoku, balance:gBalance, hanoi:gHanoi, slide:gSlide, traffic:gTraffic, detective:gDetective };

/* ---------------- เปิดหน้า: #เกม-ระดับ ---------------- */
function route(){
  const m = location.hash.match(/^#([a-z]+)(?:-(\d))?$/);
  if(m && RUN[m[1]]) go(m[1], m[2]?+m[2]:0, false); else menu();
}
window.addEventListener('popstate', route);
route();
