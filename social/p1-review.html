<!doctype html><html lang="th"><head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<link rel="apple-touch-icon" href="../apple-touch-icon.png">
<link rel="icon" type="image/png" href="../favicon.png">
<title>ทบทวนก่อนสอบ ป.1 · สังคมศึกษา</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Sarabun:wght@400;600;700&family=Mali:wght@600;700&family=Noto+Sans+Thai+Looped:wght@400;600;700&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
:root{--ink:#2B2430;--mute:#8A7F8C;--paper:#FAF5EF;--line:#E6DDD3;
      --ok:#2E7D32;--okbg:#E6F3E8;--no:#C62828;--nobg:#FCEAEA;--ac:#C2185B;--tn:#FCE7EF;--bd:#F8BBD0}
html,body{margin:0;padding:0}
body{background:var(--paper);color:var(--ink);font-family:'Sarabun',sans-serif;font-size:19.1px;
     line-height:1.65;padding-bottom:40px}
body::before{content:'';position:fixed;inset:0;pointer-events:none;z-index:0;opacity:.5;
  background-image:radial-gradient(circle at 1px 1px,#e2d8cd 1px,transparent 0);background-size:22px 22px}
.wrap{max-width:760px;margin:0 auto;padding:0 16px;position:relative;z-index:1}
h1,h2,h3,.mali{font-family:'Mali',cursive;font-weight:700}

/* ---------- topbar ---------- */
.top{position:sticky;top:0;z-index:20;background:rgba(250,245,239,.94);backdrop-filter:blur(6px);
     border-bottom:2px solid var(--line)}
.top .in{max-width:760px;margin:0 auto;padding:9px 16px;display:flex;align-items:center;gap:10px}
.back{border:2px solid var(--ink);background:#fff;border-radius:12px;padding:4px 12px;font:inherit;
      font-weight:600;cursor:pointer;box-shadow:2px 2px 0 var(--ink)}
.back:active{transform:translate(2px,2px);box-shadow:none}
.top .tt{font-family:'Mali',cursive;font-weight:700;font-size:19.1px;flex:1;overflow:hidden;
         text-overflow:ellipsis;white-space:nowrap}
.pill{background:var(--ac);color:#fff;border-radius:99px;padding:3px 12px;font-size:15.8px;font-weight:600;white-space:nowrap}

/* ---------- home ---------- */
.hero{text-align:center;padding:26px 0 16px}
.hero h1{font-size:30.4px;margin:0;line-height:1.35}
.hero p{margin:6px 0 0;color:var(--mute);font-size:16.9px}
.rain{height:7px;border-radius:99px;margin:14px 0 20px;
      background:linear-gradient(90deg,#C2185B 0 20%,#1565C0 20% 40%,#2E7D32 40% 60%,#E65100 60% 80%,#5E35B1 80%)}
.subs{display:grid;gap:13px}
.sub{display:flex;align-items:center;gap:13px;background:#fff;border:2.5px solid var(--ink);
     border-radius:18px;padding:13px 15px;cursor:pointer;box-shadow:4px 4px 0 var(--ink);
     transition:transform .09s}
.sub:active{transform:translate(4px,4px);box-shadow:none}
.ic{width:46px;height:46px;border-radius:14px;display:grid;place-items:center;font-size:25.9px;
    font-family:'Mali',cursive;font-weight:700;color:#fff;flex:none;transform:rotate(-4deg)}
.sub .nm{flex:1}
.sub .nm b{font-family:'Mali',cursive;font-size:20.2px;display:block}
.sub .nm i{font-style:normal;color:var(--mute);font-size:15.2px}
.bar{height:8px;background:var(--line);border-radius:99px;overflow:hidden;margin-top:6px;max-width:190px}
.bar>i{display:block;height:100%;border-radius:99px;transition:width .4s}
.arw{font-size:24.8px;color:var(--mute)}

/* ---------- set list ---------- */
.sets{display:grid;gap:11px;margin-top:16px}
.set{display:flex;align-items:center;gap:12px;background:#fff;border:2.5px solid var(--ink);
     border-radius:16px;padding:11px 14px;cursor:pointer;box-shadow:3px 3px 0 var(--ink)}
.set:active{transform:translate(3px,3px);box-shadow:none}
.setn{width:34px;height:34px;border-radius:11px;background:var(--tn);border:2px solid var(--ac);
      display:grid;place-items:center;font-family:'Mali',cursive;font-weight:700;color:var(--ac);flex:none}
.set .t{flex:1}
.set .t b{display:block;font-size:18px}
.set .t i{font-style:normal;font-size:14.6px;color:var(--mute)}
.score{font-size:15.8px;font-weight:700;color:var(--ok);background:var(--okbg);border-radius:99px;padding:2px 10px}

/* ---------- exercise ---------- */
.ttl{margin:18px 0 4px}
.ttl h2{margin:0;font-size:25.9px;color:var(--ac);line-height:1.3}
.ttl p{margin:2px 0 0;color:var(--mute);font-size:15.8px}
.blk{margin-bottom:20px}
.instr{font-weight:700;font-size:19.1px;margin:22px 0 10px;padding-left:11px;border-left:5px solid var(--ac)}
.box{background:var(--tn);border:2px dashed var(--ac);border-radius:16px;padding:11px 15px;margin:14px 0}
.box .bt{font-family:'Mali',cursive;color:var(--ac);font-size:18px;margin-bottom:2px}
.box .bb{white-space:pre-wrap;font-size:17.5px;line-height:1.65}
.bank{display:flex;flex-wrap:wrap;gap:7px;margin:10px 0}
.bank span{border:2px solid var(--bd);background:#fff;border-radius:99px;padding:3px 14px}

.item{background:#fff;border:2px solid var(--line);border-radius:15px;padding:11px 14px;margin-bottom:10px}
.item.ok{border-color:var(--ok);background:var(--okbg)}
.item.no{border-color:var(--no);background:var(--nobg)}
.qt{font-weight:600;margin-bottom:7px;display:flex;gap:7px;align-items:flex-start}
.qt .n{color:var(--ac);flex:none}
.opt{display:block;width:100%;text-align:left;font:inherit;background:#fff;border:2px solid var(--line);
     border-radius:12px;padding:8px 13px;margin-top:6px;cursor:pointer}
.opt:hover{border-color:var(--ac)}
.opt.sel{border-color:var(--ac);background:var(--tn)}
.opt.good{border-color:var(--ok);background:var(--okbg);font-weight:700}
.opt.bad{border-color:var(--no);background:var(--nobg)}
.opt i{font-style:normal;color:var(--mute);margin-right:8px;font-weight:700}
.tfb{display:flex;gap:9px;margin-top:5px}
.tfb button{flex:1;font:inherit;font-weight:700;background:#fff;border:2px solid var(--line);
            border-radius:12px;padding:8px;cursor:pointer}
.tfb button.good{border-color:var(--ok);background:var(--okbg)}
.tfb button.bad{border-color:var(--no);background:var(--nobg)}
.tfb button.sel{border-color:var(--ac);background:var(--tn)}

input.ans{font:inherit;font-family:'Sarabun',sans-serif;border:none;border-bottom:2.5px dotted var(--ac);
  background:transparent;width:130px;padding:1px 5px;text-align:center;outline:none}
input.ans:focus{background:var(--tn);border-radius:6px 6px 0 0}
input.ans.ok{border-bottom-color:var(--ok);color:var(--ok);font-weight:700}
input.ans.no{border-bottom-color:var(--no);color:var(--no)}
.fillrow{display:flex;flex-wrap:wrap;align-items:center;gap:4px}
.chips{display:flex;flex-wrap:wrap;gap:7px;margin:2px 0 12px}
.chips button{font:inherit;background:#fff;border:2px solid var(--bd);border-radius:99px;
              padding:3px 13px;cursor:pointer}
.chips button:active{background:var(--tn)}
.chips .hint{color:var(--mute);font-size:15.2px;width:100%;margin-bottom:-2px}

select.ans{font:inherit;border:2px solid var(--ac);border-radius:10px;padding:4px 7px;background:#fff}
select.ans.ok{border-color:var(--ok);background:var(--okbg)}
select.ans.no{border-color:var(--no);background:var(--nobg)}
.mrow{display:flex;align-items:center;gap:9px;margin-bottom:8px}
.mrow span{flex:1}
.rlist{border:2px solid var(--bd);border-radius:14px;background:#fff;padding:9px 13px;margin-bottom:12px}
.rlist div{padding:2px 0}
.rlist b{color:var(--ac);margin-right:7px}

.calcgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(148px,1fr));gap:9px}
.calcgrid .item{margin:0;display:flex;align-items:center;gap:6px;padding:9px 11px}
.calcgrid .item b{font-size:19.1px}
.calcgrid input.ans{width:52px}

.cntrow{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.cntrow .sy{font-size:23.6px;letter-spacing:3px;flex:1;min-width:150px;line-height:1.45}
.pic{border:2px solid var(--bd);border-radius:16px;overflow:hidden;margin:10px 0;background:#fff}
.pic .pt{background:var(--tn);padding:6px 13px;font-weight:700;border-bottom:2px solid var(--bd)}
.pic .pr{display:flex;gap:10px;padding:7px 13px;border-bottom:1px dashed var(--line);align-items:center}
.pic .pr b{width:74px;flex:none}
.pic .pr span{font-size:22.5px;letter-spacing:3px;line-height:1.4}

.ordrow{display:flex;flex-wrap:wrap;gap:7px;margin-bottom:7px}
.ordrow button{font:inherit;background:#fff;border:2px solid var(--bd);border-radius:11px;
               padding:4px 13px;cursor:pointer}
.ordrow button.used{opacity:.3;pointer-events:none}
.slotline{min-height:40px;border:2px dashed var(--ac);border-radius:12px;background:var(--tn);
          padding:6px 11px;display:flex;flex-wrap:wrap;gap:7px;align-items:center}
.slotline.ok{border-color:var(--ok);background:var(--okbg)}
.slotline.no{border-color:var(--no);background:var(--nobg)}
.slotline em{font-style:normal;color:var(--mute)}
.mini{font:inherit;font-size:15.8px;border:2px solid var(--line);background:#fff;border-radius:10px;
      padding:2px 11px;cursor:pointer;margin-top:6px}
textarea.free{width:100%;font:inherit;border:2px dashed var(--line);border-radius:12px;padding:8px 11px;
              background:#fff;min-height:52px;resize:vertical}

.fb{font-size:16.3px;margin-top:6px;font-weight:700}
.fb.ok{color:var(--ok)} .fb.no{color:var(--no)}

.result{background:#fff;border:3px solid var(--ink);border-radius:20px;padding:20px;text-align:center;
        box-shadow:5px 5px 0 var(--ink);margin:26px 0}
.result h3{margin:0 0 4px;font-size:24.8px}
.result .big{font-family:'Mali',cursive;font-size:45px;color:var(--ac);line-height:1.1}
.result p{color:var(--mute);margin:6px 0 14px}
.btn{font:inherit;font-weight:700;border:2.5px solid var(--ink);background:var(--ac);color:#fff;
     border-radius:14px;padding:9px 22px;cursor:pointer;box-shadow:3px 3px 0 var(--ink);margin:0 5px}
.btn.gh{background:#fff;color:var(--ink)}
.btn:active{transform:translate(3px,3px);box-shadow:none}
.hide{display:none}
@media(max-width:480px){body{font-size:18px}.hero h1{font-size:25.9px}.ttl h2{font-size:22.5px}}
.top{padding-top:env(safe-area-inset-top)}
a.back{text-decoration:none;color:inherit;display:inline-block}

/* ---------- ลากวาง + เสียงอ่าน ---------- */
.spk{flex:none;margin-left:auto;border:2px solid var(--line);background:#fff;border-radius:10px;width:36px;height:34px;
  font-size:16px;cursor:pointer;line-height:1;padding:0}
.spk:active{background:var(--tn)}
.qt>span:not(.n){flex:1}
.instr{display:flex;align-items:center;gap:8px}
.box .bt{display:flex;align-items:center;gap:8px}
.tray{position:sticky;top:var(--toph,52px);z-index:10;display:flex;flex-wrap:wrap;gap:8px;align-items:center;
  background:rgba(255,255,255,.97);border:2px solid var(--bd);border-radius:14px;padding:8px 10px;margin:4px 0 12px;
  box-shadow:0 4px 10px rgba(0,0,0,.07)}
.tray .hint,.numpad .hint{width:100%;font-size:14px;color:var(--mute);line-height:1.3}
.tile{display:inline-block;background:#fff;border:2px solid var(--ac);border-radius:11px;padding:3px 13px;font-weight:700;
  cursor:grab;-webkit-user-select:none;user-select:none;touch-action:none;min-width:42px;text-align:center;transition:transform .1s}
.tile.sel{background:var(--ac);color:#fff;transform:scale(1.08)}
.tile.used{display:none}
.tile.ghost{position:fixed;left:0;top:0;z-index:99;pointer-events:none;opacity:.93;box-shadow:0 8px 18px rgba(0,0,0,.25);transition:none}
.slot{display:inline-flex;align-items:center;justify-content:center;min-width:92px;min-height:38px;padding:1px 10px;
  border:2.5px dashed var(--ac);border-radius:11px;background:var(--tn);vertical-align:middle;cursor:pointer;font-weight:700}
.slot.hot,.slot.focus{background:#FFE9A8;border-style:solid}
.slot.ok{border:2.5px solid var(--ok);background:#fff;color:var(--ok);cursor:default}
.slot.no{border:2.5px solid var(--no);background:#fff;color:var(--no);cursor:default}
.mrow .slot{min-width:150px}
.calcgrid .slot{min-width:54px}
.slot.sm{min-width:48px;padding:1px 4px}
.calcgrid .item{flex-wrap:wrap}
.cans{font-size:15px;color:var(--ok);font-weight:700}
.numpad{max-width:760px;margin:0 auto;padding:0 12px 8px;display:flex;flex-wrap:wrap;gap:5px;justify-content:center}
.numpad .hint{text-align:center}
.numpad .tile{min-width:38px;padding:1px 6px;font-size:17px}
.shake{animation:shk .3s}
@keyframes shk{25%{transform:translateX(-4px)}75%{transform:translateX(4px)}}
@media(max-width:480px){.slot{min-width:72px}.mrow .slot{min-width:120px}.numpad .tile{min-width:33px;font-size:16px}}

/* ================= ธีมเด็ก: กล่องลอย สีพาสเทล สบายตา ================= */
:root{--ok:#2F9E5B;--okbg:#EAF8EF;--no:#D2693C;--nobg:#FFF3EC;--ink:#3A3350;--mute:#8C849E;--paper:#FFFBF4}
body{background:var(--paper);font-family:'Noto Sans Thai Looped','Sarabun',sans-serif;color:var(--ink)}
body::before{display:none}
/* ฉากลอยด้านหลัง */
.deco{position:fixed;inset:0;z-index:0;pointer-events:none;overflow:hidden}
.deco i{position:absolute;border-radius:50%;opacity:.55;animation:floaty 14s ease-in-out infinite}
.deco i:nth-child(1){width:220px;height:220px;background:#FFE3EC;left:-60px;top:12%}
.deco i:nth-child(2){width:160px;height:160px;background:#E3F1FF;right:-40px;top:30%;animation-delay:-4s}
.deco i:nth-child(3){width:260px;height:260px;background:#E6F8EE;left:-90px;top:62%;animation-delay:-8s}
.deco i:nth-child(4){width:180px;height:180px;background:#FFF1D6;right:-50px;top:78%;animation-delay:-2s}
.deco b{position:absolute;font-size:22px;opacity:.5;animation:twinkle 5s ease-in-out infinite}
.deco b:nth-of-type(1){left:8%;top:22%}.deco b:nth-of-type(2){right:10%;top:48%;animation-delay:-2s}
.deco b:nth-of-type(3){left:12%;top:74%;animation-delay:-3.5s}.deco b:nth-of-type(4){right:14%;top:12%;animation-delay:-1s}
@keyframes floaty{50%{transform:translateY(-22px) scale(1.04)}}
@keyframes twinkle{50%{transform:scale(1.25) rotate(15deg);opacity:.8}}
@keyframes bob{50%{transform:translateY(-4px)}}
@media (prefers-reduced-motion:reduce){.deco i,.deco b,.shero .sun,.float{animation:none!important}}

.top{background:rgba(255,251,244,.92);border-bottom:none;box-shadow:0 4px 18px rgba(58,51,80,.06)}
.back{border:none;background:#fff;color:var(--ac);border-radius:999px;box-shadow:0 3px 12px rgba(58,51,80,.12);font-weight:700}
.top .tt{color:var(--ink)}
.pill{background:#fff;color:var(--ac);box-shadow:0 3px 12px rgba(58,51,80,.12);font-weight:700}
.pbar{height:6px;background:transparent}
.pbar>i{display:block;height:100%;width:0;border-radius:0 99px 99px 0;transition:width .4s;
  background:linear-gradient(90deg,#FF9EC4,#FFC58A,#FFE08A,#95E08A,#8EC5FF,#C9A8FF)}

/* ---- ป้ายหัววิชา ---- */
.shero{position:relative;overflow:hidden;margin:18px 0 10px;border-radius:30px;padding:20px 22px 74px;border:none;
  background:linear-gradient(180deg,#9AD7F7,#DDF3FF);box-shadow:0 12px 30px rgba(58,51,80,.10)}
.shero svg{position:absolute;left:0;bottom:0;width:100%;height:84px}
.shero .row{position:relative;display:flex;align-items:center;gap:14px}
.shero .emo{width:76px;height:76px;border-radius:26px;background:#fff;display:grid;place-items:center;font-size:2.6rem;
  box-shadow:0 8px 18px rgba(58,51,80,.14);flex:none;animation:bob 3.5s ease-in-out infinite}
.shero h2{margin:0;font-size:31px;line-height:1.2;color:#fff;text-shadow:0 2px 8px rgba(30,80,120,.35)}
.shero p{margin:3px 0 0;color:#2D5B78;font-weight:600;font-size:15.5px}
.shero .sun{position:absolute;right:18px;top:14px;font-size:2.3rem;animation:bob 4s ease-in-out infinite}

/* ---- รายการชุด ---- */
.sets{gap:14px}
.set{border:none;border-radius:24px;background:#fff;padding:13px 16px;box-shadow:0 8px 22px rgba(58,51,80,.08);transition:transform .15s,box-shadow .15s}
.set:hover{transform:translateY(-3px);box-shadow:0 14px 28px rgba(58,51,80,.12)}
.set:active{transform:translateY(1px)}
.setn{width:54px;height:54px;border-radius:18px;background:var(--scl);border:none;font-size:1.7rem;color:var(--scd);position:relative;flex:none}
.setn b{position:absolute;right:-7px;bottom:-7px;background:var(--sc);color:#fff;border:3px solid #fff;border-radius:99px;
  min-width:26px;height:26px;font-size:13px;display:grid;place-items:center;font-family:'Mali',cursive}
.set .t b{font-family:'Mali',cursive;font-size:19px;color:var(--ink)}
.set .t i{color:var(--mute)}
.set .arw{width:34px;height:34px;border-radius:50%;background:var(--scl);color:var(--scd);display:grid;place-items:center;font-size:20px}
.score{background:#FFF6D6;color:#8A6100;border:none}

/* ---- หัวชุด ---- */
.ttl.band{display:flex;align-items:center;gap:14px;background:#fff;border:none;border-radius:26px;padding:14px 18px;margin:18px 0 8px;
  box-shadow:0 8px 22px rgba(58,51,80,.08)}
.ttl.band .emo{width:58px;height:58px;border-radius:20px;background:var(--tn);display:grid;place-items:center;font-size:2rem;flex:none}
.ttl.band h2{color:var(--ink)}

/* ---- แต่ละหมวดใช้สีพาสเทลของตัวเอง (--k กลาง / --kl อ่อน / --kd เข้ม) ---- */
.bz{--k:#8EC5FF;--kl:#EEF6FF;--kd:#2F6DB0}
.instr{background:var(--kl);color:var(--kd);border:none;border-radius:20px;padding:8px 10px 8px 8px;margin:28px 0 12px;
  font-family:'Mali',cursive;font-weight:600;box-shadow:none}
.instr .ie{width:40px;height:40px;border-radius:14px;background:#fff;display:grid;place-items:center;font-size:1.3rem;flex:none;
  box-shadow:0 3px 10px rgba(58,51,80,.08)}
.instr>span:not(.ie){flex:1}
.instr .spk{border:none;background:#fff;box-shadow:0 2px 8px rgba(58,51,80,.08)}

.box{background:#FFF9DB;border:none;border-radius:20px;padding:16px 18px 14px;margin:22px 6px;transform:rotate(-.8deg);
  box-shadow:0 10px 24px rgba(160,120,20,.12);position:relative}
.box::before{content:"";position:absolute;top:-10px;left:50%;width:90px;height:22px;margin-left:-45px;border-radius:4px;
  background:rgba(255,190,120,.55);transform:rotate(2deg)}
.box .bt{color:#9A6A00;font-size:20px}
.box .bt::before{content:"💡 "}

.item{background:#fff;border:none;border-radius:22px;padding:13px 15px;margin-bottom:14px;
  box-shadow:0 6px 18px rgba(58,51,80,.07);transition:box-shadow .2s,background .2s}
.item.ok{background:#fff;box-shadow:0 0 0 3px #BDEBCB, 0 6px 18px rgba(58,51,80,.07)}
.item.no{background:#fff;box-shadow:0 0 0 3px #FFD9C6, 0 6px 18px rgba(58,51,80,.07)}
.qt .n{width:30px;height:30px;border-radius:11px;background:var(--kl);color:var(--kd);display:grid;place-items:center;
  font-size:15px;font-weight:700;margin-top:1px;flex:none}
.spk{border:none;background:var(--kl);border-radius:12px}
.opt{border:2px solid #F0ECF5;border-radius:16px;padding:9px 12px;display:flex;align-items:center;gap:6px;font-weight:600;background:#FDFCFF}
.opt i{width:30px;height:30px;border-radius:50%;background:var(--kl);color:var(--kd);display:grid;place-items:center;margin-right:6px;flex:none}
.opt:hover{border-color:var(--k);background:#fff}
.opt.good{border-color:#9EDDB2;background:#EFFAF2}
.opt.good i{background:#5BC07D;color:#fff}
.opt.bad{border-color:#FFCBB3;background:#FFF5EF}
.opt.bad i{background:#F29B72;color:#fff}
.tfb button{border:2px solid #F0ECF5;border-radius:16px;font-size:18px;padding:9px;background:#FDFCFF}
.tfb button.good{border-color:#9EDDB2;background:#EFFAF2}
.tfb button.bad{border-color:#FFCBB3;background:#FFF5EF}
.fb{font-family:'Mali',cursive;font-size:16.5px}
.fb.ok{color:var(--ok)} .fb.no{color:var(--no)}

/* ---- ลากวาง ---- */
.tray{background:rgba(255,255,255,.96);border:none;border-radius:22px;box-shadow:0 8px 24px rgba(58,51,80,.10)}
.tile{background:var(--kl);border:2px solid var(--k);color:var(--kd);border-radius:14px;box-shadow:0 3px 8px rgba(58,51,80,.08)}
.tile.sel{background:var(--kd);border-color:var(--kd);color:#fff}
.slot{background:#FBFAFE;border:2.5px dashed var(--k);border-radius:14px}
.slot.hot,.slot.focus{background:#FFF6CC;border-color:#F2C94C}
.slot.ok{border:2.5px solid #9EDDB2;background:#EFFAF2;color:var(--ok)}
.slot.no{border:2.5px solid #FFCBB3;background:#FFF5EF;color:var(--no)}
.numpad .tile{border:none;color:#4A4060;box-shadow:0 2px 6px rgba(58,51,80,.1)}
.numpad .tile:nth-of-type(6n+1){background:#FFD6E5}
.numpad .tile:nth-of-type(6n+2){background:#FFE2C7}
.numpad .tile:nth-of-type(6n+3){background:#FFF0B3}
.numpad .tile:nth-of-type(6n+4){background:#D5F3DF}
.numpad .tile:nth-of-type(6n+5){background:#D6EBFF}
.numpad .tile:nth-of-type(6n){background:#E6DBFF}
.numpad .tile.sel{outline:3px solid var(--ac);transform:scale(1.12)}
.calcgrid .item b{color:var(--kd)}
.slotline{border:2.5px dashed var(--k);background:#FBFAFE;border-radius:16px}
.ordrow button{background:var(--kl);border:2px solid var(--k);color:var(--kd);font-weight:700;border-radius:14px}
.mini{border:none;background:var(--kl);color:var(--kd);border-radius:999px;font-weight:600}
.pic{border:none;border-radius:22px;box-shadow:0 6px 18px rgba(58,51,80,.07)}
.pic .pt{background:var(--kl);color:var(--kd);border-bottom:none}
.pic .pr{border-bottom:1px dashed #F0ECF5}
.cntrow .sy{background:var(--kl);border-radius:14px;padding:6px 10px}
.bank span{background:var(--kl);border:none;color:var(--kd);font-weight:600}
textarea.free{border:2px dashed #E6E0EE;background:#FDFCFF;border-radius:16px}

/* ---- สรุปคะแนน ---- */
.result{border:none;border-radius:30px;background:#fff;box-shadow:0 16px 40px rgba(58,51,80,.14)}
.result .stars{font-size:44px;letter-spacing:6px;line-height:1.2}
.result .cheer{font-size:40px;animation:bob 2.5s ease-in-out infinite}
.result .big{color:var(--ac)}
.btn{border:none;border-radius:999px;background:var(--ac);box-shadow:0 6px 16px rgba(58,51,80,.18)}
.btn.gh{background:#fff;color:var(--ac)}
@media(max-width:480px){.shero h2{font-size:25px}.shero .emo{width:62px;height:62px;font-size:2.2rem}.deco b{display:none}}

/* ================= เสียงอ่าน (เสียงในเครื่อง ไม่ต้องต่อเน็ต) ================= */
var SYN=window.speechSynthesis, VOX={th:null,en:null};
var NOVELTY=/Eddy|Flo|Grandma|Grandpa|Reed|Rocko|Sandy|Shelley|Albert|Bad News|Bahh|Bells|Boing|Bubbles|Cellos|Good News|Jester|Junior|Organ|Superstar|Trinoids|Whisper|Wobble|Zarvox|Fred|Kathy|Ralph/i;
function pickVox(){
  if(!SYN) return; var v=SYN.getVoices();
  var th=v.filter(function(x){return /^th/i.test(x.lang)});
  VOX.th=th.filter(function(x){return /Kanya|Narisa|Premwadee/i.test(x.name)})[0]||th[0]||null;
  var en=v.filter(function(x){return /^en[-_]US/i.test(x.lang)&&!NOVELTY.test(x.name)});
  if(!en.length) en=v.filter(function(x){return /^en/i.test(x.lang)&&!NOVELTY.test(x.name)});
  VOX.en=en.filter(function(x){return /Samantha|Allison|Ava|Susan|Google US English/i.test(x.name)})[0]||en[0]||null;
}
if(SYN){ pickVox(); SYN.onvoiceschanged=pickVox; }
/* แปลงโจทย์ให้อ่านออกเสียงได้เป็นธรรมชาติ */
function spoken(t){
  t=String(t); var num=/\d/.test(t);
  return t.replace(/_+/g,' … ').replace(/⟷/g,' ตรงข้ามกับ ').replace(/>/g,' มากกว่า ').replace(/</g,' น้อยกว่า ')
    .replace(/\+/g,' บวก ').replace(/−/g,' ลบ ').replace(/=/g, num?' เท่ากับ ':' คือ ')
    .replace(/[()]/g,' ').replace(/\s+/g,' ').trim();
}
/* ภาษาไทยอ่านด้วยเสียงไทย คำอังกฤษอ่านด้วยเสียงอังกฤษ */
function speak(text){
  if(!SYN||!text) return;
  try{ SYN.cancel(); }catch(e){}
  (String(text).match(/[A-Za-z][A-Za-z'’ ]*[A-Za-z]|[A-Za-z]|[^A-Za-z]+/g)||[]).forEach(function(p){
    if(!/[A-Za-z0-9ก-๛]/.test(p)) return;
    var en=/[A-Za-z]/.test(p), u=new SpeechSynthesisUtterance(p.trim());
    u.lang=en?'en-US':'th-TH'; u.rate=en?0.8:0.95;
    var vo=en?VOX.en:VOX.th; if(vo) u.voice=vo;
    SYN.speak(u);
  });
}
function escA(s){ return esc(s).replace(/"/g,'&quot;'); }
function spk(t){ return '<button class="spk" type="button" aria-label="ฟังเสียง" data-t="'+escA(spoken(t))+'" onclick="speak(this.dataset.t)">🔊</button>'; }

/* ================= ลากวาง / แตะเลือกแล้วแตะช่อง ================= */
var MARK=/^[ะ-๎]+$/, COMB=/^[ัิ-ฺ็-๎]/;
function tileLabel(a){ return COMB.test(a)?'◌'+a:a; }
function sayable(v){ return /[ก-ฮ]{2,}|[A-Za-z]{2,}/.test(v); }
function tile(v,bank,reuse,label){
  label=label||tileLabel(v);
  return '<span class="tile" data-v="'+escA(v)+'" data-bank="'+bank+'"'+(reuse?' data-reuse="1"':'')+
         (sayable(label)?' data-say="'+escA(label)+'"':'')+'>'+esc(label)+'</span>';
}
function slot(id,bank,a,say,al){
  return '<span class="slot" id="'+id+'" data-bank="'+bank+'" data-a="'+escA(a)+'"'+
         (say?' data-say="'+escA(say)+'"':'')+(al?' data-al="'+escA(al)+'"':'')+'>&nbsp;</span>';
}
function tray(bank,tiles,hint){
  return '<div class="tray" data-bank="'+bank+'"><span class="hint">'+(hint||'ลากคำตอบไปวางในช่อง หรือแตะคำตอบแล้วแตะช่อง')+'</span>'+tiles+'</div>';
}
/* หาช่องว่างในโจทย์: ___ หรือ _ ตัวเดียวที่มีเว้นวรรคสองข้าง */
function blankOf(q){ return q.match(/_{2,}/)||q.match(/ _ /); }
function withSlot(q,sl){
  var m=blankOf(q); if(!m) return esc(q)+' '+sl;
  return esc(q.slice(0,m.index))+sl+esc(q.slice(m.index+m[0].length));
}
function filled(q,a,joinWord){
  var m=blankOf(q);
  if(joinWord){ var base=q.split('(')[0]; m=blankOf(base)||base.match(/_+/);
    return m ? (base.slice(0,m.index)+a+base.slice(m.index+m[0].length)).replace(/\s+/g,'') : base+a; }
  return m ? q.slice(0,m.index)+' '+a+' '+q.slice(m.index+m[0].length) : q+' '+a;
}

var DRAG=null, SEL=null, FOC=null, GHOST=null, HOT=null;
function clearSel(){ if(SEL) SEL.classList.remove('sel'); SEL=null; }
function clearFoc(){ if(FOC) FOC.classList.remove('focus'); FOC=null; }
function hot(s){ if(HOT&&HOT!==s) HOT.classList.remove('hot'); if(s&&!s.dataset.done) s.classList.add('hot'); else s=null; HOT=s; }
function slotAt(x,y){ var e=document.elementFromPoint(x,y); return e?e.closest('.slot'):null; }
function shake(el){ el.classList.remove('shake'); void el.offsetWidth; el.classList.add('shake'); }

function place(t,s){
  if(!s||s.dataset.done||t.classList.contains('used')) return;
  if(t.dataset.bank!==s.dataset.bank){ shake(s); shake(t); return; }
  s.dataset.done=1; clearFoc();
  var ok=norm(t.dataset.v)===norm(s.dataset.a);
  s.textContent=t.textContent; s.classList.remove('hot'); s.classList.add(ok?'ok':'no');
  var el=document.getElementById('w'+s.id);
  if(el){
    el.classList.add(ok?'ok':'no');
    var fb=el.querySelector('.fb'), right=s.dataset.al||tileLabel(s.dataset.a);
    if(fb){ fb.className='fb '+(ok?'ok':'no'); fb.textContent=ok?praise():'✗ คำตอบที่ถูกคือ  '+right; }
    else if(!ok){ s.insertAdjacentHTML('afterend','<span class="cans">→ '+esc(right)+'</span>'); }
  }
  if(ok && !t.dataset.reuse) t.classList.add('used');
  if(s.dataset.say) speak(spoken(s.dataset.say));
  mark(s.id,ok);
}

document.addEventListener('pointerdown',function(e){
  var t=e.target.closest('.tile'); if(!t||t.classList.contains('used')||t.classList.contains('ghost')) return;
  e.preventDefault(); DRAG={el:t,x:e.clientX,y:e.clientY,moved:false};
});
document.addEventListener('pointermove',function(e){
  if(!DRAG) return;
  var dx=e.clientX-DRAG.x, dy=e.clientY-DRAG.y;
  if(!DRAG.moved && dx*dx+dy*dy>64){
    DRAG.moved=true; clearSel();
    GHOST=DRAG.el.cloneNode(true); GHOST.classList.remove('sel'); GHOST.classList.add('ghost'); document.body.appendChild(GHOST);
  }
  if(DRAG.moved){ e.preventDefault();
    GHOST.style.transform='translate('+e.clientX+'px,'+e.clientY+'px) translate(-50%,-50%) rotate(-3deg)';
    hot(slotAt(e.clientX,e.clientY)); }
},{passive:false});
document.addEventListener('pointerup',function(e){
  if(!DRAG) return; var d=DRAG; DRAG=null;
  if(d.moved){ var s=slotAt(e.clientX,e.clientY); if(GHOST){GHOST.remove();GHOST=null;} hot(null); if(s) place(d.el,s); return; }
  if(d.el.dataset.say) speak(d.el.dataset.say);
  if(FOC && !FOC.dataset.done && FOC.dataset.bank===d.el.dataset.bank){ var f=FOC; place(d.el,f); return; }
  if(SEL===d.el){ clearSel(); return; }
  clearSel(); SEL=d.el; SEL.classList.add('sel');
});
document.addEventListener('pointercancel',function(){ if(GHOST){GHOST.remove();GHOST=null;} hot(null); DRAG=null; });
document.addEventListener('click',function(e){
  var s=e.target.closest('.slot'); if(!s||s.dataset.done) return;
  if(SEL){ var t=SEL; clearSel(); place(t,s); return; }
  if(FOC===s){ clearFoc(); return; }
  clearFoc(); FOC=s; s.classList.add('focus');
});

/* ------- เติมคำ ------- */
RB.fill=function(b,bi){
  var ans=b.items.map(function(it){return it.a}), uniq=[];
  ans.forEach(function(a){ if(uniq.indexOf(a)<0) uniq.push(a); });
  var numeric=ans.every(function(a){return /^\d+$/.test(a)});
  var letters=ans.every(function(a){return /^[A-Za-z]$/.test(a)});
  /* เติมสระ/วรรณยุกต์ หรือตัวอักษรที่หายไป → อ่านคำที่เติมเสร็จทั้งคำ */
  var joinWord=letters||ans.every(function(a){return a.length<=3 && /^[\u0E30-\u0E3A\u0E40-\u0E4E]/.test(a)});
  var bank=numeric?'num':'f'+bi, reuse=uniq.length<ans.length||uniq.length<=3, h='';
  if(!numeric){
    var vals=uniq.slice();
    if(letters) shuffle('aeiourst'.split('').filter(function(c){return vals.indexOf(c)<0})).slice(0,3).forEach(function(c){vals.push(c)});
    h+=tray(bank, shuffle(vals).map(function(v){return tile(v,bank,letters||reuse)}).join(''));
  }
  b.items.forEach(function(it,k){
    var id=bank+'x'+bi+'_'+k; CUR.total++;
    var sl=slot(id,bank,it.a,filled(it.q,it.a,joinWord));
    if(joinWord) sl=sl.replace('class="slot"','class="slot sm"');
    h+='<div class="item" id="w'+id+'"><div class="qt"><span class="n">'+(k+1)+'.</span>'+
       '<span class="fillrow">'+withSlot(it.q,sl)+'</span>'+spk(it.q)+'</div><div class="fb"></div></div>';
  });
  return '<div class="blk">'+h+'</div>';
};

    var body = m ? withSlot(it.q, slot(id,'num',it.a,say)) : '<b>'+esc(it.q)+'</b>'+slot(id,'num',it.a,say);

};

       shuffle(it.words).map(function(w){return '<button onclick="addWord(\''+id+'\',this)">'+esc(w)+'</button>'}).join('')+'</div>'+
       '<button class="mini" onclick="resetOrder(\''+id+'\')">ล้างคำตอบ</button>'+
       '<button class="mini" onclick="checkOrder(\''+id+'\')">ตรวจคำตอบ</button><div class="fb"></div></div>';
  });
  return h+'</div>';
};
function addWord(id,btn){
  var el=document.getElementById('w'+id); if(el.dataset.done) return;
  var s=document.getElementById('s'+id);
  if(s.querySelector('em')) s.innerHTML='';
  var sp=document.createElement('span'); sp.textContent=btn.textContent;
  sp.style.cssText='background:#fff;border:2px solid var(--ac);border-radius:10px;padding:2px 11px';
  s.appendChild(sp); btn.classList.add('used'); speak(btn.textContent);
}
function resetOrder(id){
  var el=document.getElementById('w'+id); if(el.dataset.done) return;
  document.getElementById('s'+id).innerHTML='<em>แตะคำด้านล่างเรียงเป็นประโยค</em>';
  document.getElementById('r'+id).querySelectorAll('button').forEach(function(b){b.classList.remove('used')});
}
function checkOrder(id){
  var el=document.getElementById('w'+id); if(el.dataset.done) return;
  var s=document.getElementById('s'+id);
  var got=Array.prototype.map.call(s.querySelectorAll('span'),function(x){return x.textContent});
  if(!got.length) return;
  el.dataset.done=1;
  var ok = norm(got.join(''))===norm(el.dataset.a);
  s.classList.add(ok?'ok':'no'); el.classList.add(ok?'ok':'no');
  var fb=el.querySelector('.fb'); fb.className='fb '+(ok?'ok':'no');
  fb.textContent = ok?praise():'✗ คำตอบที่ถูกคือ  '+el.dataset.a;
  speak(el.dataset.a);
  mark(id,ok);
}

openSub(0);
</script></body></html>
