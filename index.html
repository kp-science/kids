<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>ห้องเรียนที่บ้าน</title>

<!-- ให้เพิ่มลงหน้าจอโฮมบน iPad แล้วเปิดเต็มจอเหมือนแอป -->
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="ห้องเรียน">
<meta name="theme-color" content="#7CC8F2">
<meta name="robots" content="noindex, nofollow">
<meta name="mobile-web-app-capable" content="yes">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="icon" type="image/png" href="favicon.png">

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Mali:wght@500;600;700&family=Noto+Sans+Thai+Looped:wght@400;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --ink:#2A2440; --muted:#6E6886; --paper:#FFF9EE; --card:#FFFFFF; --line:#EFE4D2;
  --sky1:#7CC8F2; --sky2:#C9ECFF; --sun:#FFC83D;
}
*{box-sizing:border-box;margin:0;padding:0}
body{background:var(--paper);color:var(--ink);
  font-family:'Noto Sans Thai Looped','Noto Sans Thai',sans-serif;font-size:16px;line-height:1.6;
  -webkit-text-size-adjust:100%}
a{color:inherit;text-decoration:none}
button{font:inherit;color:inherit}

/* ---------------- ฉากท้องฟ้าด้านบน ---------------- */
.hero{position:relative;overflow:hidden;background:linear-gradient(180deg,var(--sky1) 0%,var(--sky2) 100%);
  padding:calc(22px + env(safe-area-inset-top)) 18px 0}
.scene{position:absolute;inset:0;width:100%;height:100%;pointer-events:none}
.cloud{animation:drift 38s linear infinite}
.cloud.c2{animation-duration:52s;animation-delay:-20s}
.cloud.c3{animation-duration:46s;animation-delay:-33s}
@keyframes drift{from{transform:translateX(-260px)}to{transform:translateX(1460px)}}
.sunrays{transform-origin:1060px 62px;animation:spin 40s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
@media (prefers-reduced-motion:reduce){.cloud,.sunrays,.bob{animation:none!important}}

.hin{position:relative;max-width:980px;margin:0 auto;padding-bottom:170px}
.hello{display:inline-flex;align-items:center;gap:8px;background:rgba(255,255,255,.85);border-radius:999px;
  padding:4px 14px 4px 6px;font-weight:600;font-size:.9rem;box-shadow:0 3px 0 rgba(42,36,64,.12)}
.hello .face{font-size:1.4rem}
.hero h1{font-family:'Mali',sans-serif;font-weight:700;font-size:2.4rem;line-height:1.25;margin-top:10px;color:#fff;
  text-shadow:0 3px 0 #3A8FC4, 0 6px 14px rgba(20,70,110,.25)}
.hero h1 .bob{display:inline-block;animation:bob 2.6s ease-in-out infinite}
@keyframes bob{50%{transform:translateY(-6px) rotate(6deg)}}
.hero p.sub{color:#1F4E6E;font-weight:600;margin-top:2px;font-size:1rem}
.search{margin-top:14px;max-width:460px;position:relative}
.search input{width:100%;padding:11px 16px 11px 44px;border-radius:999px;border:3px solid #fff;
  background:rgba(255,255,255,.92);font-family:inherit;font-size:1rem;color:var(--ink);
  box-shadow:0 4px 0 rgba(42,36,64,.12)}
.search input:focus{outline:none;border-color:var(--sun)}
.search::before{content:"🔎";position:absolute;left:15px;top:50%;transform:translateY(-50%);font-size:1.05rem}

/* ---------------- น้องบนหน้าแรก ขยับดุ๊กดิ๊ก ---------------- */
.hero{isolation:isolate}   /* หญ้าด้านหน้าซ้อนเฉพาะในฉาก ไม่ทับปุ่มเลือกวิชา */
.scene.front{z-index:3}
.kid{position:absolute;right:max(130px,calc((100% - 980px)/2 + 20px));bottom:34px;width:140px;z-index:2;cursor:pointer;
  -webkit-tap-highlight-color:transparent}
.kid .body{animation:wiggle 2.8s ease-in-out infinite;transform-origin:50% 100%}
.kid img{display:block;width:100%;height:auto;pointer-events:none;-webkit-user-select:none;user-select:none;
  filter:drop-shadow(4px 0 0 #fff) drop-shadow(-4px 0 0 #fff) drop-shadow(0 4px 0 #fff) drop-shadow(0 -4px 0 #fff) drop-shadow(0 8px 12px rgba(30,80,120,.25))}
.kid.jump .body{animation:jump .7s cubic-bezier(.3,1.6,.5,1)}
@keyframes wiggle{0%,100%{transform:translateY(0) rotate(-3deg)}25%{transform:translateY(-8px) rotate(2deg)}50%{transform:translateY(0) rotate(4deg)}75%{transform:translateY(-6px) rotate(-2deg)}}
@keyframes jump{0%{transform:translateY(0) scale(1,1)}20%{transform:translateY(4px) scale(1.06,.92)}50%{transform:translateY(-38px) scale(.96,1.06) rotate(6deg)}80%{transform:translateY(0) scale(1.04,.96)}100%{transform:none}}
.kid .bubble{position:absolute;left:-128px;top:30px;background:#fff;color:var(--ink);font-family:'Mali',sans-serif;font-weight:700;font-size:.95rem;
  padding:8px 14px;border-radius:18px;box-shadow:0 6px 16px rgba(30,80,120,.18);white-space:nowrap;animation:popin .5s ease-out both,floatb 3.4s ease-in-out .5s infinite}
.kid .bubble::after{content:"";position:absolute;right:-8px;top:50%;margin-top:-8px;border:8px solid transparent;border-left-color:#fff;border-right:0}
@keyframes popin{from{transform:scale(.3);opacity:0}to{transform:scale(1);opacity:1}}
@keyframes floatb{50%{transform:translateY(-5px)}}
.kid .fx{position:absolute;font-size:1.3rem;opacity:0;animation:rise 3.6s ease-in infinite;pointer-events:none}
.kid .fx:nth-of-type(1){left:4%;top:40%;animation-delay:0s}
.kid .fx:nth-of-type(2){right:2%;top:30%;animation-delay:1.2s}
.kid .fx:nth-of-type(3){left:46%;top:6%;animation-delay:2.4s}
@keyframes rise{0%{transform:translateY(10px) scale(.6);opacity:0}20%{opacity:1}100%{transform:translateY(-70px) scale(1.1) rotate(20deg);opacity:0}}
@media (prefers-reduced-motion:reduce){.kid .body,.kid .bubble,.kid .fx{animation:none!important}.kid .fx{display:none}}
@media (max-width:900px){.kid{width:140px}}
@media (max-width:560px){
  .kid{width:92px;right:64px;bottom:34px}
  .kid .bubble{left:auto;right:84px;top:30px;font-size:.78rem;padding:5px 10px}
  .kid .fx{font-size:1rem}
}

/* ---------------- ภารกิจวันนี้ ---------------- */
.today{background:#fff;border-radius:28px;padding:16px 18px;margin:4px 0 22px;box-shadow:0 10px 26px rgba(42,36,64,.08)}
.today .th{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin-bottom:10px}
.today .th .ti{width:48px;height:48px;border-radius:16px;background:#FFF1C9;display:grid;place-items:center;font-size:1.7rem;flex:none}
.today .th h2{font-family:'Mali',sans-serif;font-size:1.35rem;line-height:1.2}
.today .th small{display:block;color:var(--muted);font-weight:600;font-size:.8rem}
.today .chips2{margin-left:auto;display:flex;gap:6px;flex-wrap:wrap}
.today .chips2 span{background:#FFF6DC;color:#8A6100;border-radius:999px;padding:3px 12px;font-weight:700;font-size:.85rem;white-space:nowrap}
.today .chips2 span.fire{background:#FFE9E0;color:#B4551C}
.mlist{list-style:none;display:grid;gap:8px}
.mlist li{display:flex;align-items:center;gap:12px;background:#FBF8F2;border-radius:18px;padding:9px 12px}
.mlist li .me{width:42px;height:42px;border-radius:14px;background:#fff;display:grid;place-items:center;font-size:1.4rem;flex:none;box-shadow:0 2px 8px rgba(42,36,64,.06)}
.mlist li .mt{flex:1;font-weight:600;line-height:1.35}
.mlist li .mt small{display:block;color:var(--muted);font-weight:600;font-size:.78rem}
.mlist li .mgo{background:#2F6DB0;color:#fff;border-radius:999px;padding:6px 14px;font-weight:700;font-size:.88rem;white-space:nowrap}
.mlist li.done{background:#EFFAF2}
.mlist li.done .mt{color:#2F7A4A;text-decoration:line-through;text-decoration-thickness:2px;text-decoration-color:rgba(47,122,74,.35)}
.mlist li .mok{font-size:1.5rem}
.stamp{margin-top:10px;background:linear-gradient(90deg,#FFE3EC,#FFF1C9,#E3F4FF);border-radius:18px;padding:10px 14px;text-align:center;
  font-family:'Mali',sans-serif;font-weight:700;font-size:1.1rem;color:#6E3CC0;animation:pop2 .6s ease-out}
@keyframes pop2{0%{transform:scale(.7);opacity:0}70%{transform:scale(1.04)}100%{transform:scale(1);opacity:1}}
.bookbtn{margin-top:12px;display:flex;align-items:center;gap:12px;background:#F4EFFF;border-radius:18px;padding:10px 14px;color:#5E3FB8;font-weight:700;position:relative}
.bookbtn .be{font-size:1.9rem}
.bookbtn .bt{flex:1;line-height:1.35}
.bookbtn .bt small{display:block;font-weight:600;color:#8C7BB8;font-size:.8rem}
.bookbtn .bar{height:8px;border-radius:99px;background:#E4DAFB;margin-top:4px;overflow:hidden}
.bookbtn .bar i{display:block;height:100%;border-radius:99px;background:linear-gradient(90deg,#C9A8FF,#FF9EC4)}
.bookbtn .new{position:absolute;top:-8px;right:10px;background:#FF6B8B;color:#fff;border-radius:999px;padding:1px 10px;font-size:.78rem;animation:pop2 .6s ease-out}
footer .parent{display:inline-block;margin-top:6px;color:var(--muted);text-decoration:underline;font-weight:600}

/* ---------------- ปุ่มเลือกวิชา ---------------- */
.wrap{max-width:980px;margin:0 auto;padding:0 16px 60px;position:relative}
.picker{display:flex;gap:12px;overflow-x:auto;padding:4px 2px 14px;margin:-58px 0 18px;scrollbar-width:none;
  -webkit-overflow-scrolling:touch}
.picker::-webkit-scrollbar{display:none}
.pick{flex:0 0 auto;width:96px;display:flex;flex-direction:column;align-items:center;gap:6px;cursor:pointer;
  background:none;border:none;padding:0}
.pick .bub{width:78px;height:78px;border-radius:26px;display:grid;place-items:center;font-size:2.3rem;
  background:var(--c);border:4px solid #fff;box-shadow:0 5px 0 var(--cd), 0 8px 18px rgba(42,36,64,.15);
  transition:transform .15s}
.pick .nm{font-weight:700;font-size:.86rem;line-height:1.25;text-align:center;background:#fff;border-radius:999px;
  padding:1px 10px;box-shadow:0 2px 0 var(--line)}
.pick .ct{display:block;font-size:.72rem;color:var(--muted);font-weight:600}
.pick:hover .bub{transform:translateY(-3px) rotate(-4deg)}
.pick:active .bub{transform:translateY(3px);box-shadow:0 2px 0 var(--cd)}
.pick.on .bub{outline:4px solid var(--cd);outline-offset:3px}
.pick.on .nm{background:var(--cd);color:#fff;box-shadow:none}
.pick.on .ct{color:rgba(255,255,255,.85)}

/* ---------------- กลุ่มวิชา ---------------- */
.group{margin-top:22px}
.ghead{display:flex;align-items:center;gap:10px;margin-bottom:12px}
.ghead .gi{width:44px;height:44px;border-radius:14px;display:grid;place-items:center;font-size:1.5rem;
  background:var(--c);box-shadow:0 3px 0 var(--cd);transform:rotate(-6deg)}
.ghead h2{font-family:'Mali',sans-serif;font-size:1.45rem;color:var(--cd);line-height:1.2}
.ghead::after{content:"";flex:1;height:4px;border-radius:4px;
  background:repeating-linear-gradient(90deg,var(--c) 0 12px,transparent 12px 20px)}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(270px,1fr));gap:16px}

.card{position:relative;display:flex;flex-direction:column;background:var(--card);border-radius:24px;
  border:3px solid var(--c);box-shadow:0 6px 0 var(--cd);overflow:hidden;transition:transform .15s, box-shadow .15s}
.card:hover{transform:translateY(-4px) rotate(-.5deg);box-shadow:0 10px 0 var(--cd)}
.card:active{transform:translateY(3px);box-shadow:0 2px 0 var(--cd)}
.card .top{position:relative;height:74px;background:var(--c);
  background-image:radial-gradient(circle at 20% 30%,rgba(255,255,255,.35) 0 10px,transparent 11px),
    radial-gradient(circle at 70% 70%,rgba(255,255,255,.25) 0 16px,transparent 17px),
    radial-gradient(circle at 90% 20%,rgba(255,255,255,.3) 0 6px,transparent 7px)}
.card .sticker{position:absolute;left:18px;bottom:-30px;width:70px;height:70px;border-radius:22px;background:#fff;
  display:grid;place-items:center;font-size:2.2rem;font-weight:700;color:var(--cd);font-family:'Mali',sans-serif;
  border:3px solid var(--c);box-shadow:0 4px 0 var(--cd);transform:rotate(-5deg)}
.card .subj{position:absolute;left:100px;top:14px;background:rgba(255,255,255,.9);color:var(--cd);font-weight:700;font-size:.82rem;
  border-radius:999px;padding:2px 11px}
.card .level{position:absolute;right:14px;top:12px;background:#fff;color:var(--cd);font-weight:700;font-size:.8rem;
  border-radius:999px;padding:2px 11px}
.card .body{padding:38px 18px 16px;display:flex;flex-direction:column;gap:8px;flex:1}
.card h3{font-family:'Mali',sans-serif;font-size:1.2rem;line-height:1.3}
.card p{font-size:.86rem;color:var(--muted);flex:1;display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden}
.tags{display:flex;gap:6px;flex-wrap:wrap}
.tags span{font-size:.74rem;font-weight:700;border-radius:999px;padding:2px 10px;background:var(--cl);color:var(--cd)}
.go{align-self:flex-start;margin-top:4px;background:var(--cd);color:#fff;font-weight:700;border-radius:999px;
  padding:7px 18px;font-size:.95rem;box-shadow:0 3px 0 rgba(0,0,0,.18)}
.card.soon{border-style:dashed;box-shadow:none;opacity:.75}
.card.soon .go{background:#CFC8BC}

.empty{text-align:center;color:var(--muted);padding:40px 10px;font-size:1rem}
.empty b{display:block;font-size:3rem}

/* ---------------- แฟ้มวิชา ---------------- */
.folders{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:22px 18px}
.folder{position:relative;display:flex;flex-direction:column;width:100%;text-align:left;background:none;border:none;padding:26px 0 0;cursor:pointer;
  transition:transform .15s}
.folder::before{content:"";position:absolute;left:0;top:6px;width:48%;height:40px;background:var(--cd);
  border-radius:18px 18px 0 0}
.folder .paper{position:absolute;left:16px;right:22px;top:14px;height:60px;background:#fff;border:2px solid var(--line);
  border-radius:10px;transform:rotate(-3deg);box-shadow:0 2px 4px rgba(0,0,0,.06)}
.folder .paper.p2{left:30px;right:12px;top:18px;transform:rotate(2.5deg)}
.folder .paper::after{content:"";position:absolute;left:14px;right:40%;top:14px;height:5px;border-radius:3px;
  background:var(--cl);box-shadow:0 11px 0 var(--cl)}
.folder .front{position:relative;background:var(--c);border-radius:0 24px 24px 24px;padding:16px 16px 16px;
  box-shadow:0 6px 0 var(--cd);border:3px solid var(--cd);flex:1;display:flex;flex-direction:column;align-items:flex-start;
  background-image:radial-gradient(circle at 88% 18%,rgba(255,255,255,.35) 0 14px,transparent 15px),
    radial-gradient(circle at 76% 44%,rgba(255,255,255,.25) 0 7px,transparent 8px)}
.folder:hover{transform:translateY(-4px) rotate(-.6deg)}
.folder:active{transform:translateY(3px)}
.folder .fhead{display:flex;align-items:center;gap:12px}
.folder .fic{width:62px;height:62px;border-radius:20px;background:#fff;display:grid;place-items:center;font-size:2.1rem;
  box-shadow:0 4px 0 var(--cd);transform:rotate(-6deg);flex:none}
.folder h3{font-family:'Mali',sans-serif;font-size:1.45rem;line-height:1.2;color:var(--cd)}
.folder .fcount{display:inline-block;margin-top:3px;background:#fff;color:var(--cd);font-weight:700;font-size:.8rem;
  border-radius:999px;padding:1px 10px}
.folder .flist{list-style:none;align-self:stretch;flex:1;background:rgba(255,255,255,.93);border-radius:16px;padding:8px 12px;margin:14px 0 12px}
.folder .flist li{display:flex;gap:8px;align-items:baseline;font-size:.9rem;font-weight:600;padding:4px 0;
  border-bottom:2px dotted var(--cl)}
.folder .flist li:last-child{border-bottom:none}
.folder .flist li i{font-style:normal;flex:none}
.folder .flist li.more{color:var(--muted);font-weight:600}
.folder .go{background:#fff;color:var(--cd)}

.subhead{display:flex;align-items:center;gap:12px;margin:22px 0 12px;background:var(--cl);border-radius:20px;padding:10px 14px}
.subhead .si{width:46px;height:46px;border-radius:16px;background:#fff;display:grid;place-items:center;font-size:1.6rem;flex:none}
.subhead h3{font-family:'Mali',sans-serif;font-size:1.25rem;color:var(--cd);line-height:1.2}
.subhead .sc{font-family:'Noto Sans Thai Looped',sans-serif;font-size:.78rem;background:#fff;border-radius:999px;padding:1px 10px;vertical-align:middle}
.subhead small{display:block;color:var(--muted);font-weight:600;font-size:.82rem}
.crumb{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin:4px 0 16px}
.backbtn{background:#fff;border:3px solid var(--cd);color:var(--cd);font-weight:700;border-radius:999px;padding:5px 16px;
  cursor:pointer;box-shadow:0 3px 0 var(--cd)}
.backbtn:active{transform:translateY(3px);box-shadow:none}
.crumb .ghead{margin:0;flex:1;min-width:220px}

footer{text-align:center;font-size:.8rem;color:var(--muted);padding:6px 18px 30px}
footer .grass{font-size:1.3rem;letter-spacing:6px;display:block;margin-bottom:4px}

@media (max-width:560px){
  .hero h1{font-size:1.85rem}
  .hin{padding-bottom:252px}
  /* จอแคบ: ย่อฉากให้อยู่แถบล่าง ไม่ทับชื่อเว็บกับช่องค้นหา */
  .scene{top:auto;height:150px}
  .pick{width:84px}
  .pick .bub{width:68px;height:68px;font-size:2rem;border-radius:22px}
  .grid{grid-template-columns:1fr}
}
</style>
</head>
<body>

<header class="hero">
  <!-- ภาพวาดฉากท้องฟ้า เนินหญ้า บ้าน และต้นไม้ -->
  <svg class="scene" viewBox="0 0 1200 300" preserveAspectRatio="xMaxYMax slice" aria-hidden="true">
    <g transform="translate(104 -14)">
    <g class="sunrays" fill="#FFE08A">
      <path d="M1060 -8 L1068 30 L1052 30Z"/><path d="M1060 132 L1068 94 L1052 94Z"/>
      <path d="M990 62 L1028 54 L1028 70Z"/><path d="M1130 62 L1092 54 L1092 70Z"/>
      <path d="M1010 12 L1036 40 L1026 48Z"/><path d="M1110 112 L1084 84 L1094 76Z"/>
      <path d="M1110 12 L1094 48 L1084 40Z"/><path d="M1010 112 L1026 76 L1036 84Z"/>
    </g>
    <circle cx="1060" cy="62" r="32" fill="var(--sun)"/>
    <circle cx="1050" cy="56" r="3.5" fill="#6B4A00"/><circle cx="1072" cy="56" r="3.5" fill="#6B4A00"/>
    <path d="M1048 70 Q1061 80 1074 70" stroke="#6B4A00" stroke-width="3" fill="none" stroke-linecap="round"/>
    <circle cx="1042" cy="68" r="4" fill="#FF9E7A" opacity=".7"/><circle cx="1080" cy="68" r="4" fill="#FF9E7A" opacity=".7"/>
    </g>

    <g class="cloud" fill="#fff" opacity=".95">
      <ellipse cx="120" cy="70" rx="46" ry="20"/><ellipse cx="90" cy="76" rx="30" ry="16"/><ellipse cx="152" cy="78" rx="32" ry="15"/>
    </g>
    <g class="cloud c2" fill="#fff" opacity=".85">
      <ellipse cx="160" cy="130" rx="38" ry="16"/><ellipse cx="132" cy="136" rx="24" ry="12"/><ellipse cx="188" cy="137" rx="26" ry="12"/>
    </g>
    <g class="cloud c3" fill="#fff" opacity=".9">
      <ellipse cx="100" cy="30" rx="30" ry="13"/><ellipse cx="124" cy="36" rx="22" ry="11"/>
    </g>

    <path d="M0 250 Q180 190 380 232 T760 222 T1200 212 V300 H0Z" fill="#8FD46B"/>
    <path d="M0 275 Q240 232 520 266 T1000 252 T1200 262 V300 H0Z" fill="#6CC04A"/>

    <!-- บ้าน -->
    <g transform="translate(860 168)">
      <rect x="0" y="34" width="84" height="58" rx="4" fill="#FFF3D6"/>
      <path d="M-10 38 L42 -2 L94 38Z" fill="#F0685A"/>
      <rect x="32" y="58" width="22" height="34" rx="3" fill="#B7794A"/>
      <rect x="9" y="48" width="16" height="16" rx="2" fill="#9EDBFF"/>
      <rect x="61" y="48" width="16" height="16" rx="2" fill="#9EDBFF"/>
      <rect x="62" y="6" width="10" height="20" fill="#C96A5E"/>
    </g>
    <!-- ต้นไม้ -->
    <g transform="translate(990 170)">
      <rect x="18" y="44" width="12" height="40" rx="4" fill="#9A6A3F"/>
      <circle cx="24" cy="34" r="30" fill="#3FAE5A"/><circle cx="8" cy="46" r="18" fill="#4DBE67"/><circle cx="42" cy="44" r="18" fill="#37A351"/>
      <circle cx="14" cy="30" r="4" fill="#FF6B6B"/><circle cx="36" cy="22" r="4" fill="#FF6B6B"/><circle cx="30" cy="48" r="4" fill="#FF6B6B"/>
    </g>

/* ที่อยู่หน้า: #วิชา หรือ #วิชา/แฟ้มย่อย */
function fromHash(){
  const [g, sb] = decodeURIComponent(location.hash.slice(1)).split('/');
  if(!MATERIALS.some(x => x.g===g)) return ['all', null];
  return [g, sb && MATERIALS.some(x => x.g===g && x.sub===sb) ? sb : null];
}
function hashOf(g, sb){ return g==='all' ? '' : '#'+encodeURIComponent(g)+(sb ? '/'+encodeURIComponent(sb) : ''); }
function openFolder(g, sb=null){
  filter = g; subf = sb; term = ''; $('#q').value = '';
  const h = hashOf(g, sb);
  if(location.hash !== h) history.pushState(null, '', h || location.pathname);
  render();
  if(g!=='all') window.scrollTo({ top: $('#chips').getBoundingClientRect().top + scrollY - 8, behavior:'smooth' });
}
window.addEventListener('popstate', () => { [filter, subf] = fromHash(); render(); });

function renderChips(){
  const gs = groups();
  const pick = (key, label, n, s) =>
    '<button class="pick'+(filter===key?' on':'')+'" data-g="'+esc(key)+'" style="'+vars(s)+'" role="tab" aria-selected="'+(filter===key)+'">'+
      '<span class="bub">'+s.e+'</span><span class="nm">'+esc(label)+'<span class="ct">'+n+'</span></span></button>';
  $('#chips').innerHTML = pick('all','ทุกวิชา',gs.length+' แฟ้ม',ALL) + gs.map(([g,n]) => pick(g,g,n+' เรื่อง',sub(g))).join('');
  $('#chips').querySelectorAll('.pick').forEach(b => b.onclick = () => openFolder(b.dataset.g));
}

function card(x, showSub){
  const s = (x.sub && SUBGROUPS[x.sub]) || sub(x.g), live = !!x.url;
  const level = (x.tags||[]).find(t => /^ป\.\d/.test(t));
  const tags = (x.tags||[]).filter(t => t!==level);
  const inner =
    '<div class="top">'+(showSub?'<span class="subj">'+s.e+' '+esc(x.g)+'</span>':'')+(level?'<span class="level">'+esc(level)+'</span>':'')+'<div class="sticker">'+esc(x.icon||s.e)+'</div></div>'+
    '<div class="body"><h3>'+esc(x.t)+'</h3>'+
    '<p>'+esc(x.d||'')+'</p>'+
    (tags.length ? '<div class="tags">'+tags.map(t => '<span>'+esc(t)+'</span>').join('')+'</div>' : '')+
    '<span class="go">'+(live?'เริ่มเลย ▶':'เร็ว ๆ นี้')+'</span></div>';
  return live
    ? '<a class="card" style="'+vars(s)+'" href="'+esc(x.url)+'">'+inner+'</a>'
    : '<div class="card soon" style="'+vars(s)+'">'+inner+'</div>';
}

/* แฟ้มย่อย เช่น เกมฝึกสมอง / เกมท้าทาย */
function subFolder(g, name, items){
  const sg = SUBGROUPS[name] || sub(g), show = items.slice(0,3);
  return '<button type="button" class="folder" data-g="'+esc(g)+'" data-sub="'+esc(name)+'" style="'+vars(sg)+'" aria-label="เปิดแฟ้ม'+esc(name)+'">'+
    '<span class="paper"></span>'+(items.length>1?'<span class="paper p2"></span>':'')+
    '<div class="front"><div class="fhead"><span class="fic">'+(sg.e||'📁')+'</span>'+
      '<div><h3>'+esc(name)+'</h3><span class="fcount">📄 '+items.length+' เรื่อง</span></div></div>'+
    (sg.note ? '<p style="margin-top:8px;font-weight:600;color:var(--cd)">'+esc(sg.note)+'</p>' : '')+
    '<ul class="flist">'+show.map(x => '<li><i>'+esc(x.icon||sg.e)+'</i><span>'+esc(x.t)+'</span></li>').join('')+
      (items.length>3 ? '<li class="more"><i>➕</i>และอีก '+(items.length-3)+' เรื่อง</li>' : '')+'</ul>'+
    '<span class="go">เปิดแฟ้ม 📂</span></div></button>';
}
function subsHTML(items){
  const subs = [...new Set(items.map(x => x.sub).filter(Boolean))];
  if(!subs.length) return '<div class="grid">'+items.map(x => card(x)).join('')+'</div>';
  return subs.map(n => {
    const sg = SUBGROUPS[n] || {}, list = items.filter(x => x.sub===n);
    return '<div class="subhead" style="'+vars(sg.c?sg:sub(''))+'"><span class="si">'+(sg.e||'📁')+'</span>'+
      '<div><h3>'+esc(n)+' <span class="sc">'+list.length+' เรื่อง</span></h3>'+(sg.note?'<small>'+esc(sg.note)+'</small>':'')+'</div></div>'+
      '<div class="grid">'+list.map(x => card(x)).join('')+'</div>';
  }).join('') + (items.some(x => !x.sub) ? '<div class="grid" style="margin-top:18px">'+items.filter(x => !x.sub).map(x => card(x)).join('')+'</div>' : '');
}
function folder(g, items){
  const s = sub(g), show = items.slice(0,3);
  const subs = [...new Set(items.map(x => x.sub).filter(Boolean))];
  return '<button type="button" class="folder" data-g="'+esc(g)+'" style="'+vars(s)+'" aria-label="เปิดแฟ้ม'+esc(g)+'">'+
    '<span class="paper"></span>'+(items.length>1?'<span class="paper p2"></span>':'')+
    '<div class="front"><div class="fhead"><span class="fic">'+s.e+'</span>'+
      '<div><h3>'+esc(g)+'</h3><span class="fcount">📄 '+items.length+' เรื่อง</span></div></div>'+
    '<ul class="flist">'+(subs.length
      ? subs.map(n => '<li><i>'+((SUBGROUPS[n]||{}).e||'📁')+'</i><span>'+esc(n)+' · '+items.filter(x => x.sub===n).length+' เรื่อง</span></li>').join('')
      : show.map(x => '<li><i>'+esc(x.icon||s.e)+'</i><span>'+esc(x.t)+'</span></li>').join('')+
        (items.length>3 ? '<li class="more"><i>➕</i>และอีก '+(items.length-3)+' เรื่อง</li>' : ''))+'</ul>'+
    '<span class="go">เปิดแฟ้ม 📂</span></div></button>';
}

/* ภารกิจวันนี้ + ดาว + สติกเกอร์ (แสดงเฉพาะหน้าแรก) */
function renderToday(show){
  const box = $('#today');
  if(!show || !window.KP){ box.hidden = true; return; }
  const d = KP.data(), td = KP.day(d), ev = td.events, ms = KP.missions();
  const starsToday = ev.reduce((t,x)=>t+(x.stars||0),0), st = KP.streak(d);
  const have = KP.stickerCount(d), total = KP.ALL_STICKERS.length, per = KP.STARS_PER_STICKER;
  const toNext = per - (d.totals.stars % per), isNew = have > (d.seenStickers||0);
  const allDone = ms.every(m => m.done(ev));
  const now = new Date();
  box.hidden = false;
  box.innerHTML =
    '<div class="th"><span class="ti">🎯</span><div><h2>ภารกิจวันนี้</h2><small>'+now.toLocaleDateString('th-TH',{weekday:'long',day:'numeric',month:'long'})+'</small></div>'+
      '<div class="chips2">'+(st?'<span class="fire">🔥 '+st+' วันติดต่อกัน</span>':'')+'<span>⭐ วันนี้ '+starsToday+' ดาว</span></div></div>'+
    '<ul class="mlist">'+ms.map(m => {
      const ok = m.done(ev);
      return '<li class="'+(ok?'done':'')+'"><span class="me">'+m.e+'</span><span class="mt">'+esc(m.text)+
        (m.progress && !ok ? '<small>ตอนนี้ '+m.progress(ev)+'</small>' : '')+'</span>'+
        (ok ? '<span class="mok">✅</span>' : (m.url ? '<a class="mgo" href="'+esc(m.url)+'">ไปเลย ▶</a>' : ''))+'</li>';
    }).join('')+'</ul>'+
    (allDone ? '<div class="stamp">🏅 ภารกิจวันนี้สำเร็จ! ได้สติกเกอร์พิเศษ 1 ดวง 🎉</div>' : '')+
    '<a class="bookbtn" href="stickers.html"><span class="be">📒</span><span class="bt">สมุดสติกเกอร์ · สะสมแล้ว '+have+' / '+total+
      '<small>'+(have<total ? 'อีก '+toNext+' ดาวได้สติกเกอร์ใหม่' : 'สะสมครบทุกดวงแล้ว!')+'</small>'+
      '<div class="bar"><i style="width:'+Math.round(((per-toNext)/per)*100)+'%"></i></div></span>'+
      (isNew ? '<span class="new">ใหม่!</span>' : '')+'<span style="font-size:1.3rem">›</span></a>';
}

function render(){
  renderChips();
  const t = term.trim().toLowerCase();
  renderToday(!t && filter==='all');

  /* กำลังค้นหา: แสดงการ์ดที่ตรงกันจากทุกวิชา */
  if(t){
    const hit = MATERIALS.filter(x => (x.t+' '+(x.d||'')+' '+x.g+' '+(x.tags||[]).join(' ')).toLowerCase().includes(t))
      .sort((a,b) => rank(a.g)-rank(b.g));
    $('#list').innerHTML = hit.length ? '<div class="grid">'+hit.map(x => card(x,true)).join('')+'</div>'
      : '<div class="empty"><b>🙈</b>หาไม่เจอเลย ลองคำอื่นดูนะ</div>';
    return;
  }

  /* ทุกวิชา: แฟ้มละวิชา */
  if(filter==='all'){
    $('#list').innerHTML = '<div class="folders">'+groups().map(([g]) => folder(g, MATERIALS.filter(x => x.g===g))).join('')+'</div>';
    $('#list').querySelectorAll('.folder').forEach(b => b.onclick = () => openFolder(b.dataset.g));
    return;
  }

  /* ในแฟ้ม: ถ้ามีแฟ้มย่อย แสดงแฟ้มย่อยก่อน · เปิดแฟ้มย่อยแล้วค่อยเห็นการ์ด */
  const s = sub(filter), items = MATERIALS.filter(x => x.g===filter);
  const subs = [...new Set(items.map(x => x.sub).filter(Boolean))];
  if(subf){
    const sg = SUBGROUPS[subf] || s, list = items.filter(x => x.sub===subf);
    $('#list').innerHTML = '<section class="group" style="'+vars(sg)+'"><div class="crumb">'+
        '<button type="button" class="backbtn" id="back">‹ '+esc(filter)+'</button>'+
        '<div class="ghead"><span class="gi">'+(sg.e||s.e)+'</span><h2>'+esc(subf)+'</h2></div></div>'+
      '<div class="grid">'+list.map(x => card(x)).join('')+'</div></section>';
    $('#back').onclick = () => openFolder(filter);
    return;
  }
  const loose = items.filter(x => !x.sub);
  $('#list').innerHTML = '<section class="group" style="'+vars(s)+'"><div class="crumb">'+
      '<button type="button" class="backbtn" id="back">‹ ทุกวิชา</button>'+
      '<div class="ghead"><span class="gi">'+s.e+'</span><h2>'+esc(filter)+'</h2></div></div>'+
    (subs.length ? '<div class="folders">'+subs.map(n => subFolder(filter, n, items.filter(x => x.sub===n))).join('')+'</div>' : '')+
    (loose.length ? '<div class="grid"'+(subs.length?' style="margin-top:22px"':'')+'>'+loose.map(x => card(x)).join('')+'</div>' : '')+
    '</section>';
  $('#list').querySelectorAll('.folder[data-sub]').forEach(b => b.onclick = () => openFolder(b.dataset.g, b.dataset.sub));
  $('#back').onclick = () => openFolder('all');
}

$('#q').addEventListener('input', e => { term = e.target.value; render(); });
/* กลับมาหน้านี้ด้วยปุ่มย้อนกลับ ให้อัปเดตภารกิจและดาวล่าสุด */
addEventListener('pageshow', e => { if(e.persisted) render(); });

/* แตะน้องแล้วกระโดดดึ๋ง พร้อมเปลี่ยนคำพูด */
(function(){
  const kid = $('#kid'), bubble = $('#bubble');
  const LINES = ['มาเรียนกันเถอะ!','ส่งหัวใจให้นะ 💖','วันนี้สู้ ๆ นะ!','เก่งที่สุดเลย!','เล่นเกมกันไหม?','ทำได้แน่นอน!'];
  let i = 0;
  kid.addEventListener('click', () => {
    kid.classList.remove('jump'); void kid.offsetWidth; kid.classList.add('jump');
    i = (i+1) % LINES.length; bubble.textContent = LINES[i];
    bubble.style.animation = 'none'; void bubble.offsetWidth; bubble.style.animation = '';
  });
})();

/* เปิดหน้าแรก: ตามที่อยู่ #วิชา หรือถ้าเพิ่งกลับมาจากแบบฝึก ให้เปิดแฟ้มวิชาของแบบฝึกนั้น */
[filter, subf] = fromHash();
if(filter==='all' && document.referrer){
  try{
    const from = new URL(document.referrer);
    if(from.origin===location.origin){
      const same = MATERIALS.filter(x => x.url && from.pathname.endsWith('/'+x.url.split('#')[0]));
      if(same.length){
        filter = same[0].g;
        const sb = [...new Set(same.map(x => x.sub))];
        subf = sb.length===1 && sb[0] ? sb[0] : null;   /* ไฟล์เดียวมีหลายแฟ้มย่อย (เช่นหน้าเกม) ให้กลับไปแฟ้มหลัก */
        history.replaceState(null, '', hashOf(filter, subf));
      }
    }
  }catch(e){}
}
render();
</script>
