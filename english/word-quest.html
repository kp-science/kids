<!doctype html>
<html lang="th">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<link rel="apple-touch-icon" href="../apple-touch-icon.png">
<link rel="icon" type="image/png" href="../favicon.png">
<title>สวนคำศัพท์อังกฤษ Unit 1–5</title>
<link rel="stylesheet" href="../vendor/fonts/fonts.css">
<style>
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
:root{--ink:#3A3350;--mute:#6E6785;--line:#EBE6F0;--ok:#2F9E5B;--okbg:#EAF8EF;--no:#D2693C;--nobg:#FFF0E8;
  --c:#C9A8FF;--d:#6E3CC0;--l:#EFE5FF;
  --emo:"Apple Color Emoji","Segoe UI Emoji","Noto Color Emoji",sans-serif}
body{background:#FFFBF4;color:var(--ink);font-family:'Noto Sans Thai Looped','Noto Sans Thai',sans-serif;
  font-size:18px;line-height:1.6;-webkit-text-size-adjust:100%;min-height:100vh}
body::before{content:"";position:fixed;inset:0;pointer-events:none;z-index:-1;
  background:radial-gradient(circle at 0% 12%,#FFE3EF 0 130px,transparent 131px),
             radial-gradient(circle at 100% 34%,#E2F0FF 0 110px,transparent 111px),
             radial-gradient(circle at 0% 72%,#E3F7DF 0 140px,transparent 141px),
             radial-gradient(circle at 100% 92%,#FFEBD6 0 120px,transparent 121px)}
button{font:inherit;color:inherit;cursor:pointer;border:none;background:none}
.en{font-family:'Andika','Mali',sans-serif}
.mali{font-family:'Mali',sans-serif;font-weight:700}

.top{position:sticky;top:0;z-index:20;background:rgba(255,251,244,.93);backdrop-filter:blur(6px);
  box-shadow:0 4px 18px rgba(58,51,80,.06);padding-top:env(safe-area-inset-top)}
.top .in{max-width:860px;margin:0 auto;padding:8px 14px;display:flex;align-items:center;gap:10px}
.back{color:var(--d);background:#fff;border-radius:999px;padding:5px 14px;font-size:.9rem;font-weight:700;
  white-space:nowrap;box-shadow:0 3px 12px rgba(58,51,80,.12);text-decoration:none}
.top .tt{flex:1;font-family:'Mali',sans-serif;font-weight:700;overflow:hidden;white-space:nowrap;text-overflow:ellipsis}
.chip{background:#fff;color:var(--d);border-radius:999px;padding:4px 12px;font-weight:700;font-size:.9rem;
  white-space:nowrap;box-shadow:0 3px 12px rgba(58,51,80,.12)}
.wrap{max-width:860px;margin:0 auto;padding:12px 16px 80px}

.card{background:#fff;border-radius:26px;padding:16px;box-shadow:0 6px 18px rgba(58,51,80,.07);margin-bottom:14px}
.btn{background:var(--d);color:#fff;border-radius:999px;padding:10px 22px;font-weight:700;margin:4px;
  box-shadow:0 6px 16px rgba(58,51,80,.16)}
.btn.gh{background:#fff;color:var(--d);box-shadow:0 3px 12px rgba(58,51,80,.12)}
.btn:active,.stage:active,.ucard:active{transform:scale(.97)}

/* ---------- home ---------- */
.hero{border-radius:30px;margin-top:6px;padding:22px 18px 20px;text-align:center;
  background:linear-gradient(160deg,#FFE3EF,#EFE5FF 55%,#E2F0FF);box-shadow:0 12px 30px rgba(58,51,80,.10)}
.hero .deco{font-family:var(--emo);font-size:2.1rem;letter-spacing:6px}
.hero h1{font-family:'Mali',sans-serif;font-size:1.6rem;line-height:1.3;color:#6E3CC0}
.hero p{color:var(--mute);font-weight:600;font-size:.95rem}
.review{display:flex;align-items:center;gap:14px;width:100%;text-align:left;background:#fff;border-radius:24px;
  padding:14px 16px;margin:16px 0;box-shadow:0 6px 18px rgba(58,51,80,.08)}
.review .ic{font-family:var(--emo);font-size:2.2rem}
.review b{display:block;font-family:'Mali',sans-serif;font-size:1.1rem}
.review i{font-style:normal;color:var(--mute);font-size:.9rem}
.review .go{margin-left:auto;background:#FFF3DC;color:#B8741A;border-radius:999px;padding:6px 14px;font-weight:700;white-space:nowrap}
.units{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:14px}
.ucard{text-align:left;background:#fff;border-radius:26px;padding:14px 16px;box-shadow:0 6px 18px rgba(58,51,80,.08);
  border-top:10px solid var(--c);display:flex;flex-direction:column;gap:6px}
.ucard .row{display:flex;align-items:center;gap:12px}
.ucard .em{font-family:var(--emo);font-size:2.2rem;background:var(--l);border-radius:18px;width:62px;height:62px;
  display:grid;place-items:center;flex:none}
.ucard .un{font-size:.8rem;font-weight:700;color:var(--d)}
.ucard b{display:block;font-size:1.25rem;line-height:1.2}
.ucard i{font-style:normal;color:var(--mute);font-size:.9rem}
.garden{font-family:var(--emo);font-size:1.05rem;letter-spacing:1px;line-height:1.5;word-break:break-all}
.meter{height:9px;background:var(--line);border-radius:99px;overflow:hidden}
.meter>i{display:block;height:100%;background:var(--c);border-radius:99px}
.small{font-size:.85rem;color:var(--mute)}

/* ---------- unit ---------- */
.uhead{border-radius:30px;padding:18px;text-align:center;background:linear-gradient(170deg,var(--l),#fff);
  box-shadow:0 10px 26px rgba(58,51,80,.09);margin:6px 0 16px}
.uhead .em{font-family:var(--emo);font-size:2.6rem}
.uhead h1{font-family:'Mali',sans-serif;color:var(--d);font-size:1.55rem;line-height:1.25}
.stages{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:12px;margin-bottom:18px}
.stage{display:flex;align-items:center;gap:12px;text-align:left;background:#fff;border-radius:22px;padding:12px 14px;
  box-shadow:0 5px 16px rgba(58,51,80,.08);position:relative}
.stage .ic{font-family:var(--emo);font-size:1.7rem;width:52px;height:52px;border-radius:16px;background:var(--l);
  display:grid;place-items:center;flex:none}
.stage b{display:block;font-size:1.05rem}
.stage i{font-style:normal;color:var(--mute);font-size:.82rem;display:block;line-height:1.35}
.stage .st{margin-left:auto;font-family:var(--emo);font-size:.95rem;white-space:nowrap}
.stage.next{outline:3px solid var(--c);outline-offset:2px}
.stage.next::before{content:"เริ่มตรงนี้";position:absolute;top:-11px;right:14px;background:var(--d);color:#fff;
  font-size:.72rem;font-weight:700;border-radius:99px;padding:1px 10px}
h2.sec{font-family:'Mali',sans-serif;font-size:1.15rem;margin:18px 4px 8px;color:var(--d)}
.wchips{display:flex;flex-wrap:wrap;gap:8px}
.wchip{background:#fff;border-radius:999px;padding:5px 12px 5px 8px;box-shadow:0 3px 10px rgba(58,51,80,.08);
  display:flex;align-items:center;gap:6px;font-size:.95rem}
.wchip .pl{font-family:var(--emo)}
.legend{font-size:.82rem;color:var(--mute);margin:8px 4px 0}
.legend span{font-family:var(--emo)}

/* ---------- pictures ---------- */
.pic{font-family:var(--emo);line-height:1;display:inline-flex;align-items:center;justify-content:center;gap:.08em}
.pic svg{width:1em;height:1em;display:block}
.pic .num{font-family:'Mali',sans-serif;font-weight:700;color:var(--d);background:var(--l);border-radius:.25em;
  font-size:.62em;padding:.05em .25em;line-height:1.15}
.pic svg.days{width:2.6em;height:.8em}
.pic svg.scene{width:2em;height:2em}
.cmp{display:inline-flex;align-items:flex-end;gap:.12em}
.cmp .hl{border-radius:.18em;outline:.05em solid var(--d);outline-offset:.04em;background:var(--l)}
.cmp .fd{opacity:.35}
.cmp.col{flex-direction:column;align-items:center;gap:.1em}
.many i{font-style:normal}
.many{display:inline-grid;grid-template-columns:repeat(5,auto);gap:.08em .12em;font-size:.42em}
.nope{position:relative;display:inline-block}
.nope::after{content:"✕";position:absolute;inset:0;display:grid;place-items:center;color:#E0605A;font-family:sans-serif;
  font-weight:700;font-size:1.1em}
.face{font-size:.7em}
.prof{display:inline-grid;grid-template-columns:auto auto;gap:.1em .25em;align-items:center;background:#FFFDF7;
  border-radius:.2em;padding:.12em .2em;box-shadow:0 2px 10px rgba(58,51,80,.1)}
.prof .who{font-size:.9em;grid-row:span 3}
.prof .ln{font-size:.3em;font-family:'Mali',sans-serif;font-weight:700;color:var(--ink);display:flex;align-items:center;gap:.25em;white-space:nowrap}
.prof .ln em{font-family:var(--emo);font-style:normal;font-size:1.3em}
.basket{display:inline-flex;flex-wrap:wrap;justify-content:center;gap:.06em;max-width:2.8em;padding:.12em .14em .1em;
  border:.06em solid #C99A5B;border-top-width:.1em;border-radius:.08em .08em .35em .35em;background:#FFF6E6;font-size:.62em}
.basket.lunch{border-color:#7FB3E0;background:#EEF6FF;border-radius:.25em}
.week{display:grid;grid-template-columns:repeat(7,1fr);gap:.06em;font-size:.52em}
.week div{background:var(--l);border-radius:.25em;padding:.12em .05em;text-align:center}
.week small{display:block;font-family:'Mali',sans-serif;font-weight:700;font-size:.42em;color:var(--d)}
.week .on{outline:.08em solid var(--d)}

/* ---------- play ---------- */
.phead{display:flex;align-items:center;gap:10px;margin:4px 0 12px}
.prog{flex:1;height:12px;background:#fff;border-radius:99px;overflow:hidden;box-shadow:inset 0 0 0 2px var(--line)}
.prog>i{display:block;height:100%;background:var(--c);border-radius:99px;transition:width .35s}
.hearts{font-family:var(--emo);font-size:1.05rem;white-space:nowrap}
.qcard{background:#fff;border-radius:28px;padding:16px;box-shadow:0 8px 24px rgba(58,51,80,.08);text-align:center}
.qtop{display:flex;align-items:center;justify-content:center;gap:10px;flex-wrap:wrap;font-weight:700;font-size:1.05rem;margin-bottom:10px}
.qtop .en{font-size:1.45rem;font-weight:700}
.say{background:var(--l);color:var(--d);border-radius:999px;padding:6px 14px;font-weight:700;font-size:1rem;white-space:nowrap}
.say.big{padding:10px 18px;font-size:1.15rem}
.say:active{transform:scale(.95)}
.thline{color:var(--mute);font-size:.95rem;margin:4px 0}
.reveal{color:var(--mute);font-size:.85rem;text-decoration:underline;margin:2px 0 6px}
.bigpic{font-size:112px;margin:6px 0 4px;display:flex;justify-content:center}
.ppgrid{display:grid;grid-template-columns:repeat(2,1fr);gap:12px;margin-top:8px}
.pcard .pic svg.days{width:2.1em}
.pcard{overflow:hidden;background:#fff;border-radius:22px;border:3px solid var(--line);font-size:74px;padding:14px 6px;display:flex;justify-content:center;align-items:center;min-height:120px}
.pcard.right,.opt.right,.lt.right{border-color:#9EDDB2;background:var(--okbg)}
.pcard.wrong,.opt.wrong,.lt.wrong{border-color:#F4C2A8;background:var(--nobg)}
.pcard.done,.opt.done{pointer-events:none}
.opts{display:grid;gap:10px;margin-top:10px;text-align:left}
.optwrap{display:flex;gap:8px;align-items:stretch}
.opt{flex:1;background:#fff;border:3px solid var(--line);border-radius:18px;padding:10px 14px;font-size:1.25rem;
  font-weight:700;text-align:left;font-family:'Andika','Mali',sans-serif}
.opts.two{grid-template-columns:1fr 1fr}
.sayb{width:62px;flex:none;border:2px solid var(--line);background:#fff;border-radius:16px;color:var(--d);
  font-size:1.1rem;display:grid;place-items:center;line-height:1.05}
.sayb::after{content:"ฟัง";display:block;font-size:.66rem;font-weight:700}
.opts .optwrap:nth-child(4n+1) .opt:not(.right):not(.wrong){background:#FFF6FA}
.opts .optwrap:nth-child(4n+2) .opt:not(.right):not(.wrong){background:#F4F9FF}
.opts .optwrap:nth-child(4n+3) .opt:not(.right):not(.wrong){background:#FFFBEA}
.opts .optwrap:nth-child(4n+4) .opt:not(.right):not(.wrong){background:#F3FBF1}
.opt.dim{opacity:.4;pointer-events:none}
.fb{min-height:30px;margin-top:12px;font-weight:700;font-size:1.05rem}
.fb.ok{color:var(--ok)} .fb.no{color:var(--no)}
.next{margin-top:10px}

/* spelling */
.slots{display:flex;justify-content:center;flex-wrap:nowrap;gap:6px;margin:12px 0}
.slots>*{flex:0 1 auto;min-width:18px}
.slot{width:46px;height:56px;border-radius:12px;background:var(--l);border-bottom:4px solid var(--c);display:grid;place-items:center;
  font-family:'Andika','Mali',sans-serif;font-size:2rem;font-weight:700;position:relative}
.slot.cur{background:#fff;box-shadow:0 0 0 3px var(--c)}
.slot .gh{color:#C9C2D6;font-weight:400}
.slot.fill{color:var(--d);background:#fff}
.slot.v.fill{color:#D2693C}
.slot.bad{background:var(--nobg)}
.gap{width:18px}
.dash{font-size:2rem;font-weight:700;align-self:center}
.tiles{display:flex;flex-wrap:wrap;justify-content:center;gap:9px;margin-top:6px}
.tile{min-width:54px;height:58px;padding:0 10px;border-radius:14px;background:#fff;border:3px solid var(--line);font-family:'Andika','Mali',sans-serif;
  font-size:1.8rem;font-weight:700;box-shadow:0 4px 0 var(--line)}
.tile.used{visibility:hidden}
.tile.glow{border-color:var(--c);animation:pulse 1s infinite}
.shake{animation:shake .4s}
@keyframes shake{0%,100%{transform:translateX(0)}25%{transform:translateX(-7px)}75%{transform:translateX(7px)}}
@keyframes pulse{50%{transform:scale(1.1)}}
.cover{font-size:.95rem;color:var(--d);font-weight:700;min-height:26px}
.vwopts{display:flex;justify-content:center;gap:14px;margin-top:10px}
.vwopts .tile{min-width:74px;height:74px;font-size:2.4rem}
.tile.right{border-color:#9EDDB2;background:var(--okbg)}
.tile.wrong{border-color:#F4C2A8;background:var(--nobg)}

/* build */
.line{min-height:66px;border-radius:18px;background:var(--l);padding:8px;display:flex;flex-wrap:wrap;gap:8px;justify-content:center;align-items:center;margin:10px 0}
.line.ok{background:var(--okbg)}
.wt{padding:8px 14px;border-radius:14px;background:#fff;border:3px solid var(--line);font-family:'Andika','Mali',sans-serif;
  font-size:1.35rem;font-weight:700;box-shadow:0 3px 0 var(--line)}
.wt.bad{border-color:#F4C2A8;background:var(--nobg)}
.endmark{font-size:1.6rem;font-weight:700}

/* mystery */
.mbox{position:relative;width:220px;height:220px;margin:6px auto;border-radius:24px;overflow:hidden;background:#fff;box-shadow:inset 0 0 0 3px var(--line)}
.mbox .pic{position:absolute;inset:0;font-size:150px}
.mgrid{position:absolute;inset:0;display:grid;grid-template-columns:repeat(3,1fr)}
.mgrid i{background:var(--c);border:2px solid #fff;transition:opacity .45s,transform .45s}
.mgrid i:nth-child(odd){background:var(--d)}
.mgrid i.off{opacity:0;transform:scale(.6)}

/* meet */
.meet{background:#fff;border-radius:30px;padding:16px;box-shadow:0 8px 24px rgba(58,51,80,.08);text-align:center}
.meet .bigpic{font-size:130px}
.word{font-family:'Andika','Mali',sans-serif;font-size:2.8rem;font-weight:700;letter-spacing:1px;line-height:1.2}
.word .v{color:#D2693C}
.meet .th{font-size:1.25rem;font-weight:700;color:var(--mute)}
.mbtns{display:flex;justify-content:center;flex-wrap:wrap;gap:8px;margin:12px 0 6px}
.nav{display:flex;justify-content:space-between;align-items:center;margin-top:12px}
.dots{font-size:.85rem;color:var(--mute);font-weight:700}
.sent{display:flex;align-items:center;gap:10px;text-align:left;padding:9px 4px;border-bottom:2px dashed var(--line)}
.sent:last-child{border:none}
.sent .en{font-size:1.2rem;font-weight:700;display:block}
.sent .t{font-size:.9rem;color:var(--mute)}
.sent div{flex:1}
.phon{font-family:'Andika','Mali',sans-serif;font-size:1.55rem;font-weight:700;line-height:1.5;margin:10px 0}
.phon b{color:#D2693C;text-decoration:underline}
.cvc{display:flex;flex-wrap:wrap;justify-content:center;gap:8px;margin-top:8px}
.cvc button{background:var(--l);border-radius:16px;padding:6px 12px;font-family:'Andika',sans-serif;font-weight:700;font-size:1.2rem}
.cvc span{font-family:var(--emo);margin-right:4px}

/* end */
.end{text-align:center}
.end .stars{font-family:var(--emo);font-size:3rem;letter-spacing:6px;margin:6px 0}
.end h2{font-family:'Mali',sans-serif;color:var(--d)}
.miss{display:flex;flex-wrap:wrap;gap:8px;justify-content:center;margin:10px 0}
.miss button{background:var(--nobg);border-radius:999px;padding:4px 12px;font-family:'Andika',sans-serif;font-weight:700}

.micbox{margin-top:12px;display:flex;flex-direction:column;align-items:center;gap:6px}
.mic{width:86px;height:86px;border-radius:50%;background:var(--d);color:#fff;font-size:2.4rem;box-shadow:0 8px 20px rgba(58,51,80,.22);font-family:var(--emo)}
.mic.on{background:#E0605A;animation:pulse 1s infinite}
.small-mic .mic{width:64px;height:64px;font-size:1.8rem}
.mtip{font-size:.9rem;color:var(--mute);font-weight:600}
.heard{font-family:'Andika','Mali',sans-serif;font-size:1.15rem;min-height:1.4em}
.wchk{display:flex;flex-wrap:wrap;gap:6px;justify-content:center;margin:4px 0}
.wchk span{border-radius:999px;padding:2px 12px;font-family:'Andika',sans-serif;font-weight:700}
.wchk .y{background:var(--okbg);color:var(--ok)} .wchk .n{background:#F1EEF5;color:#9C95AA}
.mok{color:var(--ok);font-weight:700} .mno{color:var(--no);font-weight:700}
.mnote{background:#FFF6E6;border-radius:14px;padding:8px 12px;font-size:.88rem;color:#8A5A15;max-width:460px}
.spk{font-size:1.6rem;font-weight:700;margin:6px 0}
@media (max-width:520px){
  .bigpic{font-size:92px} .meet .bigpic{font-size:104px}
  .pcard{font-size:58px;min-height:100px}
  .slot{width:36px;height:48px;font-size:1.6rem}
  .tile{min-width:46px;height:52px;font-size:1.55rem}
  .opt{font-size:1.1rem}
  .word{font-size:2.2rem}
  .week{font-size:.4em}
  .slots{gap:3px} .slots.long .slot{width:30px;height:44px;font-size:1.3rem} .slots.long .gap{width:10px}
  .opts.two{grid-template-columns:1fr}
}
</style>
</head>
<body>
<div class="top"><div class="in">
  <a class="back" id="back" href="../index.html#ภาษาอังกฤษ">← กลับ</a>
  <div class="tt" id="tt">สวนคำศัพท์อังกฤษ</div>
  <div class="chip" id="chip"></div>
</div></div>
<div class="wrap" id="app"></div>

<script>
/* =================================================================
   สวนคำศัพท์อังกฤษ Unit 1–5  (จากหนังสือเรียนที่ผู้ใช้ถ่ายมา 2026-09-23)
   แนวคิด: ไม่ท่องจำ แต่ "ดึงคำออกจากความจำ" ซ้ำแบบเว้นระยะ
   - ทุกคำมีกล่องความจำ b = 0..5  ตอบถูกครั้งแรก → b+1 (วันละครั้ง) · ผิด → b-1 แล้วกลับมาทบทวนวันนี้
   - ครบกำหนดทบทวนตาม GAP วัน → โผล่ในปุ่ม "ทบทวนวันนี้"
   - สะกดคำถอนตัวช่วยตาม b: 0 = มีตัวจางให้ต่อตาม · 1 = ดูคำแล้วปิด · 2+ = ฟังอย่างเดียว
   ข้อมูลคำ: [คำ, ความหมาย, รูป, flags, กลุ่ม]  flags: n = ใช้ในภาพปริศนาได้ · s = ใช้ฝึกสะกดได้
   รูป: อิโมจิ · '#key' = SVG วาดเอง · 'day:i' · 'num:n' · 'cmp:e:kind' · 'prep:x'
   ================================================================= */
const U = [
 { name:'At School', th:'ที่โรงเรียน', e:'🏫', c:'#FF9EC4', d:'#C2306F', l:'#FFE3EF', v:'a',
   words:[
    ['ruler','ไม้บรรทัด','📏','ns','sch'],['pen','ปากกา','🖊️','ns','sch'],['book','หนังสือ','📕','ns','sch'],
    ['eraser','ยางลบ','#eraser','ns','sch'],['pencil case','กล่องดินสอ','#pcase','ns','sch'],['pencil','ดินสอ','✏️','ns','sch'],
    ['desk','โต๊ะเรียน','#desk','ns','sch'],['notebook','สมุด','📓','ns','sch'],['bag','กระเป๋า','🎒','ns','sch'],

function scene(a,o,p){
  const A=t=>'<text '+EMO+' x="50" '+t+'>'+a+'</text>', O=t=>'<text '+EMO+' x="50" '+t+'>'+o+'</text>';
  const body = p==='in'    ? A('y="50" font-size="30"')+O('y="92" font-size="56"')
             : p==='on'    ? O('y="92" font-size="50"')+A('y="52" font-size="30"')
             :               O('y="64" font-size="56"')+A('y="96" font-size="26"');
  return '<svg class="scene" viewBox="0 0 100 100">'+body+'</svg>';
}
function days(i){
  let s='<svg class="days" viewBox="0 0 140 40">';
  'MTWTFSS'.split('').forEach((c,k)=>{ const on=k===i;
    s+='<rect x="'+(k*20+1)+'" y="3" width="18" height="34" rx="5" fill="'+(on?'var(--d)':'var(--l)')+'"/>'+
       '<text x="'+(k*20+10)+'" y="27" text-anchor="middle" font-family="Mali,sans-serif" font-weight="700" font-size="16" fill="'+(on?'#fff':'var(--d)')+'">'+c+'</text>'; });
  return s+'</svg>';
}
function pic(p){
  if(Array.isArray(p)) return '<span class="pic">'+p.map(x=>pic(x).replace(/^<span class="pic">|<\/span>$/g,'')).join('')+'</span>';
  let h;
  if(p[0]==='#') h=SVG[p.slice(1)];
  else if(p.startsWith('day:')) h=days(+p.slice(4));
  else if(p.startsWith('num:')) h='<span class="num">'+p.slice(4)+'</span>';
  else if(p.startsWith('prep:')) h=scene('🐸', p==='prep:under'?'🪑':'📦', p.slice(5));
  else if(p.startsWith('cmp:')){
    const [,e,k]=p.split(':');
    if(k==='big'||k==='small'){ const big='<b class="'+(k==='big'?'hl':'fd')+'">'+e+'</b>', sm='<b class="'+(k==='small'?'hl':'fd')+'" style="font-size:.45em">'+e+'</b>';
      h='<span class="cmp">'+big+sm+'</span>'; }
    else { const lg='<b class="'+(k==='long'?'hl':'fd')+'">🚂'+e+e+e+'</b>', sh='<b class="'+(k==='short'?'hl':'fd')+'">🚂'+e+'</b>';
      h='<span class="cmp col" style="font-size:.42em">'+lg+sh+'</span>'; }
  }
  else h=p;
  return '<span class="pic">'+h+'</span>';
}

   .replace(/\b(what|where|he|she|here|that|there)'s\b/g,'$1 is').replace(/(\w)'s\b/g,'$1 is')
   .replace(/-/g,' ').replace(/\b(\d+)\b/g,(m,d)=>NUMW[+d]||d).replace(/[^a-z' ]/g,' ').replace(/'/g,'');
  return s.split(/\s+/).filter(Boolean);
}
function lev(a,b){ const m=a.length,n=b.length; if(!m) return n; if(!n) return m; let p=[...Array(n+1).keys()];
  for(let i=1;i<=m;i++){ const c=[i]; for(let j=1;j<=n;j++) c[j]=Math.min(p[j]+1,c[j-1]+1,p[j-1]+(a[i-1]===b[j-1]?0:1)); p=c; } return p[n]; }
function near(t,h){ if(!h) return false; if(t===h) return true; if(t.length<3) return false;
  const d=lev(t,h); return t.length>=7?d<=2 : t.length>=4?d<=1 : (d<=1&&t[0]===h[0]&&t.length===h.length); }
const heardHas=(H,t)=>H.some(h=>near(t,h)||near(t,ALIAS[h]));
function contentOf(s){ const T=toks(s), c=T.filter(t=>!STOPW.has(t)); return c.length?c:T; }
/* ตรวจเสียงที่ได้ยิน (หลายแบบ) กับประโยคเป้าหมาย */
function judge(target,alts,key,neg){
  const C=contentOf(target); let best=null;
  key=(key||[]).concat(C.filter(t=>t==='not'||t==='no'||t==='yes'));
  (alts||[]).forEach(a=>{ const H=toks(a), hit=C.map(t=>heardHas(H,t));
    const joined=H.join('').includes(C.join(''));
    const missKey=key.find(k=>!heardHas(H,k)), badNeg=(neg||[]).find(n=>H.includes(n)), keyOK=!missKey, negOK=!badNeg;
    const ratio=joined?1:hit.filter(Boolean).length/C.length, pass=ratio>=0.6&&keyOK&&negOK;
    const sc=(pass?10:0)+ratio; if(!best||sc>best.sc) best={sc,pass,hit:joined?C.map(()=>true):hit,text:a,keyOK,negOK,missKey,badNeg}; });
  return best||{pass:false,hit:C.map(()=>false),text:'',sc:0};
}
/* คำที่ใช้แยกคำตอบถูกออกจากตัวหลอกตัวแรก */
function contrast(right,wrong){ const R=contentOf(right), Wt=contentOf(wrong||'');
  return {key:R.filter(t=>!Wt.includes(t)), neg:Wt.filter(t=>!R.includes(t))}; }

let REC=null, RECMEDIA=null;
function stopMic(){ try{ REC&&REC.abort(); }catch(e){} REC=null; try{ RECMEDIA&&RECMEDIA.stop(); }catch(e){} }
function hear(onPartial,onDone){
  try{ synth&&synth.cancel(); }catch(e){}
  let r; try{ r=new SR(); }catch(e){ onDone(null,'not-allowed'); return; }
  REC=r; r.lang='en-US'; r.interimResults=true; r.maxAlternatives=5; r.continuous=false;
  let alts=null, last='', err=null, ended=false;
  r.onresult=e=>{ const res=[...e.results]; last=res.map(x=>x[0].transcript).join(' ').trim(); onPartial(last);
    const fin=res[res.length-1]; if(fin.isFinal){ const pre=res.slice(0,-1).map(x=>x[0].transcript).join(' ');
      alts=[...fin].map(a=>(pre+' '+a.transcript).trim()); } };
  r.onerror=e=>{ err=e.error; };
  r.onend=()=>{ if(ended) return; ended=true; if(REC===r) REC=null; onDone(alts||(last?[last]:null),err); };
  try{ r.start(); }catch(e){ ended=true; REC=null; onDone(null,'not-allowed'); return; }
  later(()=>{ try{ r.stop(); }catch(e){} },7000);
}
async function recordClip(onStart){
  const st=await navigator.mediaDevices.getUserMedia({audio:true});
  return new Promise(res=>{ const mr=new MediaRecorder(st), ch=[]; RECMEDIA=mr;
    mr.ondataavailable=e=>{ if(e.data.size) ch.push(e.data); };
    mr.onstop=()=>{ st.getTracks().forEach(t=>t.stop()); RECMEDIA=null; res(URL.createObjectURL(new Blob(ch,{type:mr.mimeType||'audio/mp4'}))); };
    mr.start(); onStart(mr); later(()=>{ if(mr.state==='recording') mr.stop(); },5000); });
}
/* แผงไมค์ใช้ร่วมกัน  cfg = {target, key, neg, model, rate, onPass, onFail(n), onSkip, maxTry} */
function micPanel(el,cfg){
  let tries=0, busy=false;
  const C=contentOf(cfg.target);
  el.innerHTML='<button class="mic" type="button">🎤</button><div class="mtip"></div><div class="heard"></div><div class="mres"></div>';
  const mic=el.querySelector('.mic'), tip=el.querySelector('.mtip'), heardEl=el.querySelector('.heard'), res=el.querySelector('.mres');
  const idle=()=>{ tip.textContent=SPEAKMODE==='sr'?'แตะไมค์ แล้วพูดเป็นภาษาอังกฤษ':'แตะไมค์ แล้วพูด · อัดเสียงได้ 5 วินาที'; };
  idle();
  const chips=hit=>'<div class="wchk">'+C.map((t,i)=>'<span class="'+(hit[i]?'y':'n')+'">'+(hit[i]?'✓ ':'')+esc(t)+'</span>').join('')+'</div>';
  mic.onclick=async()=>{
    if(busy){ stopMic(); return; }
    if(SPEAKMODE==='sr'){
      busy=true; mic.classList.add('on'); tip.textContent='👂 กำลังฟัง… พูดเลย (แตะไมค์อีกครั้งเมื่อพูดจบ)'; heardEl.textContent=''; res.innerHTML='';
      hear(t=>{ heardEl.textContent='“'+t+'”'; },(alts,err)=>{
        busy=false; mic.classList.remove('on'); idle();
        if(err==='not-allowed'||err==='service-not-allowed'||err==='audio-capture'||err==='language-not-supported'){
          SPEAKMODE='rec'; res.innerHTML='<div class="mnote">เครื่องนี้ยังฟังเสียงอัตโนมัติไม่ได้ (ต้องอนุญาตไมโครโฟน และเปิด Siri/การป้อนตามคำบอกในไอแพด) · เปลี่ยนเป็นอัดเสียงแล้วฟังเทียบแทน</div>'; idle(); return; }
        if(!alts){ tip.textContent=err==='network'?'ต่อเน็ตไม่ได้ ลองใหม่อีกครั้งนะ':'ไม่ได้ยินเสียงเลย พูดดัง ๆ ใกล้ ๆ เครื่องนะ'; return; }
        const j=judge(cfg.target,alts,cfg.key,cfg.neg); heardEl.textContent='ได้ยินว่า “'+j.text+'”';
        if(j.pass){ res.innerHTML=chips(j.hit)+'<div class="mok">พูดได้ชัดเลย! 🎉</div>'; mic.style.display='none'; tip.textContent=''; cfg.onPass&&cfg.onPass(); }
        else { tries++; const why=!j.negOK?'ได้ยินคำว่า “'+j.badNeg+'” ด้วย · ':!j.keyOK?'ยังไม่ได้ยินคำว่า “'+j.missKey+'” · ':'';
          res.innerHTML=chips(j.hit)+'<div class="mno">'+why+'ฟังแล้วลองพูดอีกครั้งนะ</div>';
          if(cfg.model) later(()=>say(cfg.model,{rate:cfg.rate||.72}),500);
          cfg.onFail&&cfg.onFail(tries);
          if(cfg.onSkip && tries>=(cfg.maxTry||3) && !el.querySelector('.skip')){
            const b=document.createElement('button'); b.className='btn gh skip'; b.textContent='ข้ามไปก่อน ▶'; b.onclick=()=>{ stopMic(); cfg.onSkip(); }; el.appendChild(b); } }
      });
    } else {
      if(!navigator.mediaDevices||!window.MediaRecorder){ res.innerHTML='<div class="mnote">เครื่องนี้อัดเสียงไม่ได้ ให้พูดตามเสียงต้นแบบดัง ๆ แทนนะ</div>';
        if(!el.querySelector('.done')){ const b=document.createElement('button'); b.className='btn done'; b.textContent='พูดแล้ว ✓'; b.onclick=()=>{ b.remove(); cfg.onPass&&cfg.onPass(); }; el.appendChild(b); } return; }
      try{
        busy=true; heardEl.textContent=''; res.innerHTML='';
        const url=await recordClip(mr=>{ mic.classList.add('on'); tip.textContent='🔴 กำลังอัด… พูดเลย (แตะไมค์เพื่อหยุด)'; });
        busy=false; mic.classList.remove('on'); idle();
        res.innerHTML='<div class="mbtns"><button class="say big" type="button" data-a="me">▶️ ฟังเสียงหนู</button><button class="say big" type="button" data-a="model">🔊 ฟังต้นแบบ</button></div>'+
          '<div class="small">ฟังเทียบกัน เหมือนไหม? ถ้ายังไม่เหมือน แตะไมค์อัดใหม่ได้</div>';
        const au=new Audio(url);
        res.querySelector('[data-a=me]').onclick=()=>{ try{ au.currentTime=0; au.play(); }catch(e){} };
        res.querySelector('[data-a=model]').onclick=()=>say(cfg.model||cfg.target,{rate:cfg.rate||.8});
        if(!el.querySelector('.done')){ const b=document.createElement('button'); b.className='btn done'; b.textContent='พูดได้แล้ว ✓'; b.onclick=()=>{ b.remove(); mic.style.display='none'; cfg.onPass&&cfg.onPass(); }; el.appendChild(b); }
      }catch(e){ busy=false; mic.classList.remove('on'); res.innerHTML='<div class="mnote">เปิดไมโครโฟนไม่ได้ ต้องกดอนุญาตให้ใช้ไมโครโฟนก่อนนะ</div>'; }
    }
  };
}

/* ---------- เสียงสระสั้น (phonics) ---------- */
const VOWELS='aeiou';
function vowelQ(ui){
  const pool=[]; U.forEach((u,k)=>{ if(k<=ui) u.phon.slice(1).forEach(c=>{ pool.push({w:c[0],p:c[1],v:u.v}); if(k===ui){ pool.push({w:c[0],p:c[1],v:u.v}); pool.push({w:c[0],p:c[1],v:u.v}); } }); });
  return {t:'vw', c:pick(pool)};
}

   สร้างชุดโจทย์ของแต่ละด่าน
   ================================================================= */
const STAGES=[
 {k:'meet',  e:'👀', n:'รู้จักคำ',      d:'ดูภาพ ฟังเสียง ดูว่าสะกดยังไง'},
 {k:'listen',e:'👂', n:'ฟังแล้วแตะ',    d:'ได้ยินคำไหน แตะภาพนั้น · ดูภาพแล้วเลือกคำ'},
 {k:'myst',  e:'🔍', n:'ภาพปริศนา',     d:'ภาพค่อย ๆ โผล่ ทายให้ไว ถามว่า Is it a …?'},
 {k:'spell', e:'🔤', n:'สะกดคำ',        d:'ฟังเสียงกลางคำ แล้วเรียงตัวอักษรเป็นคำ'},
 {k:'build', e:'🧩', n:'ต่อประโยค',     d:'แตะคำเรียงให้เป็นประโยค ระวังคำหลอก 1 คำ'},
 {k:'qa',    e:'💬', n:'ถาม-ตอบ',       d:'ดูภาพ ฟังคำถาม เลือกคำตอบที่ถูก'},
 {k:'speak', e:'🎤', n:'ฝึกพูด',        d:'พูดคำจากภาพ พูดตามประโยค และตอบคำถามด้วยเสียง'},
 {k:'boss',  e:'🏆', n:'ด่านท้าทาย',    d:'รวมทุกแบบ 10 ข้อ มีหัวใจ 5 ดวง'},
];
const needFirst=(list,n)=>shuf(list).sort((a,b)=>box(a)-box(b)).slice(0,n);
function cycle(fns,n){ const out=[]; let bag=[]; while(out.length<n){ if(!bag.length) bag=shuf(fns); out.push(bag.pop()()); } return out; }
const buildQs=(ui,n)=>cycle(BUILD[ui],n).map(s=>({t:'bd',s}));
const qaQs=(ui,n)=>{ const seenQ={}; const out=[]; let guard=0;
  while(out.length<n && guard++<80){ const q=cycle(QA[ui],1)[0]; const k=q.q+'|'+q.opts[0]; if(seenQ[k]) continue; seenQ[k]=1; out.push({t:'qa',m:q}); } return out; };
const mystPool=ui=>U[ui].W.filter(x=>x.f.includes('n'));
const spellPool=ui=>U[ui].W.filter(x=>x.f.includes('s'));
function makeQs(ui,k){
  const all=U[ui].W;
  if(k==='listen') return needFirst(all,10).map((x,i)=>({t:i%2?'pw':'pp',x}));
  if(k==='myst')   return needFirst(mystPool(ui),6).map(x=>({t:'my',x}));
  if(k==='spell')  return [vowelQ(ui),vowelQ(ui),vowelQ(ui)].concat(needFirst(spellPool(ui),6).map(x=>({t:'sp',x})));
  if(k==='build')  return buildQs(ui,6);
  if(k==='qa')     return qaQs(ui,8);
  if(k==='speak')  return speakQs(ui);
  if(k==='boss'){
    const w=needFirst(all,3), sp=needFirst(spellPool(ui),2);
    return shuf([{t:'pp',x:w[0]},{t:'pw',x:w[1]},{t:'my',x:pick(mystPool(ui))},{t:'sp',x:sp[0]},{t:'sp',x:sp[1]},vowelQ(ui)]
      .concat(buildQs(ui,2)).concat(qaQs(ui,2)));
  }
  return [];
}
function speakQs(ui){
  const ws=needFirst(U[ui].W.filter(x=>x.g!=='prep'),3).map(x=>({t:'sk',kind:'word',target:x.w,p:x.p,th:x.th,x}));
  const rep=buildQs(ui,3).map(b=>({t:'sk',kind:'rep',target:b.s.en,p:b.s.p,th:b.s.th}));
  const ans=qaQs(ui,12).map(q=>q.m).filter(m=>/[?.]$/.test(m.q)&&m.q!=='My lunch box').slice(0,2).map(m=>{
    const c=contrast(m.opts[0],m.opts[1]); return {t:'sk',kind:'ans',target:m.opts[0].replace(/\.$/,''),q:m.q,p:m.p,th:m.th,key:c.key,neg:c.neg}; });
  return ws.concat(rep,ans);
}
function reviewQs(){
  return dueList().slice(0,10).map((x,i)=>x.f.includes('s')&&box(x)>=1 ? {t:'sp',x} : {t:i%2?'pw':'pp',x});
}
function distract(x,n){
  let pool=G(x.u,x.g).filter(y=>y.w!==x.w&&y.p!==x.p);
  if(pool.length<n) pool=pool.concat(shuf(U[x.u].W.filter(y=>y.g!==x.g&&y.w!==x.w)).slice(0,n-pool.length));
  return shuf(pool).slice(0,n);
}

function miss(x){
  R.first=false; R.mist++; sfxNo();
  if(x && !R.wrong.includes(x)) R.wrong.push(x);
  if(R.hearts!=null){ R.hearts--; hearts(); if(R.hearts<=0){ R.dead=true; R.lock=true; later(fail,1500); return true; } }
  return false;
}
/* ตอบข้อนี้จบแล้ว */
function solved(x){
  R.lock=true; if(R.first) R.ok++;
  if(x) grade(x,R.first);
  if(R.first){ sfxOK(); fb(pick(['เก่งมาก! 🎉','ถูกต้อง! ⭐','เยี่ยมเลย! 🌟','Great job! 👍']),'ok'); later(next,1700); }
  else { $('#nxw').innerHTML='<button class="btn next" id="nxb">ต่อไป ▶</button>'; $('#nxb').onclick=next; }
}
function next(){ if(R.dead) return; R.i++; if(R.i>=R.qs.length) finish(); else { showQ(); window.scrollTo({top:0,behavior:'smooth'}); } }
function speakBtn(id,label){ return '<button class="say" id="'+id+'">🔊 '+(label||'ฟัง')+'</button>'; }

/* 👂 ได้ยินคำ → แตะภาพ */
function QPP(q,c){
  const x=q.x, opts=shuf([x].concat(distract(x,3)));
  c.innerHTML='<div class="qtop">'+speakBtn('sq','ฟังอีกครั้ง')+'<span>ได้ยินคำไหน แตะภาพนั้น</span></div>'+
    '<div class="ppgrid">'+opts.map((y,i)=>'<button class="pcard" data-i="'+i+'">'+pic(y.p)+'</button>').join('')+'</div>';
  $('#sq').onclick=()=>say(x.w); later(()=>say(x.w),300);
  c.querySelectorAll('.pcard').forEach(b=>b.onclick=()=>{
    if(R.lock) return; const y=opts[+b.dataset.i];
    if(y===x){ b.classList.add('right'); c.querySelectorAll('.pcard').forEach(z=>z.classList.add('done')); say(x.w); fb('<span class="en">'+esc(x.w)+'</span> = '+x.th); solved(x); }
    else { b.classList.add('wrong','done'); if(miss(x)) return; const r=c.querySelectorAll('.pcard')[opts.indexOf(x)]; r.classList.add('right');
      c.querySelectorAll('.pcard').forEach(z=>z.classList.add('done')); say('This is '+(y.g==='act'||y.g==='day'||y.g==='prep'||y.g==='adj'?'':art(y.w)+' ')+y.w+'.');
      fb('ภาพนั้นคือ <span class="en">'+esc(y.w)+'</span> · คำว่า <span class="en">'+esc(x.w)+'</span> คือภาพสีเขียว','no'); solved(x); }
  });
}
/* ตัวเลือกข้อความทั่วไป (ใช้กับ ดูภาพเลือกคำ และ ถาม-ตอบ) */
function choices(c,opts,right,onDone,sayOf){
  const box=c.querySelector('.opts');
  box.innerHTML=opts.map((o,i)=>'<div class="optwrap"><button class="opt" data-i="'+i+'">'+esc(o)+'</button><button class="sayb" data-i="'+i+'">🔊</button></div>').join('');
  box.querySelectorAll('.sayb').forEach(b=>b.onclick=()=>say(sayOf?sayOf(opts[+b.dataset.i]):opts[+b.dataset.i]));
  box.querySelectorAll('.opt').forEach(b=>b.onclick=()=>{
    if(R.lock) return; const i=+b.dataset.i;
    if(i===right){ b.classList.add('right'); box.querySelectorAll('.opt').forEach(z=>z.classList.add('done')); onDone(true); }
    else { b.classList.add('wrong'); box.querySelectorAll('.opt').forEach(z=>z.classList.add('done'));
      box.querySelectorAll('.opt')[right].classList.add('right'); onDone(false); }
  });
}
/* 👀 ดูภาพ → เลือกคำ */
function QPW(q,c){
  const x=q.x, opts=shuf([x].concat(distract(x,2))), right=opts.indexOf(x);
  c.innerHTML='<div class="qtop"><span>นี่คือคำว่าอะไร</span></div><div class="bigpic">'+pic(x.p)+'</div><div class="opts"></div>';
  choices(c,opts.map(y=>y.w),right,ok=>{ say(x.w); fb('<span class="en">'+esc(x.w)+'</span> = '+x.th, ok?'ok':'no'); if(!ok && miss(x)) return; solved(x); });
}
/* 🔍 ภาพปริศนา */
const guess=y=>y.g==='act'?'Do you '+y.w.replace('my','your')+'?':'Is it '+art(y.w)+' '+y.w+'?';
const yesSay=y=>y.g==='act'?'Yes, I do! I '+y.w+'.':"Yes, it is! It's "+art(y.w)+' '+y.w+'.';
const noSay=y=>y.g==='act'?"No, I don't.":"No, it isn't.";
function QMY(q,c){
  const x=q.x, opts=shuf([x].concat(distract(x,3))), order=shuf([0,1,2,3,4,5,6,7,8]); let shown=0;
  c.innerHTML='<div class="qtop"><span class="en">'+(x.g==='act'?'What do you do?':"What's this?")+'</span><span>ภาพกำลังโผล่ ทายให้ไว!</span></div>'+
    '<div class="mbox">'+pic(x.p)+'<div class="mgrid">'+'<i></i>'.repeat(9)+'</div></div><div class="opts two"></div>';
  const cells=c.querySelectorAll('.mgrid i');
  const open=()=>{ if(shown<9) cells[order[shown++]].classList.add('off'); };
  open(); open();
  const iv=setInterval(()=>{ open(); if(shown>=8) clearInterval(iv); },1600); T.push(iv);
  later(()=>say(x.g==='act'?'What do you do?':"What's this?"),200);
  const box=c.querySelector('.opts');
  box.innerHTML=opts.map((y,i)=>'<div class="optwrap"><button class="opt" data-i="'+i+'">'+esc(guess(y))+'</button><button class="sayb" data-i="'+i+'">🔊</button></div>').join('');
  box.querySelectorAll('.sayb').forEach(b=>b.onclick=()=>say(guess(opts[+b.dataset.i])));
  box.querySelectorAll('.opt').forEach(b=>b.onclick=()=>{
    if(R.lock) return; const y=opts[+b.dataset.i];
    if(y===x){ clearInterval(iv); const peek=shown; cells.forEach(z=>z.classList.add('off')); b.classList.add('right');
      box.querySelectorAll('.opt').forEach(z=>z.classList.add('done'));
      say(guess(y)); say(yesSay(y),{queue:true});
      fb((peek<=4?'ตาไวมาก! 🔎 ':'ถูกแล้ว! ')+'<span class="en">'+esc(yesSay(y))+'</span>','ok'); solved(x); }
    else { b.classList.add('wrong','dim'); say(guess(y)); say(noSay(y),{queue:true}); fb('<span class="en">'+noSay(y)+'</span> ลองอีกที','no'); miss(x); }
  });
}
/* 🎵 เสียงสระกลางคำ */
function QVW(q,c){
  const w=q.c.w, vi=w.search(/[aeiou]/), v=w[vi], opts=shuf([v].concat(shuf(VOWELS.replace(v,'').split('')).slice(0,2)));
  c.innerHTML='<div class="qtop">'+speakBtn('sq','ฟังอีกครั้ง')+'<span>ตรงกลางคำเป็นเสียงอะไร</span></div><div class="bigpic">'+pic(q.c.p)+'</div>'+
    '<div class="slots">'+w.split('').map((ch,i)=>'<span class="slot'+(i===vi?' v cur':' fill')+'">'+(i===vi?'':ch)+'</span>').join('')+'</div>'+
    '<div class="vwopts">'+opts.map((o,i)=>'<button class="tile" data-i="'+i+'">'+o+'</button>').join('')+'</div>';
  $('#sq').onclick=()=>say(w); later(()=>say(w),300);
  c.querySelectorAll('.vwopts .tile').forEach(b=>b.onclick=()=>{
    if(R.lock) return; const o=opts[+b.dataset.i], s=c.querySelectorAll('.slot')[vi];
    c.querySelectorAll('.vwopts .tile').forEach(z=>z.style.pointerEvents='none');
    s.textContent=v; s.classList.remove('cur'); s.classList.add('fill');
    if(o===v){ b.classList.add('right'); say(w); fb('<span class="en">'+w+'</span> มีเสียง '+v+' ตรงกลาง','ok'); solved(null); }
    else { b.classList.add('wrong'); c.querySelectorAll('.vwopts .tile')[opts.indexOf(v)].classList.add('right');
      say(w); fb('ฟังดี ๆ <span class="en">'+w+'</span> ใช้ตัว '+v,'no'); if(miss(null)) return; solved(null); }
  });
}
/* 🔤 สะกดคำ  ดู → ปิด → เรียงเอง (ถอนตัวช่วยตามกล่องความจำ) */
function QSP(q,c){
  const x=q.x, w=x.w, b=Math.max(0,box(x)), ch=w.split(''), need=[]; ch.forEach((k,i)=>{ if(/[A-Za-z]/.test(k)) need.push(i); });
  const letters=need.map(i=>ch[i]);
  const extra=shuf('aeioubcdgklmnprst'.split('').filter(l=>!letters.map(z=>z.toLowerCase()).includes(l))).slice(0,letters.length>6?3:2);
  const tiles=shuf(letters.concat(extra).map((l,i)=>({l,id:i})));
  let pos=0, slotMiss=0;
  const mode=b===0?'ghost':b===1?'peek':'recall';
  c.innerHTML='<div class="qtop">'+speakBtn('sq','ฟังคำ')+'<span>'+x.th+'</span><button class="say" id="hint">💡 ช่วยหน่อย</button></div>'+
    '<div class="bigpic" style="font-size:88px">'+pic(x.p)+'</div>'+
    '<div class="cover" id="cv">'+(mode==='ghost'?'แตะตัวอักษรตามตัวจาง ๆ ให้ครบ':mode==='peek'?'👀 ดูคำให้ดี เดี๋ยวจะปิดนะ…':'🙈 ไม่มีตัวช่วยแล้ว ฟังแล้วสะกดเองเลย')+'</div>'+
    '<div class="slots'+(ch.length>7?' long':'')+'">'+ch.map((k,i)=>/[A-Za-z]/.test(k)?'<span class="slot'+('aeiou'.includes(k.toLowerCase())?' v':'')+'" data-i="'+i+'">'+(mode!=='recall'?'<span class="gh">'+k+'</span>':'')+'</span>':
      (k===' '?'<span class="gap"></span>':'<span class="dash">'+esc(k)+'</span>')).join('')+'</div>'+
    '<div class="tiles">'+tiles.map((t,i)=>'<button class="tile" data-i="'+i+'">'+t.l+'</button>').join('')+'</div>';
  const slots=[...c.querySelectorAll('.slot')], tileEls=[...c.querySelectorAll('.tile')];
  const mark=()=>slots.forEach((s,k)=>s.classList.toggle('cur',k===pos));
  let ready=mode!=='peek';
  if(mode==='peek'){ tileEls.forEach(t=>t.style.opacity='.35');
    later(()=>{ slots.forEach(s=>{ const g=s.querySelector('.gh'); if(g) g.remove(); }); $('#cv').textContent='✋ ปิดแล้ว! จำได้ไหม เรียงเลย'; tileEls.forEach(t=>t.style.opacity=''); ready=true; mark(); },2600); }
  else mark();
  $('#sq').onclick=()=>say(w); later(()=>say(w),300);
  const glow=()=>{ tileEls.forEach(t=>t.classList.remove('glow')); const k=tiles.findIndex((t,i)=>t.l===letters[pos]&&!tileEls[i].classList.contains('used')); if(k>=0) tileEls[k].classList.add('glow'); };
  $('#hint').onclick=()=>{ if(R.lock||!ready) return; R.first=false; glow(); say(letters[pos].toUpperCase()); };
  tileEls.forEach((el,i)=>el.onclick=()=>{
    if(R.lock||!ready||el.classList.contains('used')) return; const t=tiles[i];
    if(t.l===letters[pos]){
      el.classList.add('used'); el.classList.remove('glow'); const s=slots[pos]; s.innerHTML=t.l; s.classList.add('fill'); s.classList.remove('bad');
      sfxTap(); say(t.l.toUpperCase(),{rate:.9}); pos++; slotMiss=0; tileEls.forEach(z=>z.classList.remove('glow')); mark();
      if(pos===letters.length){ later(()=>{ say(w); say(spellOut(w),{queue:true,rate:.75}); say(w,{queue:true}); },450);
        fb('<span class="en">'+esc(w)+'</span> = '+x.th,'ok'); solved(x); }
    } else {
      el.classList.remove('shake'); void el.offsetWidth; el.classList.add('shake'); slots[pos].classList.add('bad');
      if(miss(x)) return; slotMiss++; if(slotMiss>=2) glow();
      fb('ยังไม่ใช่ ฟังอีกที <span class="en">'+esc(w)+'</span>','no'); say(w);
    }
  });
}
/* 🧩 ต่อประโยค */
function QBD(q,c){
  const s=q.s, m=s.en.match(/^(.*?)([.?!])$/), words=m[1].split(' '), end=m[2];
  let pool=words.slice(); if(s.decoy && !words.includes(s.decoy)) pool.push(s.decoy);
  pool=shuf(pool.map((t,i)=>({t,id:i}))); let line=[];
  c.innerHTML='<div class="qtop">'+speakBtn('sq','ฟังประโยค')+'<span>'+s.th+'</span></div>'+
    '<div class="bigpic" style="font-size:84px">'+pic(s.p)+'</div>'+
    '<div class="line" id="ln"></div><div class="tiles" id="pl"></div><p class="small" style="margin-top:8px">แตะคำเพื่อเรียง · แตะคำในแถบเพื่อเอาออก · มีคำหลอก 1 คำ</p>';
  const draw=()=>{
    $('#ln').innerHTML=line.map(id=>{ const t=pool.find(z=>z.id===id); return '<button class="wt" data-id="'+id+'">'+esc(t.t)+'</button>'; }).join('')+(line.length?'<span class="endmark">'+end+'</span>':'<span class="small">เรียงคำที่นี่</span>');
    $('#pl').innerHTML=pool.map(t=>'<button class="wt" data-id="'+t.id+'"'+(line.includes(t.id)?' style="visibility:hidden"':'')+'>'+esc(t.t)+'</button>').join('');
    $('#ln').querySelectorAll('.wt').forEach(b=>b.onclick=()=>{ if(R.lock) return; line=line.filter(z=>z!==+b.dataset.id); draw(); });
    $('#pl').querySelectorAll('.wt').forEach(b=>b.onclick=()=>{ if(R.lock) return; const id=+b.dataset.id; line.push(id); sfxTap(); say(pool.find(z=>z.id===id).t,{rate:.9}); draw(); check(); });
  };
  const check=()=>{
    if(line.length<words.length) return;
    const got=line.map(id=>pool.find(z=>z.id===id).t);
    if(got.join(' ')===words.join(' ')){ $('#ln').classList.add('ok'); say(s.en); fb('<span class="en">'+esc(s.en)+'</span>','ok'); solved(s.x||null); }
    else { const bad=got.findIndex((g,i)=>g!==words[i]); const el=$('#ln').querySelectorAll('.wt')[bad]; if(el) el.classList.add('bad');
      R.lock=true; if(miss(s.x||null)) return; fb('เกือบแล้ว! คำที่มีสีส้มยังไม่ใช่ ฟังประโยคอีกที','no');
      later(()=>{ line=line.slice(0,bad); R.lock=false; draw(); say(s.en); },1100); }
  };
  $('#sq').onclick=()=>say(s.en); later(()=>say(s.en),300);
  draw();
}
/* 🎤 ฝึกพูด */
function QSK(q,c){
  const model=q.kind==='ans'?q.target+'.':q.target;
  const head= q.kind==='word' ? '<div class="qtop"><span>ภาพนี้ภาษาอังกฤษพูดว่าอะไร</span></div>'
            : q.kind==='rep'  ? '<div class="qtop">'+speakBtn('sq','ฟังต้นแบบ')+'<span>ฟังแล้วพูดตาม</span></div>'
            :                   '<div class="qtop">'+speakBtn('sq','ฟังคำถาม')+'<span class="en">'+esc(q.q)+'</span></div>';
  const txt = q.kind==='word' ? '<div class="mbtns"><button class="say" id="hw">👀 ดูคำ</button><button class="say" id="hs">🔊 ฟังเสียง</button></div><div class="word" id="wd" style="display:none">'+colorWord(q.target)+'</div>'
            : q.kind==='rep'  ? '<div class="spk en">'+esc(q.target)+'</div><div class="thline">'+q.th+'</div>'
            :                   '<div class="thline">'+q.th+' · ตอบเป็นประโยคนะ</div><div class="mbtns"><button class="say" id="ha">💡 ดูคำตอบ</button></div><div class="spk en" id="an" style="display:none">'+esc(model)+'</div>';
  c.innerHTML=head+'<div class="bigpic" style="font-size:'+(q.kind==='word'?110:84)+'px">'+pic(q.p)+'</div>'+txt+'<div class="micbox" id="mb"></div>';
  if($('#sq')) $('#sq').onclick=()=>say(q.kind==='ans'?q.q.replace('...',''):model,{rate:.8});
  if(q.kind==='rep') later(()=>say(model,{rate:.8}),300);
  if(q.kind==='ans') later(()=>say(q.q.replace('...','')),300);
  if($('#hw')) $('#hw').onclick=()=>{ $('#wd').style.display='block'; };
  if($('#hs')) $('#hs').onclick=()=>say(model);
  if($('#ha')) $('#ha').onclick=()=>{ $('#an').style.display='block'; say(model,{rate:.8}); };
  micPanel($('#mb'),{target:q.target,key:q.key,neg:q.neg,model,
    onPass:()=>{ if(q.kind==='word') $('#wd').style.display='block'; if(q.kind==='ans') $('#an').style.display='block'; solved(null); },
    onFail:n=>{ R.first=false; if(n===1){ R.mist++; if(q.x&&!R.wrong.includes(q.x)) R.wrong.push(q.x); } if(q.kind==='word'&&n>=2) $('#wd').style.display='block'; if(q.kind==='ans'&&n>=2) $('#an').style.display='block'; },
    onSkip:()=>{ R.lock=true; next(); } });
}
/* 💬 ถาม-ตอบ */
function QQA(q,c){
  const m=q.m, opts=shuf(m.opts), right=opts.indexOf(m.opts[0]);
  const p=pic(m.p);
  c.innerHTML='<div class="bigpic" style="font-size:96px">'+p+'</div>'+
    '<div class="qtop">'+speakBtn('sq','ฟังคำถาม')+'<span class="en">'+esc(m.q)+'</span></div>'+
    '<button class="reveal" id="rv">🇹🇭 แปลคำถาม</button><div class="thline" id="thl" style="display:none">'+m.th+'</div><div class="opts"></div>';
  $('#rv').onclick=()=>{ $('#thl').style.display='block'; $('#rv').style.display='none'; say(m.th,{th:true}); };
  $('#sq').onclick=()=>say(m.q.replace('...','')); later(()=>say(m.q.replace('...','')),300);
  choices(c,opts,right,ok=>{ say(m.opts[0]); fb((ok?'ถูกต้อง! ':'คำตอบที่ถูกคือ ')+'<span class="en">'+esc(m.opts[0])+'</span>',ok?'ok':'no');
    if(!ok && miss(m.x||null)) return; solved(m.x||null); });
}

/* ---------- จบด่าน ---------- */
function finish(){
  clearT(); const n=R.qs.length, pct=R.ok/n;
  let stars = R.hearts!=null ? (R.hearts>=5?3:R.hearts>=3?2:1) : (pct>=.9?3:pct>=.7?2:1);
  const key=R.ui==null?null:R.ui+'-'+R.k;
  if(key){ S.stars[key]=Math.max(S.stars[key]||0,stars); save(); }
  const st=STAGES.find(s=>s.k===R.k), title=R.k==='review'?'ทบทวนประจำวัน':'Unit '+(R.ui+1)+' '+U[R.ui].name+' · '+st.n;
  if(window.KP) KP.log({kind:'test',page:'english-words',subject:'ภาษาอังกฤษ',title:'สวนคำศัพท์ · '+title,score:R.ok,total:n,stars,
    wrong:R.wrong.map(x=>x.w+' ('+x.th+')').slice(0,15)});
  topbar('จบด่านแล้ว!', ()=>go(()=>R.ui==null?home():unit(R.ui)));
  const nextSt=R.ui==null?null:STAGES[STAGES.findIndex(s=>s.k===R.k)+1];
  app.innerHTML='<div class="card end"><div class="stars">'+'⭐'.repeat(stars)+'<span style="opacity:.25">'+'⭐'.repeat(3-stars)+'</span></div>'+
    '<h2>'+(stars===3?'สุดยอดไปเลย!':stars===2?'เก่งมาก!':'ทำได้แล้ว! ลองอีกรอบจะเก่งขึ้นอีก')+'</h2>'+
    '<p>ตอบถูกตั้งแต่ครั้งแรก '+R.ok+' จาก '+n+' ข้อ</p>'+
    (R.wrong.length?'<p class="small" style="margin-top:10px">คำที่ต้องฝึกอีกนิด (แตะฟังได้) · เดี๋ยวจะโผล่ในปุ่มทบทวนนะ</p><div class="miss">'+R.wrong.map((x,i)=>'<button data-i="'+i+'">'+esc(x.w)+'</button>').join('')+'</div>':'')+
    '<div style="margin-top:14px"><button class="btn" id="again">🔁 เล่นอีกรอบ</button>'+
    (nextSt?'<button class="btn" id="nst">'+nextSt.e+' ด่านต่อไป</button>':'')+
    '<button class="btn gh" id="bk">กลับ</button></div></div>';
  app.querySelectorAll('.miss button').forEach(b=>b.onclick=()=>{ const x=R.wrong[+b.dataset.i]; say(x.w); say(spellOut(x.w),{queue:true,rate:.7}); });
  const ui=R.ui, k=R.k;
  $('#again').onclick=()=>go(()=>startRun(ui,k));
  if(nextSt) $('#nst').onclick=()=>go(()=>nextSt.k==='meet'?meet(ui,0):startRun(ui,nextSt.k));
  $('#bk').onclick=()=>go(()=>ui==null?home():unit(ui));
  sfxOK(); later(()=>say(stars===3?'Excellent!':'Good job!'),400);
}
function fail(){
  clearT(); const ui=R.ui, k=R.k;
  app.innerHTML='<div class="card end"><div class="stars">💔</div><h2>หัวใจหมดแล้ว</h2><p>ไม่เป็นไรนะ ลองกลับไปฝึกด่านก่อน ๆ แล้วมาใหม่</p>'+
    '<div style="margin-top:14px"><button class="btn" id="again">🔁 ลองใหม่</button><button class="btn gh" id="bk">กลับ</button></div></div>';
  $('#again').onclick=()=>go(()=>startRun(ui,k)); $('#bk').onclick=()=>go(()=>ui==null?home():unit(ui));
}

/* เปิดตรงไปยัง Unit ได้ด้วย #u1 … #u5 */
const hm=location.hash.match(/^#u([1-5])$/);
if(hm) unit(+hm[1]-1); else home();
window.__test={U,S,R:()=>R,makeQs,QA,BUILD,startRun,unit,home,meet,finish};
